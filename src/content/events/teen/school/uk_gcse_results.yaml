id: uk_gcse_results
title: GCSE results morning
text: >-
  The envelope is thin and the school hall is full. Everybody tears theirs open
  at the same moment and the noise goes up, all at once, in two colours: a
  cheer and a silence.
tone: neutral
category: school
rarity: common
countries: [uk]
lifeStages: [teen]
requires: { education: { program: [high], year: { gte: 2 } } }
weight: { base: 12 }
once: true
cast:
  friend: { kind: friend, presence: city, createIfMissing: true, newChance: 0.4 }
choices:
  - id: open
    label: Open it right there with {friend.name}
    check:
      base: 50
      stats: [{ key: smarts, weight: 0.3 }, { key: discipline, weight: 0.3 }]
      success:
        text: >-
          Seven grades above where you expected. {friend.name} screams, you laugh
          and a teacher takes a photograph of the two of you for the wall.
        effects:
          - { type: education, action: grades, value: 0.3 }
          - { type: relationship, role: friend, affection: 4 }
          - { type: stat, key: happiness, delta: 4 }
      failure:
        text: >-
          Two subjects short of what you needed. {friend.name} does not say
          anything, which is exactly the right amount of saying.
        effects:
          - { type: education, action: grades, value: -0.2 }
          - { type: relationship, role: friend, affection: 3 }
          - { type: stat, key: stress, delta: 4 }
  - id: later
    label: Take it home and open it alone
    outcome:
      text: >-
        You wait until the bus has left, sit on the wall outside and open it
        carefully. It is fine. It is, honestly, fine.
      effects:
        - { type: stat, key: stress, delta: -1 }
        - { type: stat, key: confidence, delta: 1 }
