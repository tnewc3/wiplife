id: uk_alevel_results
title: Results day
text: >-
  The A-level results post at eight in the morning, and by five past the house
  has been through every emotion. The university portal says either "unconditional"
  or "clearing", and for a moment you cannot tell which.
tone: neutral
category: school
rarity: common
countries: [uk]
lifeStages: [teen]
requires: { education: { program: [high], final: true } }
weight: { base: 12 }
once: true
cast:
  parent: { kind: parent, presence: household }
choices:
  - id: met
    label: Open the portal
    check:
      base: 55
      stats: [{ key: smarts, weight: 0.3 }, { key: discipline, weight: 0.3 }]
      success:
        text: >-
          Your firm choice is confirmed. {parent.name} reads the screen over your
          shoulder, then makes a noise that is half laugh, half sob.
        effects:
          - { type: education, action: grades, value: 0.3 }
          - { type: relationship, role: parent, affection: 4 }
          - { type: stat, key: happiness, delta: 4 }
      failure:
        text: >-
          One grade short. You spend the afternoon on the phone to universities
          that have places left, and by evening you have found a good one, with
          a course you had not planned on.
        effects:
          - { type: education, action: grades, value: -0.2 }
          - { type: relationship, role: parent, affection: 2 }
          - { type: stat, key: stress, delta: 4 }
  - id: year
    label: Tell everyone you are taking a year out
    outcome:
      text: >-
        You say it before you have thought about it, and the room goes quiet.
        {parent.name} asks what you will do with the year. You say you do not know yet.
      effects:
        - { type: relationship, role: parent, affection: -2 }
        - { type: stat, key: confidence, delta: 1 }
