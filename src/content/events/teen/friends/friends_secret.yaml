id: friends_secret
title: Don't tell anyone
text: >-
  {friend.name} makes you swear, twice, then tells you a secret that would
  get {friend.them} in real trouble if it got out.
tone: neutral
category: friends
rarity: common
lifeStages: [teen, youngAdult]
weight: { base: 6 }
cooldownYears: 6
cast:
  friend: { kind: friend, ageOffset: { min: -2, max: 2 }, createIfMissing: true, newChance: 0.2 }
choices:
  - id: keep
    label: Take it to your grave
    outcome:
      text: You never say a word. {friend.name} notices, even if {friend.they} never says so.
      effects:
        - { type: relationship, role: friend, trust: 10, affection: 3 }
        - { type: memory, role: friend, tag: kept_their_secret }
  - id: tell
    label: Tell just one person
    outcome:
      text: It feels good to say it out loud. You make them promise not to tell anyone. They promise.
      effects:
        - { type: memory, role: friend, tag: spilled_their_secret }
        - { type: stat, key: happiness, delta: 1 }
        - { type: schedule, eventId: secret_comes_out, inYears: [1, 3], cast: [friend] }
  - id: advice
    label: Talk {friend.them} into telling someone who can help
    check:
      base: 50
      stats: [{ key: confidence, weight: 0.2 }, { key: kindness, weight: 0.2 }]
      success:
        text: It takes a week of nagging, but {friend.name} does it. {friend.They} {friend:is|are} glad {friend.they} did.
        effects:
          - { type: relationship, role: friend, trust: 8, affection: 5 }
          - { type: memory, role: friend, tag: kept_their_secret }
      failure:
        text: '{friend.name} says you sound like a parent, and stops telling you things.'
        effects:
          - { type: relationship, role: friend, trust: -4 }
