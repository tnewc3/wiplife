id: learning_to_drive
title: The empty parking lot
text: >-
  {parent.name} takes you to an empty parking lot to teach you to drive.
  {parent.They} {parent:grips|grip} the door handle the entire time.
tone: neutral
category: family
rarity: common
lifeStages: [teen]
requires:
  all:
    - { age: { gte: 15 } }
    - { teen: { license: [none, permit] } }
weight: { base: 12 }
once: true
cast:
  parent: { kind: parent, presence: household }
choices:
  - id: slow
    label: Take it slow
    check:
      base: 70
      stats: [{ key: discipline, weight: 0.3 }]
      success:
        text: >-
          Three laps of the lot, then a trip around the block, then a long afternoon
          of three-point turns. By dinner you can park between two lines, and
          {parent.name} has stopped gripping anything.
        effects:
          - { type: teen, action: practice }
          - { type: teen, action: practice }
          - { type: memory, role: parent, tag: taught_you_to_drive }
          - { type: relationship, role: parent, affection: 4 }
          - { type: stat, key: confidence, delta: 2 }
      failure:
        text: >-
          You roll through a stop sign, and {parent.name} says a word you've
          never heard {parent.them} use. Practice goes on, though, and by the
          end you can, more or less, steer.
        effects:
          - { type: teen, action: practice }
          - { type: stat, key: stress, delta: 3 }
          - { type: memory, role: parent, tag: taught_you_to_drive }
  - id: floor_it
    label: Floor it
    check:
      base: 35
      stats: [{ key: confidence, weight: 0.2 }, { key: discipline, weight: 0.2 }]
      success:
        text: You're a natural, apparently. {parent.name} needs a minute.
        effects:
          - { type: teen, action: practice }
          - { type: stat, key: riskTaking, delta: 2 }
      failure:
        text: You clip a shopping cart return. {parent.name} drives home.
        effects:
          - { type: stat, key: stress, delta: 4 }
          - { type: relationship, role: parent, affection: -3 }
