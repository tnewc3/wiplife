# Follow-up to neighbor_sitter.
id: sitter_stories
title: How it used to be
text: >-
  {sitter.name} from downstairs is very old now and tells the same stories,
  but today there's one you've never heard: the year {sitter.they} ran away
  from home, and how far {sitter.they} got.
tone: light
category: family
rarity: common
lifeStages: [child, teen, youngAdult]
weight: { base: 10 }
followUpOnly: true
cast:
  sitter: { kind: acquaintance, presence: city }
choices:
  - id: record
    label: Record it on your phone
    outcome:
      text: >-
        Forty minutes of {sitter.name} laughing at {sitter.themself}. You'll
        play it again someday, when you need to hear that voice.
      effects:
        - { type: relationship, role: sitter, affection: 8 }
        - { type: stat, key: kindness, delta: 2 }
  - id: cookies
    label: Ask for the cookie recipe too
    visibleIf: { memory: { role: sitter, tag: spoiled_you } }
    outcome:
      text: >-
        "There's no recipe," {sitter.name} says. "There's just enough butter."
        {sitter.They} {sitter:writes|write} it down anyway, on a card you'll keep
        for the rest of your life.
      effects:
        - { type: relationship, role: sitter, affection: 10, trust: 5 }
        - { type: stat, key: happiness, delta: 3 }
  - id: phone
    label: Nod along while texting
    outcome:
      text: You catch the end of it. Something about a train. You mean to ask again.
      effects:
        - { type: relationship, role: sitter, affection: -2 }
