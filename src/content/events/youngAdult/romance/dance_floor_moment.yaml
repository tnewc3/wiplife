# Try it and decide (docs/design.md, section F): adults only.
id: dance_floor_moment
title: Last song
text: >-
  At a wedding reception, {admirer.name} pulls you onto the dance floor for
  the last slow song and doesn't let go when it ends.
tone: light
category: romance
rarity: rare
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { romance: [single] }
weight:
  base: 1
  modifiers:
    - { if: { discovery: { latent: [attraction] } }, x: 8 }
once: true
cast:
  admirer: { kind: acquaintance, admirer: true, createIfMissing: true, newChance: 0.7 }
choices:
  - id: stay_close
    label: Stay close. You like this.
    outcome:
      text: They have to turn the lights on to get the two of you off the floor. You don't mind at all.
      effects:
        - { type: identity, field: attraction, value: withRole, role: admirer }
        - { type: relationship, role: admirer, affection: 10 }
        - { type: memory, role: admirer, tag: danced_with_you }
        - { type: schedule, eventId: slow_song_again, inYears: [3, 8], cast: [admirer] }
        - { type: stat, key: happiness, delta: 4 }
  - id: one_dance
    label: Enjoy the dance, then say goodnight
    outcome:
      text: It's a lovely dance. It's just a dance. You both know it, and that's fine.
      effects:
        - { type: relationship, role: admirer, affection: 3 }
        - { type: memory, role: admirer, tag: danced_with_you }
        - { type: schedule, eventId: slow_song_again, inYears: [3, 8], cast: [admirer] }
  - id: excuse
    label: Make an excuse and slip away
    outcome:
      text: You suddenly need to find the bathroom, urgently, for the rest of the night.
      effects:
        - { type: stat, key: stress, delta: 1 }
