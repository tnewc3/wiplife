id: dark_season
# M1: retired. Depression now begins unnamed, is recognized through first_signs_low and is cared for through the mental health effects.
retired: true
title: The gray months
text: >-
  For weeks now, getting out of bed has felt like lifting a car. Food tastes
  like nothing. The things you used to love sit there, waiting, and you can't
  make yourself care.
tone: dark
category: health
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { health: { conditions: [depression], treated: false } }
weight: { base: 7 }
cooldownYears: 4
# C1: reviewed build warnings kept on purpose (docs/consistency-review.md).
justified:
  past: "\"The things you used to love\" describes depression in general, not a specific claim about your history."
cast:
  # C1: whoever you trust most nearby; a partner you live with comes first.
  helper: { support: true, optional: true, presence: nearby }
choices:
  - id: tell
    label: Tell {helper.name} how bad it's gotten
    visibleIf: { role: helper, where: [city] }
    outcome:
      text: >-
        {helper.name} doesn't try to fix it. {helper.They} just {helper:shows|show}
        up, every day, with soup and terrible television. It helps more than
        you can say.
      effects:
        - { type: health, conditionId: depression, severity: -15 }
        - { type: relationship, role: helper, affection: 6, trust: 6 }
        - { type: memory, role: helper, tag: cared_for_you }
        - { type: stat, key: happiness, delta: 3 }
  # C1: a partner you live with is already there.
  - id: tell_home
    label: Tell {helper.name} how bad it's gotten
    visibleIf: { role: helper, where: [household] }
    outcome:
      text: >-
        {helper.name} doesn't try to fix it. {helper.They} just {helper:makes|make}
        soup every night and {helper:sits|sit} through terrible television with
        you. It helps more than you can say.
      effects:
        - { type: health, conditionId: depression, severity: -15 }
        - { type: relationship, role: helper, affection: 6, trust: 6 }
        - { type: memory, role: helper, tag: cared_for_you }
        - { type: stat, key: happiness, delta: 3 }
  - id: therapist
    label: Find a therapist
    outcome:
      text: It takes three tries to find the right one. The fourth session is the first good day in months.
      effects:
        - { type: mental, action: start, care: therapy, conditionId: depression }
        - { type: debt, action: add, kind: medical, amount: 1200 }
        - { type: stat, key: stress, delta: -3 }
  - id: hide
    label: Keep it to yourself
    outcome:
      text: You get very good at saying "just tired." Nobody asks twice.
      effects:
        - { type: health, conditionId: depression, severity: 10 }
        - { type: stat, key: stress, delta: 3 }
