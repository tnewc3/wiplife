id: graduation_party
title: The party in the backyard
text: >-
  {parent.name} has strung lights across the backyard, ordered a sheet cake
  with your name spelled almost right, and invited relatives you haven't seen
  in years. It's your graduation party.
tone: light
category: school
rarity: common
lifeStages: [youngAdult]
requires:
  all:
    - { age: { lte: 19 } }
    - { education: { credential: [hs_diploma] } }
weight: { base: 10 }
once: true
cast:
  parent: { kind: parent }
choices:
  - id: thank
    label: Thank {parent.them} for the reading lessons
    visibleIf: { memory: { role: parent, tag: helped_with_homework } }
    outcome:
      text: '"You remember that?" {parent.name} has to go inside for a minute. When {parent.they} {parent:comes|come} back, {parent.their} eyes are red.'
      effects:
        - { type: relationship, role: parent, affection: 10, trust: 5 }
        - { type: memory, role: parent, tag: threw_graduation_party }
        - { type: stat, key: happiness, delta: 5 }
  - id: enjoy
    label: Enjoy it
    outcome:
      text: You eat too much cake and hear a distant relative's graduation story, twice.
      effects:
        - { type: relationship, role: parent, affection: 5 }
        - { type: memory, role: parent, tag: threw_graduation_party }
        - { type: stat, key: happiness, delta: 3 }
  - id: sneak_off
    label: Sneak off to see your friends
    outcome:
      text: You're gone before the cake is cut. {parent.name} saves you a piece, wrapped in foil, with a note.
      effects:
        - { type: relationship, role: parent, affection: -4 }
        - { type: stat, key: happiness, delta: 2 }
