id: lottery_ticket
title: A {$2} ticket
text: The jackpot is enormous this week, and a ticket costs {$2}.
tone: light
category: money
rarity: common
lifeStages: [youngAdult, adult, senior]
weight: { base: 6 }
cooldownYears: 12
# C1: meant to come back now and then (repeats are kept rare otherwise).
recurring: true
# C1: reviewed build warnings kept on purpose (docs/consistency-review.md).
justified:
  money: "Keeping your {$2} is the point: nothing is spent."
choices:
  - id: buy
    label: Buy a ticket
    check:
      base: 0
      stats: [{ key: luck, weight: 0.1 }]
      success:
        text: Not the jackpot, but you win {$5000}. You check the numbers eleven times.
        effects:
          - { type: money, delta: 5000 }
          - { type: stat, key: happiness, delta: 5 }
      failure:
        text: Not a single number. You knew it, but still.
        effects:
          - { type: money, delta: -2 }
  - id: save
    label: Keep your {$2}
    outcome:
      text: Your {$2} remains safe.
