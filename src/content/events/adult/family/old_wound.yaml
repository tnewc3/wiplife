# Checks a memory from early childhood (left_alone_too_long).
id: old_wound
title: The afternoon you remember
text: >-
  Out of nowhere, {parent.name} brings up the time {parent.they} left you
  alone for hours when you were tiny. {parent.They} {parent:has|have} thought
  about it for years.
tone: serious
category: family
rarity: uncommon
lifeStages: [adult, senior]
requires: { memory: { role: parent, tag: left_you_alone } }
weight: { base: 8 }
once: true
cast:
  parent: { kind: parent, presence: anywhere }
choices:
  - id: forgive
    label: Tell {parent.them} you forgive {parent.them}
    outcome:
      text: '{parent.name} holds your hand across the table and doesn''t say anything for a while. Neither do you.'
      effects:
        - { type: relationship, role: parent, affection: 10, trust: 12 }
        - { type: memory, role: parent, tag: apologized }
        - { type: stat, key: stress, delta: -4 }
        - { type: history, text: '{parent.name} apologized for leaving you alone when you were small, and you forgave {parent.them}.', importance: 2 }
  - id: honest
    label: Admit it still hurts
    outcome:
      text: It's hard to say and harder to hear. But it's the most honest conversation the two of you have ever had.
      effects:
        - { type: relationship, role: parent, trust: 8 }
        - { type: memory, role: parent, tag: apologized }
        - { type: stat, key: happiness, delta: -2 }
        - { type: stat, key: stress, delta: -2 }
  - id: dismiss
    label: Say you don't remember
    outcome:
      text: You remember. {parent.name} can tell, and lets it drop.
      effects:
        - { type: relationship, role: parent, affection: -2 }
        - { type: stat, key: stress, delta: 2 }
