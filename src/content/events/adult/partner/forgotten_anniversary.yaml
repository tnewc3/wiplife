id: forgotten_anniversary
title: What's today?
text: >-
  {spouse.name} comes down to breakfast dressed up, holding a card with your
  name on it. It takes you a full second too long to realize what day it is.
tone: light
category: partner
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { role: spouse, years: { gte: 1 } }
    - { romance: [married] }
weight: { base: 6 }
cooldownYears: 6
cast:
  spouse: { kind: spouse, presence: household }
choices:
  - id: improvise
    label: Pretend you planned a surprise dinner
    check:
      base: 45
      stats: [{ key: sociability, weight: 0.2 }, { key: luck, weight: 0.2 }]
      success:
        text: You find a table at the last minute. {spouse.name} never finds out. Probably.
        effects:
          - { type: relationship, role: spouse, affection: 5 }
          - { type: money, delta: -150 }
      failure:
        text: >-
          The only table you can get is at a chain restaurant by the highway.
          {spouse.name} knows exactly what happened.
        effects:
          - { type: relationship, role: spouse, affection: -8, trust: -4 }
          - { type: memory, role: spouse, tag: forgot_anniversary }
          - { type: money, delta: -60 }
  - id: confess
    label: Confess you forgot
    outcome:
      text: '{spouse.name} sighs, then laughs. "Next year," {spouse.they} {spouse:says|say}, "I''m setting you a reminder."'
      effects:
        - { type: relationship, role: spouse, affection: -3, trust: 2 }
        - { type: memory, role: spouse, tag: forgot_anniversary }
