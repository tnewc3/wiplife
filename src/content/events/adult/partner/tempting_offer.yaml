id: tempting_offer
title: The hotel bar
text: >-
  At a conference three hundred miles from home, {other.name} leans in at the
  hotel bar and mentions, very casually, that {other.their} room is right
  upstairs. {spouse.name} is at home, asleep.
tone: serious
category: partner
rarity: rare
lifeStages: [youngAdult, adult]
requires:
  all:
    - { age: { gte: 18 } }
    - { romance: [married] }
    # C1: the conference is for work.
    - { career: { employed: true } }
weight:
  base: 1.2
  modifiers:
    - { if: { trait: riskTaking, gt: 65 }, x: 1.5 }
cooldownYears: 12
cast:
  spouse: { kind: spouse, presence: anywhere }
  other: { kind: acquaintance, romantic: true, createIfMissing: true, newChance: 1, presence: elsewhere }
choices:
  - id: goodnight
    label: Say goodnight and go to your own room
    outcome:
      text: You call {spouse.name} from your room and talk until {spouse.they} {spouse:falls|fall} asleep on the phone.
      effects:
        - { type: relationship, role: spouse, affection: 3 }
        - { type: stat, key: discipline, delta: 2 }
  - id: upstairs
    label: Go upstairs
    outcome:
      text: >-
        The elevator ride is very quiet. The next morning you shower for a
        long time, and your phone shows three missed calls from home.
      effects:
        - { type: memory, role: spouse, tag: cheated_on_them }
        - { type: memory, role: other, tag: affair_with_you }
        - { type: schedule, eventId: affair_calls, inYears: [1, 2], cast: [other] }
        - { type: relationship, role: other, affection: 10 }
        - { type: stat, key: happiness, delta: 2 }
        - { type: stat, key: stress, delta: 8 }
        - { type: history, text: 'You had an affair with {other.name}.', importance: 2 }
        - { type: schedule, eventId: affair_discovered, inYears: [1, 3], cast: [spouse] }
  - id: flirt
    label: Enjoy the flirting, then leave
    outcome:
      text: You go to bed alone, and a little too pleased with yourself.
      effects:
        - { type: stat, key: happiness, delta: 2 }
        - { type: stat, key: confidence, delta: 2 }
