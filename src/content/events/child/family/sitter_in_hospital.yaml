# Follow-up to neighbor_sitter.
id: sitter_in_hospital
title: Visiting hours
text: >-
  {sitter.name}, who looked after you that week when you were small, is in
  the hospital. The room smells like cleaning fluid, and {sitter.they}
  {sitter:looks|look} smaller in the bed than you've ever seen {sitter.them}.
tone: serious
category: family
rarity: common
lifeStages: [child, teen]
weight: { base: 10 }
followUpOnly: true
cast:
  sitter: { kind: acquaintance, presence: city }
choices:
  - id: card
    label: Bring the card you made
    outcome:
      text: >-
        It has glitter on it, which gets everywhere. {sitter.name} props it on
        the tray table and shows it to every nurse.
      effects:
        - { type: relationship, role: sitter, affection: 8 }
        - { type: stat, key: kindness, delta: 2 }
  - id: remember
    label: Remind {sitter.them} of your week together
    visibleIf: { memory: { role: sitter, tag: spoiled_you } }
    outcome:
      text: >-
        "Cookies for breakfast," {sitter.name} says, and laughs until
        {sitter.they} {sitter:coughs|cough}. "Don't tell your parents." The nurse
        says it's the best {sitter.they} {sitter:has|have} looked all week.
      effects:
        - { type: relationship, role: sitter, affection: 12, trust: 6 }
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: kindness, delta: 2 }
  - id: wait
    label: Wait in the hallway; it's too scary
    outcome:
      text: You read every poster in the corridor twice. You wish, later, that you'd gone in.
      effects:
        - { type: stat, key: stress, delta: 3 }
        - { type: relationship, role: sitter, affection: -2 }
