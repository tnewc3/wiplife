id: goldfish
title: Bubbles
text: >-
  Bubbles, your goldfish, is floating at the top of the tank, and not in a
  way that looks like a game. {parent.name} says it happens to every fish
  eventually.
tone: neutral
category: family
rarity: common
lifeStages: [child]
requires: { age: { lte: 10 } }
weight: { base: 4 }
once: true
cast:
  parent: { kind: parent }
choices:
  - id: funeral
    label: Hold a proper funeral in the yard
    outcome:
      text: >-
        A shoebox, a speech, and a cross made of popsicle sticks.
        {parent.name} stands with {parent.their} head bowed through the whole
        thing and doesn't laugh once.
      effects:
        - { type: relationship, role: parent, affection: 4 }
        - { type: stat, key: kindness, delta: 2 }
        - { type: stat, key: happiness, delta: -2 }
  - id: flush
    label: Ask for a new fish by Saturday
    outcome:
      text: Bubbles II looks almost exactly like Bubbles. You suspect this has happened before.
      effects:
        - { type: stat, key: happiness, delta: 1 }
        - { type: stat, key: kindness, delta: -1 }
