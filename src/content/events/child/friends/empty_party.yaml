id: empty_party
title: Party for twelve
text: >-
  You invited your whole class to your birthday party. There are twelve
  party hats on the table. Two kids came.
tone: serious
category: friends
rarity: common
lifeStages: [child]
requires: { trait: sociability, lt: 50 }
weight: { base: 3 }
once: true
cast:
  parent: { kind: parent, presence: household }
choices:
  - id: best_party
    label: Have the best party three people ever had
    outcome:
      text: >-
        More cake each. Every game is a tournament. {parent.name} makes up
        prizes on the spot. Years later, those two are the ones you remember.
      effects:
        - { type: stat, key: happiness, delta: 2 }
        - { type: stat, key: sociability, delta: 2 }
        - { type: relationship, role: parent, affection: 4 }
  - id: hide
    label: Hide in your room until it's over
    outcome:
      text: >-
        {parent.name} sits outside your door and talks to you through it
        until it's dark. The hats go in a drawer.
      effects:
        - { type: stat, key: happiness, delta: -4 }
        - { type: stat, key: confidence, delta: -3 }
        - { type: memory, role: parent, tag: comforted_you }
