id: candy_fundraiser
title: Chocolate for a cause
text: >-
  The school is selling chocolate bars to pay for a new playground. The kid
  who sells the most gets a bike. You have a box of forty.
tone: light
category: school
rarity: common
lifeStages: [child]
requires: { education: { program: [elementary, middle] } }
weight: { base: 4 }
once: true
# C1: reviewed build warnings kept on purpose (docs/consistency-review.md).
justified:
  money: "The money is the school's and your family's, not yours: a child's family pays for the chocolate."
choices:
  - id: door
    label: Knock on every door on the street
    check:
      base: 35
      stats: [{ key: sociability, weight: 0.4 }, { key: confidence, weight: 0.2 }]
      success:
        text: You sell all forty, and twelve more from a second box. You don't win the bike, but you come second, and you get a taste for it.
        effects:
          - { type: stat, key: ambition, delta: 3 }
          - { type: stat, key: sociability, delta: 2 }
      failure:
        text: Six doors, two bars, one dog. You come home and eat four of the rest.
        effects:
          - { type: stat, key: confidence, delta: -1 }
          - { type: stat, key: health, delta: -1 }
  - id: family
    label: Make your family buy the whole box
    outcome:
      text: Your family buys all forty. There is chocolate in the freezer until summer.
      effects:
        - { type: stat, key: happiness, delta: 2 }
