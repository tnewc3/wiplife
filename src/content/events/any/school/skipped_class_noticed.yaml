id: skipped_class_noticed
title: Where were you?
text: >-
  {teacher.name} takes the register, gets to your name and looks up at the empty
  seat. By the end of the week the same question is waiting for you at the door:
  where were you on those afternoons?
tone: serious
category: school
rarity: common
lifeStages: [child, teen, youngAdult, adult]
followUpOnly: true
requires:
  all:
    - { age: { gte: 11 } }
    - { education: { program: [elementary, middle, high, college, trade, grad] } }
weight: { base: 6 }
cooldownYears: 3
cast:
  teacher: { kind: teacher, presence: city }
choices:
  - id: honest
    label: Tell {teacher.them} the truth
    outcome:
      text: >-
        It isn't a good reason, and you say so. {teacher.name} listens anyway,
        marks the absences and asks that you come to the next class, even if
        you aren't ready to.
      effects:
        - { type: relationship, role: teacher, trust: 3 }
        - { type: stat, key: stress, delta: 1 }
  - id: excuse
    label: Make something up
    check:
      base: 40
      stats: [{ key: confidence, weight: 0.3 }, { key: luck, weight: 0.2 }]
      success:
        text: The excuse is good enough. {teacher.name} accepts it with a look that says the next one will need to be better.
        effects:
          - { type: stat, key: stress, delta: 2 }
      failure:
        text: >-
          {teacher.name} has already checked. The meeting that follows is
          shorter than the silence before it.
        effects:
          - { type: relationship, role: teacher, affection: -5, trust: -6 }
          - { type: stat, key: stress, delta: 4 }
  - id: shrug
    label: Shrug and say it will not happen again
    outcome:
      text: It is the kind of promise everyone in the room has heard before. You are given a warning and the benefit of a doubt that is wearing thin.
      effects:
        - { type: relationship, role: teacher, affection: -2 }
