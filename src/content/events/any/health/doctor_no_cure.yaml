# Answers seeing a doctor when nothing could be treated (registries/health.yaml managed).
id: doctor_no_cure
title: Living with it
text: >-
  The doctor is honest with you: there's no fix for this today, only ways to
  make it easier to live with. You leave with a pamphlet and a lot to think
  about.
tone: serious
category: health
rarity: common
lifeStages: [early, child, teen, youngAdult, adult, senior]
weight: { base: 1 }
followUpOnly: true
choices:
  - id: group
    label: Look up the support group on the pamphlet
    outcome:
      text: >-
        A circle of folding chairs and people who get it without explanation.
        You go back the next week, and the one after.
      effects:
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: sociability, delta: 2 }
        - { type: stat, key: stress, delta: -2 }
  - id: alone
    label: Deal with it your own way
    outcome:
      text: You read everything you can find, then decide to stop reading. Some days that helps.
      effects:
        - { type: stat, key: stress, delta: 2 }
        - { type: stat, key: discipline, delta: 1 }
