# Registry: birth.placedYou. You carried the baby and placed them for adoption.
id: placed_for_adoption_you
title: Goodbye, for now
text: >-
  The baby is born, and healthy, and yours for a few hours. You hold the baby
  until it is time. You have decided, and you still do not know how you will
  walk out of this room.
