# Registry: miscarriage.you. Rare. It leads to a grief chain.
id: miscarriage_you
title: The appointment
text: >-
  The technician stops talking. Then the doctor comes in, and sits down, which
  is how you know. There is no heartbeat. There is nothing you did, and
  nothing you could have done, and the words sound very far away.
tone: dark
category: pregnancy
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { age: { gte: 18 } }
weight: { base: 10 }
followUpOnly: true
cast:
  other: { kind: spouse, presence: anywhere, optional: true }
autoOutcome:
  text: >-
    You go home with a folder of leaflets and an emptiness that has no
    instructions. There is a nursery in your head that nobody else can see.
