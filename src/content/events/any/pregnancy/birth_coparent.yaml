# Registry: birth.coparent. The baby was carried by someone who isn't your
# partner, and lives with them.
id: birth_coparent
title: Two households
text: >-
  {carrier.name} calls from the hospital. {baby.name} is here, and healthy.
  The two of you have an arrangement, and for the first time it is a real one.
tone: neutral
category: pregnancy
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { age: { gte: 18 } }
weight: { base: 10 }
followUpOnly: true
cast:
  baby: { kind: child, presence: anywhere }
  carrier: { kind: friend, presence: anywhere }
autoOutcome:
  text: >-
    You visit the next morning. {baby.name} lives with {carrier.name}, and you
    will be there as much as the two of you can make work. It is a start.
  effects:
