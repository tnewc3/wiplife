# E1: reacts to a date that went well (an interaction).
id: date_night_memory
title: Like the first time
text: >-
  {partner.name} is across the table from you, in the same restaurant light,
  and for a second you're back on that first good date. Then {partner.they}
  {partner:catches|catch} you looking and raises an eyebrow.
tone: light
category: partner
rarity: uncommon
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { romance: [dating] }
    - { memory: { role: partner, tag: romantic_date } }
weight: { base: 4 }
cooldownYears: 5
cast:
  partner: { kind: partner, presence: nearby }
choices:
  - id: say_it
    label: Tell {partner.them} exactly what you were thinking
    outcome:
      text: >-
        {partner.name} goes pink, then leans in. The rest of the meal is
        eaten in a hurry.
      effects:
        - { type: relationship, role: partner, affection: 6, trust: 3, mood: 8 }
        - { type: stat, key: happiness, delta: 3 }
        - { type: memory, role: partner, tag: romantic_date }
  - id: smile
    label: Just smile
    outcome:
      text: Some things don't need saying. {partner.name} reaches across and takes your hand.
      effects:
        - { type: relationship, role: partner, affection: 3, mood: 4 }
        - { type: stat, key: happiness, delta: 2 }
