# Answers the "break up" action (registries/actions.yaml).
id: break_up_talk
title: The talk
text: >-
  You've made up your mind: it's over with {person.name}. The only question
  left is how you tell {person.them}.
tone: serious
category: partner
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { romance: [dating, engaged] }
weight: { base: 10 }
followUpOnly: true
cast:
  # Filled by the action: your partner or fiancé.
  person: { kind: partner, presence: anywhere }
choices:
  - id: face_to_face
    label: Tell {person.them} face to face
    outcome:
      text: >-
        It's the worst conversation of the year. {person.name} cries, then
        you do. At the door, {person.they} {person:hugs|hug} you anyway.
      effects:
        - { type: relationship, role: person, kind: ex, affection: -15, trust: -5 }
        - { type: memory, role: person, tag: you_broke_up }
        - { type: stat, key: happiness, delta: -4 }
        - { type: stat, key: stress, delta: -2 }
        - { type: history, text: 'You broke up with {person.name}.', importance: 2 }
  - id: text
    label: Send a text and turn off your phone
    outcome:
      text: >-
        When you turn your phone back on there are forty messages. You don't
        read them. {person.name}'s friends will never speak to you again.
      effects:
        - { type: relationship, role: person, kind: ex, affection: -35, trust: -25 }
        - { type: memory, role: person, tag: you_broke_up }
        - { type: stat, key: kindness, delta: -2 }
        - { type: stat, key: stress, delta: -4 }
        - { type: history, text: 'You broke up with {person.name} by text.', importance: 2 }
  - id: letter
    label: Write {person.them} a long letter
    outcome:
      text: >-
        You rewrite it eleven times. {person.name} reads it twice, then calls
        to say {person.they} understood, even if {person.they} didn't agree.
      effects:
        - { type: relationship, role: person, kind: ex, affection: -10, trust: 2 }
        - { type: memory, role: person, tag: you_broke_up }
        - { type: stat, key: happiness, delta: -5 }
        - { type: history, text: 'You ended things with {person.name} in a letter.', importance: 2 }
