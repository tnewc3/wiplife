id: biz_offer_to_buy
title: An offer on the table
text: >-
  {buyer.name}, in a good coat, has eaten at {business} three times this month.
  This time, {buyer.they} {buyer:introduces|introduce} {buyer.themself}, and
  {buyer:says|say} {buyer.they} {buyer:is|are} interested in buying it. The price {buyer.they}
  {buyer:names|name} is a number, not an insult.
tone: neutral
category: business
rarity: rare
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { business: { owned: true } }
    - { age: { gte: 21 } }
    - { business: { owned: true, years: { gte: 3 }, profit: { gt: 0 } } }
weight: { base: 3 }
cooldownYears: 8
bindBusiness: true
cast:
  buyer: { kind: acquaintance, presence: city, createIfMissing: true, age: { min: 35, max: 65 } }
choices:
  - id: sell
    label: Sell it
    outcome:
      text: The paperwork takes a month. When it's done, you stand across the street and watch someone else unlock your door.
      effects:
        - { type: business, action: sell }
  - id: decline
    label: Politely decline
    outcome:
      text: "{buyer.name} leaves a card. You put it in a drawer, in case. The business feels slightly more yours than before."
      effects:
        - { type: stat, key: confidence, delta: 3 }
        - { type: business, action: reputation, delta: 2 }
  - id: counter
    label: Say you'd need to think about it
    check:
      base: 45
      stats: [{ key: confidence, weight: 0.25 }, { key: smarts, weight: 0.15 }]
      success:
        text: >-
          {buyer.name} comes back with a better number, and a sheepish smile. You thank {buyer.them}
          anyway, and keep the place a little longer.
        effects:
          - { type: business, action: receive, share: 0.01, floor: 300 }
          - { type: stat, key: confidence, delta: 3 }
      failure:
        text: "{buyer.name} doesn't come back. The offer, apparently, was only good the day it was made."
        effects:
          - { type: stat, key: stress, delta: 2 }
