id: biz_investor_wants_out
title: A change of plans
text: >-
  {investor.name} calls with news: {investor.they} {investor:needs|need} the
  money back from {business}, for a family reason, and soon. {investor.they}
  {investor:is|are} apologetic, and very clear about it.
tone: serious
category: business
rarity: uncommon
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { business: { owned: true } }
    - { age: { gte: 18 } }
    - { memory: { role: investor, tag: invested_in_your_business } }
    - { business: { owned: true, investors: true, years: { gte: 2 } } }
weight: { base: 4 }
cooldownYears: 5
bindBusiness: true
cast:
  investor: { business: investor, presence: anywhere }
choices:
  - id: buyout
    label: Buy {investor.them} out at what it's worth
    outcome:
      text: >-
        You pay {investor.name} {investor.their} share at what the business is
        worth now. It's a large check, and it makes the place entirely yours.
      effects:
        - { type: business, action: buyout, role: investor }
        - { type: relationship, role: investor, trust: 6, affection: 4 }
  - id: refuse
    label: Explain that the funds are tied up
    outcome:
      text: >-
        It's the truth. {investor.name} accepts it the way a person accepts bad
        weather, and doesn't mention it again, which is a kind of mention.
      effects:
        - { type: relationship, role: investor, trust: -5, affection: -4 }
  - id: later
    label: Promise to make it right when you can
    outcome:
      text: >-
        {investor.name} takes you at your word, and files it where it matters.
        You'll both remember what you said.
      effects:
        - { type: relationship, role: investor, trust: 1 }
