id: daytime_tv
title: Too much daytime TV
text: >-
  Since losing your job, the days have gone soft around the edges. You know
  every judge show host by name and could not tell anyone what day it is.
tone: serious
category: jobless
rarity: common
lifeStages: [youngAdult, adult]
requires: { career: { employed: false, retired: false, lostWithin: 2 } }
weight: { base: 6 }
cooldownYears: 4
choices:
  - id: routine
    label: Set an alarm and keep a routine
    outcome:
      text: Up at seven, a walk, three applications before lunch. Being unemployed becomes a job of its own.
      effects:
        - { type: stat, key: discipline, delta: 3 }
        - { type: stat, key: stress, delta: -3 }
        - { type: stat, key: fitness, delta: 1 }
  - id: blur
    label: Let the days blur
    outcome:
      text: Weeks slide by. You sleep late and feel worse for it.
      effects:
        - { type: stat, key: happiness, delta: -4 }
        - { type: stat, key: stress, delta: 3 }
        - { type: stat, key: fitness, delta: -2 }
