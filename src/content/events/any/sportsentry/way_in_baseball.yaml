id: way_in_baseball
title: Playing catch
text: >-
  {friend.name} has two gloves, one ball and nothing else to do on a Sunday afternoon. By the third throw, you have stopped thinking about your arm. By the thirtieth, a stranger on a nearby bench has put down the newspaper.
tone: light
category: sportsentry
rarity: common
lifeStages: [child, teen]
requires:
  all:
    - { age: { gte: 9, lte: 17 } }
    - { fame: { active: false } }
    - { sports: { seasons: { lt: 1 } } }
weight:
  base: 0.9
  modifiers:
    - { if: { discovery: { talent: found } }, x: 2 }
    - { if: { stat: fitness, gt: 60 }, x: 1.6 }
    - { if: { trait: ambition, gt: 60 }, x: 1.3 }
cast:
  friend: { kind: friend, presence: city }
choices:
  - id: join
    label: Join a youth league
    visibleIf: { age: { lte: 13 } }
    outcome:
      text: >-
        The little league has a spot, a jersey and a field with chalk lines. Your coach is somebody's parent, and very serious about the batting order.
      effects:
        - { type: fame, action: enter, path: baseball, route: youth_league }
        - { type: stat, key: happiness, delta: 4 }
        - { type: relationship, role: friend, affection: 3 }
  - id: tryout
    label: Try out for the school team
    visibleIf: { age: { gte: 13 } }
    check:
      base: 50
      stats: [{ key: fitness, weight: 0.3 }, { key: discipline, weight: 0.15 }, { key: luck, weight: 0.05 }]
      success:
        text: >-
          The school team's tryouts are a gloomy morning in the cage, a few grounders and a coach with a stopwatch. The list goes up on Monday. You read it with your jaw tight.
        effects:
          - { type: fame, action: enter, path: baseball, route: school_tryout }
          - { type: stat, key: happiness, delta: 6 }
      failure:
        text: >-
          The coach has room for twelve. You are the thirteenth. The coach says it is close, and the way it is said makes you believe it.
        effects:
          - { type: stat, key: confidence, delta: -3 }
          - { type: stat, key: happiness, delta: -2 }
  - id: fun
    label: Just play for the fun of it
    outcome:
      text: >-
        Catch turns into pickle, then into a game with no sides. It is the kind of afternoon you will remember without being able to say why.
      effects:
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: fitness, delta: 1 }
        - { type: relationship, role: friend, affection: 2 }
