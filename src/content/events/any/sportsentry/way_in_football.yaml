id: way_in_football
title: A Friday night under the lights
text: >-
  {friend.name} drags you to the Friday game, and you stand at the fence while the crowd roars at things you can barely follow. Afterwards, {friend.they} {friend:tosses|toss} a ball at your chest in the empty parking lot and says you have a decent arm.
tone: light
category: sportsentry
rarity: common
lifeStages: [child, teen]
requires:
  all:
    - { age: { gte: 9, lte: 17 } }
    - { fame: { active: false } }
    - { sports: { seasons: { lt: 1 } } }
weight:
  base: 0.9
  modifiers:
    - { if: { discovery: { talent: found } }, x: 2 }
    - { if: { stat: fitness, gt: 60 }, x: 1.6 }
    - { if: { trait: ambition, gt: 60 }, x: 1.3 }
cast:
  friend: { kind: friend, presence: city }
choices:
  - id: join
    label: Join a youth league
    visibleIf: { age: { lte: 13 } }
    outcome:
      text: >-
        The youth league needs bodies on Saturday morning. You get a helmet that smells of someone else's summer, and a coach who says everyone starts at the bottom, which is where you are.
      effects:
        - { type: fame, action: enter, path: football, route: youth_league }
        - { type: stat, key: happiness, delta: 4 }
        - { type: relationship, role: friend, affection: 3 }
  - id: tryout
    label: Try out for the school team
    visibleIf: { age: { gte: 13 } }
    check:
      base: 50
      stats: [{ key: fitness, weight: 0.3 }, { key: discipline, weight: 0.15 }, { key: luck, weight: 0.05 }]
      success:
        text: >-
          Two-a-days in the August heat, a coach with a clipboard and a list on the locker-room door. You read it twice. Your name is on it, in pencil.
        effects:
          - { type: fame, action: enter, path: football, route: school_tryout }
          - { type: stat, key: happiness, delta: 6 }
      failure:
        text: >-
          The coach thanks everyone for coming and reads out the names. Yours is not among them. "Work on your speed," the coach says, and shakes your hand like you matter.
        effects:
          - { type: stat, key: confidence, delta: -3 }
          - { type: stat, key: happiness, delta: -2 }
  - id: fun
    label: Just play for the fun of it
    outcome:
      text: >-
        You throw the ball around until the light goes. Nobody tackles anybody, and you realise, a little later, that you would have liked a tackle.
      effects:
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: fitness, delta: 1 }
        - { type: relationship, role: friend, affection: 2 }
