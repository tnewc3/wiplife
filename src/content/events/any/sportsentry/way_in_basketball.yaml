id: way_in_basketball
title: One more kid for the game
text: >-
  {friend.name} comes running up to the court with a ball under {friend.their} arm and one fewer player than the game needs. The kids on the next court are bigger. "You're in," {friend.they} {friend:says|say}. It is not a question.
tone: light
category: sportsentry
rarity: common
lifeStages: [child, teen]
requires:
  all:
    - { age: { gte: 9, lte: 17 } }
    - { fame: { active: false } }
    - { sports: { seasons: { lt: 1 } } }
weight:
  base: 0.9
  modifiers:
    - { if: { discovery: { talent: found } }, x: 2 }
    - { if: { stat: fitness, gt: 60 }, x: 1.6 }
    - { if: { trait: ambition, gt: 60 }, x: 1.3 }
cast:
  friend: { kind: friend, presence: city }
choices:
  - id: join
    label: Join a youth league
    visibleIf: { age: { lte: 13 } }
    outcome:
      text: >-
        The rec centre's league takes sign-ups on Saturday. Your name goes on a list under a coach's handwriting, and you get a jersey two sizes too big.
      effects:
        - { type: fame, action: enter, path: basketball, route: youth_league }
        - { type: stat, key: happiness, delta: 4 }
        - { type: relationship, role: friend, affection: 3 }
  - id: tryout
    label: Try out for the school team
    visibleIf: { age: { gte: 13 } }
    check:
      base: 50
      stats: [{ key: fitness, weight: 0.3 }, { key: discipline, weight: 0.15 }, { key: luck, weight: 0.05 }]
      success:
        text: >-
          You go to the school gym on a Monday and read the list on the door. Twelve names are on it. You find yours on the second try, and you read it again to be sure.
        effects:
          - { type: fame, action: enter, path: basketball, route: school_tryout }
          - { type: stat, key: happiness, delta: 6 }
      failure:
        text: >-
          The list has fourteen names and yours is not one of them. The coach says to come back next year, and means it more than the others do.
        effects:
          - { type: stat, key: confidence, delta: -3 }
          - { type: stat, key: happiness, delta: -2 }
  - id: fun
    label: Just play for the fun of it
    outcome:
      text: >-
        You play until the streetlights come on. Nobody keeps score and everyone argues about it anyway. It is a very good evening.
      effects:
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: fitness, delta: 1 }
        - { type: relationship, role: friend, affection: 2 }
