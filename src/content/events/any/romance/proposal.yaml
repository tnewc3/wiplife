# Answers the "propose" action (registries/actions.yaml).
id: proposal
title: The ring
text: >-
  You've been carrying the ring around for weeks, checking your pocket every
  ten minutes. Tonight you're going to ask {person.name} to marry you.
tone: light
category: romance
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { age: { gte: 18 } }
weight: { base: 10 }
followUpOnly: true
cast:
  # Filled by the action: your partner.
  person: { kind: partner }
choices:
  - id: dinner
    label: Propose over a candlelit dinner
    visibleIf: { money: { gte: 200 } }
    check:
      base: 50
      stats:
        - { role: person, key: affection, weight: 0.7 }
        - { role: person, key: trust, weight: 0.3 }
      success:
        text: '{person.name} says yes before you finish the question. The waiter brings free dessert.'
        effects:
          - { type: money, delta: -200 }
          - { type: relationship, role: person, kind: fiance, affection: 8 }
          - { type: memory, role: person, tag: engaged_to_you }
          - { type: stat, key: happiness, delta: 10 }
          - { type: history, text: 'You asked {person.name} to marry you, and {person.they} said yes.', importance: 2 }
      failure:
        text: >-
          {person.name} looks at the ring for a long time, then says
          {person.they} {person:isn't|aren't} ready. The candles keep burning.
        effects:
          - { type: money, delta: -200 }
          - { type: memory, role: person, tag: refused_proposal }
          - { type: relationship, role: person, affection: -8 }
          - { type: stat, key: happiness, delta: -8 }
          - { type: stat, key: stress, delta: 5 }
  - id: walk
    label: Ask on a quiet walk
    check:
      base: 50
      stats:
        - { role: person, key: affection, weight: 0.7 }
        - { role: person, key: trust, weight: 0.3 }
      success:
        text: 'Halfway across a bridge, you stop and ask. {person.name} says yes, then says it again louder.'
        effects:
          - { type: relationship, role: person, kind: fiance, affection: 8 }
          - { type: memory, role: person, tag: engaged_to_you }
          - { type: stat, key: happiness, delta: 9 }
          - { type: history, text: 'You asked {person.name} to marry you, and {person.they} said yes.', importance: 2 }
      failure:
        text: '"Can we talk about this later?" {person.name} asks. The walk home is very long.'
        effects:
          - { type: memory, role: person, tag: refused_proposal }
          - { type: relationship, role: person, affection: -6 }
          - { type: stat, key: happiness, delta: -7 }
          - { type: stat, key: stress, delta: 4 }
  - id: party
    label: Ask in front of everyone at a party
    visibleIf: { trait: confidence, gte: 55 }
    check:
      base: 40
      stats:
        - { role: person, key: affection, weight: 0.8 }
        - { key: confidence, weight: 0.2 }
      success:
        text: The room erupts. Someone films it. It gets more views than anything you'll ever post again.
        effects:
          - { type: relationship, role: person, kind: fiance, affection: 10 }
          - { type: memory, role: person, tag: engaged_to_you }
          - { type: stat, key: happiness, delta: 12 }
          - { type: history, text: 'You proposed to {person.name} in front of a room full of people, and {person.they} said yes.', importance: 2 }
      failure:
        text: >-
          {person.name} says no, in front of everyone, and walks out. The
          party goes very quiet. By morning, it's over between you.
        effects:
          - { type: memory, role: person, tag: refused_proposal }
          - { type: relationship, role: person, kind: ex, affection: -20, trust: -10 }
          - { type: memory, role: person, tag: they_broke_up }
          - { type: stat, key: happiness, delta: -14 }
          - { type: stat, key: stress, delta: 8 }
          - { type: history, text: '{person.name} turned down your proposal in front of everyone, and the two of you split up.', importance: 2 }
