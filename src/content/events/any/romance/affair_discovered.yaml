# Follow-up of tempting_offer: your spouse finds out.
id: affair_discovered
title: Your phone
text: >-
  {spouse.name} is sitting at the kitchen table holding your phone. {spouse.They}
  {spouse:has|have} read everything.
tone: dark
category: romance
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { role: spouse, kind: [spouse] }
    - { memory: { role: spouse, tag: cheated_on_them } }
weight: { base: 10 }
followUpOnly: true
cast:
  spouse: { kind: spouse }
choices:
  - id: beg
    label: Confess everything and beg forgiveness
    check:
      base: 30
      stats:
        - { role: spouse, key: affection, weight: 0.5 }
        - { role: spouse, key: trust, weight: 0.3 }
      success:
        text: >-
          It takes months of couples therapy and sleeping on the couch. But
          {spouse.name} stays.
        effects:
          - { type: relationship, role: spouse, affection: -15, trust: -35 }
          - { type: memory, role: spouse, tag: forgave_you }
          - { type: stat, key: stress, delta: 10 }
          - { type: history, text: '{spouse.name} found out about your affair and, somehow, forgave you.', importance: 3 }
      failure:
        text: '{spouse.name} listens to every word. Then {spouse.they} {spouse:calls|call} a lawyer.'
        effects:
          - { type: relationship, role: spouse, kind: ex, affection: -40, trust: -60 }
          - { type: memory, role: spouse, tag: divorced }
          - { type: memory, role: spouse, tag: they_broke_up }
          - { type: money, delta: -4000 }
          - { type: stat, key: happiness, delta: -12 }
          - { type: stat, key: stress, delta: 12 }
          - { type: history, text: '{spouse.name} found out about your affair and divorced you.', importance: 3 }
  - id: deny
    label: Deny it
    check:
      base: 20
      stats: [{ key: confidence, weight: 0.3 }]
      success:
        text: '{spouse.name} can''t prove anything. {spouse.They} {spouse:doesn''t|don''t} believe you, either.'
        effects:
          - { type: relationship, role: spouse, affection: -10, trust: -40 }
          - { type: stat, key: stress, delta: 8 }
      failure:
        text: There are photos. {spouse.name} is gone by the weekend, and the divorce is quick and ugly.
        effects:
          - { type: relationship, role: spouse, kind: ex, affection: -50, trust: -70 }
          - { type: memory, role: spouse, tag: divorced }
          - { type: memory, role: spouse, tag: they_broke_up }
          - { type: money, delta: -6000 }
          - { type: stat, key: happiness, delta: -14 }
          - { type: stat, key: reputation, delta: -5 }
          - { type: history, text: 'You lied about the affair, and {spouse.name} divorced you.', importance: 3 }
  - id: leave
    label: Say you were already planning to leave
    outcome:
      text: It's the cruelest thing you've ever said, and it might even be true. You move out that night.
      effects:
        - { type: relationship, role: spouse, kind: ex, affection: -45, trust: -50 }
        - { type: memory, role: spouse, tag: divorced }
        - { type: memory, role: spouse, tag: you_broke_up }
        - { type: money, delta: -3000 }
        - { type: stat, key: happiness, delta: -6 }
        - { type: stat, key: kindness, delta: -3 }
        - { type: history, text: 'Your affair came out, and you left {spouse.name} for good.', importance: 3 }
