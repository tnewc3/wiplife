id: find_date_friend
title: A friend knows someone
text: >-
  You mention you are looking, and {friend.name} lights up. {friend.They} {friend:knows|know} just the person: {date.name}. A coffee is arranged before you can change your mind.
tone: light
category: romance
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { romance: [single] }
weight: { base: 5 }
followUpOnly: true
cast:
  friend: { kind: friend, age: { min: 18, max: 120 }, presence: city }
  date: { kind: acquaintance, romantic: true, createIfMissing: true, newChance: 1, presence: city }
choices:
  - id: date
    label: Ask {date.them} out properly
    check:
      base: 45
      stats: [{ key: looks, weight: 0.25 }, { key: sociability, weight: 0.25 }]
      success:
        text: >-
          {friend.name} was right, and will say so often. You and {date.name} close the coffee shop down.
        effects:
          - { type: relationship, role: date, kind: partner, affection: 16 }
          - { type: memory, role: date, tag: started_dating }
          - { type: stat, key: happiness, delta: 6 }
          - { type: history, text: 'You started dating {date.name}.', importance: 2 }
      failure:
        text: >-
          {date.name} is lovely and there is nothing there. {friend.name} takes it well, and promises to try again.
        effects:
          - { type: memory, role: date, tag: bad_first_date }
          - { type: relationship, role: date, affection: -4 }
          - { type: stat, key: happiness, delta: -2 }
  - id: slow
    label: Keep it casual and see where it goes
    outcome:
      text: >-
        You and {date.name} agree the coffee was good and leave the rest open. {friend.name} calls it a start.
      effects:
        - { type: relationship, role: date, affection: 9 }
        - { type: memory, role: date, tag: swapped_numbers }
