# B1: answers the "ask out" action when the person is not attracted to you (second). A kind, clear no; never a romantic result.
id: ask_out_declined_friend
title: Not that way
text: >-
  You finally say it out loud: you would like to take {person.name} out. Not as friends. {person.They} {person:goes|go} quiet.
tone: neutral
category: romance
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { role: person, age: { gte: 18 } }
    - { role: person, attractedToYou: false }
weight: { base: 10 }
followUpOnly: true
cast:
  # Filled by the action: the person you're asking.
  person: { kind: acquaintance, presence: city, age: { min: 18, max: 120 } }
autoOutcome:
  text: >-
    {person.name} shakes {person.their} head, gently. "I'm not interested in you that way. I'm sorry." There is no cruelty in it, and no maybe. You say it's fine, and mostly it is.
  effects:
    - { type: memory, role: person, tag: turned_you_down }
    - { type: relationship, role: person, affection: -1 }
    - { type: stat, key: happiness, delta: -3 }
    - { type: stat, key: confidence, delta: -2 }
