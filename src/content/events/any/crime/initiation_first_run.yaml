id: initiation_first_run
title: The first run
text: >-
  {member.name} tells you that workers come and go and that a runner is
  someone {crew} decided to trust with something that matters. The first run is
  tonight. You will be told where to go and not why, and you will be watched
  from a distance by someone you will never meet.
tone: dark
category: crime
rarity: common
recurring: true
lifeStages: [youngAdult, adult]
requires:
  all:
    - { age: { gte: 18 } }
    - { crime: { member: true } }
    - { crime: { kind: [cartel] } }
    - { crime: { initiating: true } }
weight:
  base: 10
  modifiers:
    - { if: { flag: failed_an_initiation }, x: 1.3 }
followUpOnly: true
cast:
  member: { kind: friend, crew: yours, presence: city }
choices:
  - id: make_the_run
    label: Make the run
    check:
      base: 60
      stats: [{ key: discipline, weight: 0.3 }, { key: luck, weight: 0.2 }, { crime: heat, weight: -0.2 }]
      success:
        text: >-
          You are where you are told, when you are told, and you leave with
          nothing you came with. Somebody gives you a new phone. You are a runner now, and the work shows it.
        effects:
          - { type: crime, action: promote }
          - { type: flag, key: passed_an_initiation, value: true }
          - { type: dirtyMoney, gain: small }
          - { type: crime, action: job, size: small }
      failure:
        text: >-
          A car you did not expect, a turn you did not take, and the whole
          thing is called off. Nobody blames you, which is more frightening
          than if they had.
        effects:
          - { type: crime, action: standing, delta: -8 }
          - { type: crime, action: heat, delta: 8 }
          - { type: flag, key: failed_an_initiation, value: true }
  - id: turn_back
    label: Turn back before you start
    outcome:
      text: >-
        {member.name} takes the phone back without comment. You are still on
        the list, but lower on it.
      effects:
        - { type: crime, action: standing, delta: -5 }
        - { type: stat, key: stress, delta: -2 }
