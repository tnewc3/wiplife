id: asked_about_the_family
title: The question about your family
text: >-
  {person.name} asks about your family, the way people do when they already
  know a version of the answer. There is something your family is known for,
  and it is not entirely what you would pick. The room waits to see what you
  will say.
tone: serious
category: legacy
rarity: rare
lifeStages: [teen, youngAdult, adult, senior]
requires:
  all:
    - { family: { heir: true, deeds: [conviction, scandal, bankruptcy] } }
    - { age: { gte: 14 } }
weight: { base: 3 }
cooldownYears: 20
cast:
  person: { kind: acquaintance, presence: city, createIfMissing: true, age: { min: 20, max: 90 } }
choices:
  - id: honest
    label: Tell the truth, plainly
    outcome:
      text: >-
        You say it without decoration. {person.name} nods, and for a minute
        nobody says anything. Then {person.they} {person:says|say} {person.they}
        respect that. The truth did not kill the conversation, and it saved a
        lot of guessing.
      effects:
        - { type: relationship, role: person, affection: 6, trust: 8 }
        - { type: stat, key: reputation, delta: 2 }
        - { type: stat, key: confidence, delta: 2 }
  - id: deflect
    label: Change the subject
    outcome:
      text: >-
        You ask about their weekend. {person.name} lets it go with a small,
        knowing smile. The subject will return when you least want it to, and
        the smile will be there again.
      effects:
        - { type: relationship, role: person, trust: -3 }
        - { type: stat, key: stress, delta: 2 }
  - id: tell_full_story
    label: Tell the whole story, including the good parts
    outcome:
      text: >-
        You mention the aunt who ran the school fundraiser, the uncle who
        drove strangers home in the snow. It is a more honest picture than the
        one they came in with, and {person.name} is clearly rethinking
        something.
      effects:
        - { type: relationship, role: person, affection: 8, trust: 6 }
        - { type: stat, key: happiness, delta: 1 }
        - { type: stat, key: reputation, delta: 1 }
