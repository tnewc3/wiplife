id: landlord_repairs
title: No heat
text: >-
  The heater dies in January. Your landlord says someone will come "soon,"
  in the tone people use when they mean never.
tone: neutral
category: home
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { home: { kind: [renting] } }
weight: { base: 6 }
cooldownYears: 5
choices:
  - id: fix
    label: Pay someone to fix it yourself
    outcome:
      text: The repair guy has it running in twenty minutes and charges you for two hours.
      effects:
        - { type: money, delta: -400 }
        - { type: stat, key: stress, delta: -1 }
  - id: complain
    label: Put the landlord on notice, in writing
    check:
      base: 45
      stats: [{ key: confidence, weight: 0.3 }, { key: smarts, weight: 0.1 }]
      success:
        text: Your letter cites three tenant laws. A repair crew arrives the next morning.
        effects:
          - { type: stat, key: confidence, delta: 2 }
      failure:
        text: The landlord stops answering your texts. You buy a space heater and a lot of blankets.
        effects:
          - { type: money, delta: -150 }
          - { type: stat, key: health, delta: -1 }
          - { type: stat, key: stress, delta: 3 }
  - id: withhold
    label: Withhold rent until it's fixed
    visibleIf: { trait: riskTaking, gt: 55 }
    check:
      base: 45
      stats: [{ key: confidence, weight: 0.2 }, { key: luck, weight: 0.2 }]
      success:
        text: The heater is fixed within a week, and the landlord knocks a month off the rent to make it go away.
        effects:
          - { type: money, delta: 1500 }
          - { type: stat, key: stress, delta: 2 }
      failure:
        text: The landlord hits you with late fees and a formal warning. The heater stays broken.
        effects:
          - { type: debt, action: add, kind: personal, amount: 1200 }
          - { type: stat, key: stress, delta: 5 }
