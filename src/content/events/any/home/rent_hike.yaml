id: rent_hike
title: The new lease
text: >-
  Your lease renewal arrives with a new number on it, and it's a lot bigger
  than the old one.
tone: neutral
category: home
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { home: { kind: [renting], years: { gte: 2 } } }
weight: { base: 6 }
cooldownYears: 4
choices:
  - id: pay
    label: Sign it and grumble
    outcome:
      text: You sign. The landlord's new car is very nice.
      effects:
        - { type: money, delta: -2400 }
        - { type: stat, key: stress, delta: 2 }
  - id: negotiate
    label: Negotiate
    check:
      base: 40
      stats: [{ key: confidence, weight: 0.3 }, { key: sociability, weight: 0.2 }]
      success:
        text: You point out you've never been late and the unit next door has sat empty for months. The increase shrinks to almost nothing.
        effects:
          - { type: money, delta: -500 }
          - { type: stat, key: confidence, delta: 2 }
      failure:
        text: '"Plenty of people want this apartment," says the landlord. You sign.'
        effects:
          - { type: money, delta: -2400 }
          - { type: stat, key: stress, delta: 3 }
  - id: roommate
    label: Find a roommate to split it
    visibleIf: { home: { roommate: false } }
    outcome:
      text: A friend of a friend moves into the second bedroom, which used to be your office. Rent gets a lot easier.
      effects:
        - { type: housing, action: roommate }
        - { type: stat, key: happiness, delta: -1 }
