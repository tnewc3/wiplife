# Registry: adoption.start. Answers More → Family → Adopt.
id: adoption_apply
title: The agency
text: >-
  The agency's office has a waiting room full of kids' drawings and a woman at
  a desk who has seen every kind of hope. There are forms about your home, your
  work and your history, and a visit. After that, a wait, and no promises.
