# Registry: ivf.failed. The cycle didn't work.
id: ivf_failed
title: Not this time
text: >-
  The call comes in the afternoon, and the nurse does not have to say it: the
  cycle did not work. The nurse says everything people say, and means every word.
  You thank the nurse, and hang up, and stand in the kitchen for a long time.
