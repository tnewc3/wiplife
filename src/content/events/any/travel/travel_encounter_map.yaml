{
  "id": "travel_encounter_map",
  "title": "The folded map",
  "text": "During your trip to {destination}, {npc.name}, another traveler, asks what you made of a route.",
  "category": "travel",
  "tone": "neutral",
  "rarity": "common",
  "lifeStages": [
    "youngAdult",
    "adult",
    "senior"
  ],
  "followUpOnly": true,
