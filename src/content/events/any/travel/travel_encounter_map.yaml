        "text": "You enjoy the exchange without promising more.",
        "effects": [
          {
            "type": "relationship",
            "role": "npc",
            "affection": 2,
            "trust": 0
          },
          {
            "type": "stat",
            "key": "happiness",
            "delta": 1
          }
        ]
      }
    }
  ],
  "cast": {
    "npc": {
      "kind": "acquaintance",
      "presence": "anywhere",
      "age": {
        "min": 18,
        "max": 100
