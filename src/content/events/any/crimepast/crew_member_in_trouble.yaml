id: crew_member_in_trouble
title: Someone you used to run with
text: >-
  {friend.name}, who brought you in, is in more trouble than {friend.they}
  can handle. {friend.They} {friend:is|are} not asking for a favour so much as
  for someone to remember what {friend.they} did for you.
tone: serious
category: crimepast
rarity: uncommon
recurring: true
lifeStages: [youngAdult, adult]
requires:
  all:
    - { age: { gte: 18 } }
    - { crime: { former: true } }
    - { crime: { member: false } }
    - { memory: { role: friend, tag: brought_you_in } }
weight: { base: 8 }
cast:
  friend: { kind: friend, presence: city }
choices:
  - id: help
    label: Help {friend.them} out
    outcome:
      text: >-
        You do what you can without going back in, and it costs you what it
        costs. {friend.name} does not forget it.
      effects:
        - { type: cost, item: bail_share }
        - { type: relationship, role: friend, affection: 10, trust: 10 }
        - { type: crime, action: heat, delta: 3 }
  - id: decline
    label: Say you can't get involved
    outcome:
      text: '{friend.name} nods slowly. It is the kind of nod that closes a door.'
      effects:
        - { type: relationship, role: friend, affection: -12, trust: -10 }
        - { type: stat, key: stress, delta: 3 }
