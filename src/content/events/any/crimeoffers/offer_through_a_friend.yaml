id: offer_through_a_friend
title: Someone you should meet
text: >-
  {friend.name} has been living better than any paycheque explains, and not saying why.
  Tonight {friend.they} {friend:finally says|finally say} it: {friend.they}
  {friend:works|work} for some people who always need someone reliable, and
  {friend.they} {friend:has|have} mentioned you.
tone: dark
category: crimeoffers
rarity: uncommon
lifeStages: [youngAdult, adult]
requires:
  all:
    - { age: { gte: 18 } }
    - { crime: { member: false } }
weight:
  base: 0.35
  modifiers:
    - { if: { flag: turned_down_a_crew }, x: 0.6 }
    - { if: { trait: riskTaking, gt: 60 }, x: 1.8 }
    - { if: { trait: discipline, lt: 40 }, x: 1.3 }
    - { if: { finances: { debt: { gte: 5000 } } }, x: 1.5 }
cast:
  friend: { kind: friend, presence: city, age: { min: 20, max: 70 }, ageOffset: { min: -8, max: 12 } }
choices:
  - id: meet
    label: Go and meet them
    outcome:
      text: >-
        A back room, a handshake, a lot of people who stop talking when you walk
        in. By the end of the night you are part of {crew}, and {friend.name}
        is grinning like someone who just won an argument.
      effects:
        - { type: crime, action: join, role: friend }
        - { type: flag, key: joined_a_crew, value: true }
        - { type: memory, role: friend, tag: brought_you_in }
        - { type: stat, key: stress, delta: 4 }
  - id: decline
    label: Tell {friend.them} you want no part of it
    outcome:
      text: >-
        {friend.name} shrugs it off, but something between you has changed.
        You find yourself wondering, for a long time, who else {friend.they}
        {friend:has|have} said it to.
      effects:
        - { type: relationship, role: friend, affection: -6, trust: -4 }
        - { type: flag, key: turned_down_a_crew, value: true }
        - { type: stat, key: discipline, delta: 2 }
