id: big_game_football
title: Fourth and goal
text: >-
  There are forty seconds left, fourth down, one yard out. {team} can kick or go for it, and the coach is looking at you, not at the sideline. The crowd is chanting something that sounds, from the field, like a single long word.
tone: serious
category: sports
rarity: common
recurring: true
lifeStages: [child, teen, youngAdult, adult, senior]
requires:
  all:
    - { sports: { active: true } }
    - { sports: { sport: [football] } }
    - { sports: { level: [school, college, pro] } }
    - { fame: { released: true } }
weight: { base: 10 }
cooldownYears: 2
followUpOnly: true
choices:
  - id: take_it
    label: Ask for the ball
    check:
      base: 45
      stats: [{ sports: rating, weight: 0.3 }, { key: confidence, weight: 0.2 }, { sports: form, weight: 0.1 }, { key: riskTaking, weight: 0.05 }]
      success:
        text: >-
          The line opens a hair's width and you are through it. The ball crosses the line, and the stadium makes a sound you will carry for years.
        effects:
          - { type: sports, action: rating, delta: 3 }
          - { type: fame, action: fame, delta: 2 }
          - { type: fame, action: mood, delta: 4 }
          - { type: flag, key: sports_took_the_shot, value: true }
      failure:
        text: >-
          The line holds, the pile closes in and the whistle goes. You are one yard short of everything, and the quiet in the huddle is the worst thing you've heard.
        effects:
          - { type: sports, action: rating, delta: -2 }
          - { type: fame, action: mood, delta: -3 }
          - { type: stat, key: happiness, delta: -4 }
  - id: share_it
    label: Trust your line and the call
    check:
      base: 50
      stats: [{ sports: team, weight: 0.3 }, { sports: rating, weight: 0.15 }, { key: sociability, weight: 0.1 }]
      success:
        text: >-
          The play is simple and the block is perfect. The ball goes over for the score, and nobody on your side looks anyone in the eye for a second, because they would cry.
        effects:
          - { type: sports, action: rating, delta: 2 }
          - { type: fame, action: image, delta: 3 }
          - { type: stat, key: happiness, delta: 4 }
      failure:
        text: >-
          The play is simple and the block fails by an inch. Everyone in the huddle looks at their own hands.
        effects:
          - { type: fame, action: image, delta: -1 }
          - { type: stat, key: happiness, delta: -3 }
