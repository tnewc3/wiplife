# A trigger for PTSD, handled without graphic detail.
id: ptsd_trigger
title: A sound in the grocery store
text: >-
  It is an ordinary sound in an ordinary place, and your body reacts as if it
  were not. Your pulse jumps, your vision narrows, and for a moment the
  aisle is somewhere else. Then it passes, and you are standing in front of
  the cereal, shaking, hoping nobody noticed.
tone: dark
category: mental
rarity: common
lifeStages: [child, teen, youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 6 } }
    - { health: { conditions: [ptsd], named: true } }
weight: { base: 6 }
cooldownYears: 3
cast:
  helper: { support: true, optional: true, presence: nearby }
choices:
  - id: ground
    label: Use the grounding skills you have been practicing
    visibleIf: { health: { conditions: [ptsd], care: [therapy] } }
    outcome:
      text: >-
        Five things you can see, four you can touch. It is a strange little
        trick, and it works. Your pulse slows and you finish the shopping, a
        bit proud of yourself.
      effects:
        - { type: stat, key: confidence, delta: 2 }
        - { type: stat, key: stress, delta: -2 }
  - id: call_helper
    label: Call {helper.name} and stay on the line
    visibleIf: { role: helper }
    outcome:
      text: >-
        {helper.name} does not ask what happened. {helper.They}
        {helper:talks|talk} about nothing in particular, steadily, until your
        breathing matches the sound of {helper.their} voice.
      effects:
        - { type: relationship, role: helper, affection: 3, trust: 5 }
        - { type: stat, key: stress, delta: -3 }
  - id: leave_store
    label: Leave the cart and go outside
    outcome:
      text: >-
        The cold air helps. You sit in the car for a long while. The groceries
        can wait, and so, you remind yourself, can the shame.
      effects:
        - { type: stat, key: stress, delta: 1 }
  - id: tough_it
    label: Push through and finish the shopping
    outcome:
      text: >-
        You finish the list on shaky legs, check out and make it to the car before
        it hits again. It takes more than it should, and you do it again next week.
      effects:
        - { type: stat, key: stress, delta: 3 }
        - { type: stat, key: confidence, delta: 1 }
