# Web reaction (groupScandal): someone has heard a version of a falling-out at your group.
id: rumor_group_scandal
title: What they heard about your group
text: >-
  {npc.name} brings it up carefully, the way people do when they have been
  rehearsing. {npc.They} heard {heard}. It is not quite how you remember it.
tone: neutral
category: web
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { role: npc, alive: true, kind: [friend, sibling, parent, partner, fiance, spouse, grandparent], heard: { kinds: [groupScandal], light: false, learned: [gossip] } }
weight: { base: 10 }
followUpOnly: true
recurring: true
cast:
  npc: { support: true, presence: anywhere }
choices:
  - id: set_straight
    label: Tell {npc.them} what really happened
    check:
      base: 55
      stats:
        - { role: npc, key: trust, weight: 0.4 }
        - { key: confidence, weight: 0.15 }
      success:
        text: >-
          You tell it in order, plainly. {npc.name} listens and nods, and by
          the end it sounds smaller than the version going around.
        effects:
          - { type: knowledge, role: npc, action: correct }
          - { type: relationship, role: npc, affection: 2, trust: 4 }
          - { type: memory, role: npc, tag: you_set_it_straight }
      failure:
        text: >-
          Everything you say sounds like an excuse, even to you. {npc.name}
          says "okay" in a tone that does not mean it.
        effects:
          - { type: relationship, role: npc, affection: -3, trust: -3 }
          - { type: stat, key: stress, delta: 3 }
  - id: let_it_go
    label: Let it go, and let people think what they think
    outcome:
      text: >-
        You shrug. Groups run on stories, and this one will outlive its truth.
        You decide, with effort, not to care.
      effects:
        - { type: relationship, role: npc, affection: -1 }
        - { type: stat, key: stress, delta: 2 }
  - id: ask_who_said
    label: Ask who started it
    outcome:
      text: >-
        {npc.name} won't say, which tells you it was someone you know. You
        spend the week looking at your group a little differently.
      effects:
        - { type: relationship, role: npc, trust: -1 }
        - { type: stat, key: stress, delta: 3 }
