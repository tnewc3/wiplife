# Web reaction (unknownCrime): someone has heard you did something illegal.
id: crime_whispers
title: What they've been saying
text: >-
  {npc.name} pulls you aside at the end of the evening. "I wasn't going to
  ask," {npc.they} {npc:says|say}, "but I heard {heard}. I need to know if
  it's true, because I've been defending you."
tone: serious
category: web
rarity: common
lifeStages: [teen, youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 14 } }
    - { role: npc, alive: true, kind: [friend, sibling, parent, partner, fiance, spouse], heard: { kinds: [unknownCrime], learned: [gossip] } }
weight: { base: 10 }
followUpOnly: true
cast:
  npc: { support: true, presence: anywhere }
choices:
  - id: come_clean
    label: Come clean
    check:
      base: 45
      stats:
        - { role: npc, key: affection, weight: 0.3 }
        - { role: npc, key: trust, weight: 0.3 }
      success:
        text: >-
          You tell {npc.name} the whole thing, small as it was and large as it
          has been in your head. {npc.They} {npc:listens|listen}. At the end,
          {npc.they} {npc:says|say}, "That's not who you are. Don't let it be."
        effects:
          - { type: knowledge, role: npc, action: confirm }
          - { type: relationship, role: npc, affection: 2, trust: 4 }
          - { type: memory, role: npc, tag: you_confided }
          - { type: stat, key: stress, delta: -2 }
      failure:
        text: >-
          You tell it, and hear how it sounds from outside. {npc.name} nods
          slowly and says, "I wish you hadn't told me. Now I know." The
          friendliness drains out of the room.
        effects:
          - { type: knowledge, role: npc, action: confirm }
          - { type: relationship, role: npc, affection: -8, trust: -10 }
          - { type: stat, key: stress, delta: 4 }
  - id: set_straight
    label: Tell {npc.them} what really happened
    outcome:
      text: >-
        You give {npc.name} the real version, which is smaller and stranger
        than what has been going around. {npc.They} {npc:takes|take} it in
        without comment.
      effects:
        - { type: knowledge, role: npc, action: correct }
        - { type: relationship, role: npc, trust: -2 }
        - { type: memory, role: npc, tag: you_set_it_straight }
  - id: deny
    label: Deny it
    check:
      base: 30
      stats: [{ key: confidence, weight: 0.3 }]
      success:
        text: >-
          "That isn't true." {npc.name} studies your face and lets it drop.
          "Good," {npc.they} {npc:says|say}. You both know the word is doing a
          lot of work.
        effects:
          - { type: relationship, role: npc, trust: -3 }
          - { type: stat, key: stress, delta: 3 }
      failure:
        text: >-
          {npc.name} has a very good memory for the details you left out. "Then
          why does everyone say," {npc.they} {npc:begins|begin}, and you watch
          {npc.them} decide for good.
        effects:
          - { type: relationship, role: npc, affection: -10, trust: -14 }
          - { type: stat, key: stress, delta: 5 }
