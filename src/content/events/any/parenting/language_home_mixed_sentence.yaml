id: language_home_mixed_sentence
title: One sentence, two languages
text: >-
  {kid.name} announces that dinner is delicious but a little hot, in a sentence
  that starts in one language and finishes in {childLanguage}, and looks very
  pleased. It is not quite either, and it is entirely {kid.their}.
tone: light
category: parenting
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { family: { minors: { gte: 1 } } }
    - { language: { homeWith: kid } }
weight: { base: 4 }
cooldownYears: 4
cast:
  kid: { kind: child, presence: household, age: { min: 3, max: 10 } }
choices:
  - id: celebrate
    label: Laugh, and then repeat it properly
    outcome:
      text: >-
        {kid.name} repeats it both ways and decides the mixed version is
        better. The family now uses it.
      effects:
        - { type: relationship, role: kid, affection: 4, mood: 6 }
        - { type: parenting, role: kid, warmth: 3 }
  - id: correct
    label: Correct it kindly
    outcome:
      text: >-
        You give the right words, and {kid.name} says them once, then goes back
        to the sentence that had worked for {kid.them}.
      effects:
        - { type: parenting, role: kid, strictness: 2 }
