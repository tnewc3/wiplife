# Chain: a friend asks to borrow money; a year or two later, you find out
# whether you'll see it again.
chain: friend_asks_to_borrow
events:
  - id: friend_asks_to_borrow
    title: Short on rent
    text: >-
      {friend.name} is short on rent and asks if you can spot {friend.them} $300
      until next month.
    tone: neutral
    category: money
    rarity: common
    lifeStages: [youngAdult, adult]
    requires: { money: { gte: 300 } }
    weight:
      base: 8
      modifiers:
        - { if: { trait: kindness, gt: 60 }, x: 1.5 }
    cooldownYears: 6
    # C1: meant to come back now and then (repeats are kept rare otherwise).
    recurring: true
    cast:
      friend: { kind: friend, ageOffset: { min: -4, max: 4 }, createIfMissing: true, presence: anywhere }
    choices:
      - id: lend
        label: Lend it
        outcome:
          text: '{friend.name} hugs you and swears {friend.they} will pay you back.'
          effects:
            - { type: money, delta: -300 }
            - { type: relationship, role: friend, affection: 5 }
            - { type: memory, role: friend, tag: lent_money }
            - { type: schedule, eventId: friend_repays, inYears: [1, 2], cast: [friend] }
      - id: again
        label: Lend it; {friend.they} paid you back last time
        visibleIf: { memory: { role: friend, tag: paid_you_back } }
        outcome:
          text: You don't even hesitate. {friend.name} paid you back last time, with wine. You're hoping for wine again.
          effects:
            - { type: money, delta: -300 }
            - { type: relationship, role: friend, affection: 5, trust: 4 }
            - { type: memory, role: friend, tag: lent_money }
            - { type: schedule, eventId: friend_repays, inYears: [1, 2], cast: [friend] }
      - id: last_time
        label: Remind {friend.them} about last time
        visibleIf: { memory: { role: friend, tag: never_paid_back } }
        outcome:
          text: '"Right," {friend.name} says, going red. "Right. Forget I asked." {friend.They} never {friend:asks|ask} again.'
          effects:
            - { type: relationship, role: friend, affection: -4, trust: -2 }
            - { type: stat, key: confidence, delta: 2 }
      - id: excuse
        label: Make an excuse
        outcome:
          text: '{friend.name} says it''s fine. It clearly isn''t.'
          effects:
            - { type: relationship, role: friend, affection: -3 }

  - id: friend_repays
    title: About that money
    text: >-
      You lent {friend.name} $300 {since}, and {friend.they} just posted photos
      from a beach vacation.
    tone: neutral
    category: money
    rarity: common
    lifeStages: [youngAdult, adult, senior]
    requires: { memory: { role: friend, tag: lent_money } }
    weight: { base: 10 }
    # C1: meant to come back now and then (repeats are kept rare otherwise).
    recurring: true
    followUpOnly: true
    # C1: reviewed build warnings kept on purpose (docs/consistency-review.md).
    justified:
      money: "The $300 left your savings when you lent it (friend_asks_to_borrow); not getting it back changes nothing now."
    cast:
      friend: { kind: friend, presence: anywhere }
    choices:
      - id: remind
        label: Remind {friend.them} about the money
        check:
          base: 50
          stats: [{ key: confidence, weight: 0.3 }]
          success:
            text: '{friend.name} pays you back that week, with a bottle of wine and an apology.'
            effects:
              - { type: money, delta: 300 }
              - { type: memory, role: friend, tag: paid_you_back }
              - { type: relationship, role: friend, affection: 3 }
          failure:
            text: '{friend.name} changes the subject. The money is gone.'
            effects:
              - { type: memory, role: friend, tag: never_paid_back }
              - { type: relationship, role: friend, affection: -5, trust: -10 }
      - id: let_slide
        label: Let it slide
        outcome:
          text: You decide the friendship is worth more than $300. {friend.name} never mentions it.
          effects:
            - { type: memory, role: friend, tag: never_paid_back }
            - { type: relationship, role: friend, trust: -3 }
            - { type: stat, key: kindness, delta: 2 }
