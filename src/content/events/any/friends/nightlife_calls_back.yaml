# Follow-up of nightlife_met_someone: the person you traded numbers with calls.
id: nightlife_calls_back
title: You get a call
text: >-
  Your phone buzzes with a number you did not save. It is {caller.name}, who you traded numbers with on a night out. "I hope this is not weird," {caller.they} {caller:says|say}. "I kept thinking about that conversation."
tone: light
category: friends
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { all: [{ age: { gte: 18 } }, { flag: traded_numbers_nightlife }] }
weight: { base: 5 }
cast:
  caller: { kind: acquaintance, presence: city }
choices:
  - id: meet
    label: Say yes to coffee
    outcome:
      text: >-
        Coffee turns into lunch, and lunch into the kind of laughing that makes strangers look over. It might be nothing. It might not.
      effects:
        - { type: relationship, role: caller, affection: 9, trust: 3 }
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: sociability, delta: 1 }
  - id: pass
    label: Be friendly, then let it ring out
    outcome:
      text: >-
        You are friendly, and vague, and the call ends with nothing arranged. Neither of you calls again.
      effects:
        - { type: relationship, role: caller, affection: -2 }
        - { type: stat, key: happiness, delta: -1 }
