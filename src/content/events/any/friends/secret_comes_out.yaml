# Follow-up of friends_secret: the secret you told gets out.
id: secret_comes_out
title: Everyone knows
text: >-
  The secret {friend.name} told you is all over town, and {friend.they}
  {friend:knows|know} exactly where it started.
tone: serious
category: friends
rarity: common
lifeStages: [teen, youngAdult, adult]
requires: { memory: { role: friend, tag: spilled_their_secret } }
weight: { base: 10 }
followUpOnly: true
cast:
  friend: { kind: friend, presence: city }
choices:
  - id: own
    label: Own up and apologize
    outcome:
      text: '{friend.name} doesn''t forgive you. But {friend.they} {friend:doesn''t|don''t} hate you either, which is something.'
      effects:
        - { type: relationship, role: friend, affection: -8, trust: -15 }
        - { type: stat, key: stress, delta: 3 }
  - id: deny
    label: Deny everything
    outcome:
      text: >-
        It doesn't work. Now {friend.name} thinks you're a gossip and a liar,
        and so do most of your friends.
      effects:
        - { type: relationship, role: friend, affection: -20, trust: -30 }
        - { type: memory, role: friend, tag: fought_with_you }
        - { type: stat, key: happiness, delta: -4 }
        - { type: history, text: 'You lost {friend.name}''s trust when {friend.their} secret got out.', importance: 2 }
