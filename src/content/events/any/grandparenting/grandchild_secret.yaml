id: grandchild_secret
title: Don't tell my mom
text: >-
  {kid.name} waits until you are alone, which takes some doing, and then says
  it in a rush: there is something {kid.they} {kid:hasn't|haven't} told
  {kid.their} parents, and {kid.they} wanted you to know first. {kid.They}
  {kid:looks|look} at you the way people look at the last person they trust.
tone: serious
category: grandparenting
rarity: uncommon
lifeStages: [adult, senior]
requires:
  all:
    - { later: { grandchildren: { gte: 1 } } }
    - { age: { gte: 50 } }
    - { role: kid, kind: [grandchild], alive: true, age: { gte: 9, lte: 17 }, affection: { gte: 55 }, where: [city, household] }
weight: { base: 5 }
cooldownYears: 5
cast:
  kid: { kind: grandchild, presence: nearby }
choices:
  - id: keep_it
    label: Keep it between the two of you, and stay close
    outcome:
      text: >-
        You listen to all of it and say very little. You say you will keep it
        for now, and that you will always tell {kid.them} first if that ever
        changes. {kid.name} breathes out for what feels like the first time in
        weeks.
      effects:
        - { type: relationship, role: kid, affection: 6, trust: 9 }
        - { type: stat, key: stress, delta: 3 }
  - id: help_tell
    label: Help {kid.them} tell {kid.their} parents
    outcome:
      text: >-
        You offer to be in the room. It takes three tries and a very long walk
        to the kitchen, and the conversation is worse than {kid.name} feared and
        better than you feared. By the end, everyone is in the same room.
      effects:
        - { type: relationship, role: kid, affection: 4, trust: 5 }
        - { type: stat, key: stress, delta: 4 }
        - { type: stat, key: kindness, delta: 1 }
  - id: tell_parents
    label: Tell the parents yourself, this evening
    outcome:
      text: >-
        You decide it is too big to carry alone, and you tell them. They are
        grateful. {kid.name} is not, and does not speak to you for a long
        while, and you wonder if you were right.
      effects:
        - { type: relationship, role: kid, affection: -8, trust: -14 }
        - { type: stat, key: stress, delta: 2 }
