# Request (moneyTrouble): someone short of money needs a cosigner.
id: cosign_lease
title: One signature
text: >-
  {npc.name}, your {npc.relation}, found an apartment {npc.they} can almost
  afford. The landlord wants a cosigner with a clean record, and {npc.they}
  {npc:is|are} too embarrassed to ask anyone but you. "It's just a signature,"
  {npc.they} {npc:says|say}. It is, and it is not.
tone: serious
category: lives
rarity: common
lifeStages: [youngAdult, adult]
requires:
  all:
    - { age: { gte: 21 } }
    - { role: npc, alive: true, age: { gte: 18 }, kind: [sibling, friend, child, parent, relative], life: { wealth: [poor, working] } }
    - { not: { finances: { collections: true } } }
    - { not: { flag: cosigned_a_loan } }
weight: { base: 8 }
followUpOnly: true
cast:
  npc: { support: true, presence: anywhere }
choices:
  - id: cosign
    label: Cosign
    check:
      base: 72
      stats:
        - { role: npc, key: trust, weight: 0.3 }
      success:
        text: >-
          You sign. The landlord slides the papers over with a look of
          extreme boredom, and {npc.name} hugs you in the parking lot.
        effects:
          - { type: flag, key: cosigned_a_loan, value: true }
          - { type: relationship, role: npc, affection: 8, trust: 8 }
          - { type: memory, role: npc, tag: cosigned_for_them }
          - { type: schedule, eventId: cosign_paid_off, inYears: [2, 4], cast: [npc] }
      failure:
        text: >-
          You sign. For a while it's fine, and then it isn't, and the first
          letter from the landlord arrives with your name on it.
        effects:
          - { type: flag, key: cosigned_a_loan, value: true }
          - { type: relationship, role: npc, affection: 4, trust: 2 }
          - { type: memory, role: npc, tag: cosigned_for_them }
          - { type: schedule, eventId: cosign_default, inYears: [1, 3], cast: [npc] }
  - id: deposit
    label: Offer to cover the deposit instead
    outcome:
      text: >-
        "That's not what I asked," {npc.name} says. A pause. "But thank you."
        It doesn't solve the whole problem. It solves a piece of it.
      effects:
        - { type: cost, item: loan_small }
        - { type: relationship, role: npc, affection: 4, trust: 3 }
        - { type: memory, role: npc, tag: you_helped_them }
  - id: refuse
    label: Explain why you can't put your name on it
    outcome:
      text: >-
        You lay out your reasons as gently as you can. {npc.name} nods
        through all of it and goes quiet. The quiet goes on for some time.
      effects:
        - { type: relationship, role: npc, affection: -7, trust: -3 }
