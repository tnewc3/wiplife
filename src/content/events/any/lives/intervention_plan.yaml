# Request (intervention): an addiction that has taken over.
id: intervention_plan
title: A room full of people who love you
text: >-
  The family has decided it's time. {npc.name} has been drinking or using for
  too long, and the house has started to fill up with the signs. A counselor
  has written a plan. You're asked to read a letter aloud, in front of
  {npc.them}.
tone: dark
category: lives
rarity: uncommon
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { role: npc, alive: true, age: { gte: 18 }, kind: [parent, sibling, friend, child, grandparent, relative], life: { trouble: [addiction], serious: true } }
weight: { base: 8 }
followUpOnly: true
cast:
  npc: { support: true, presence: anywhere }
choices:
  - id: join_in
    label: Join the circle, but let someone else lead
    outcome:
      text: >-
        You say your piece in two sentences and hold {npc.their} gaze. It
        doesn't feel like enough. It might be.
      effects:
        - { type: relationship, role: npc, affection: -2, trust: 1 }
        - { type: memory, role: npc, tag: staged_their_intervention }
        - { type: stat, key: stress, delta: 4 }
  - id: read_letter
    label: Read the letter and pay for the treatment
    visibleIf: { money: { gte: 3000 } }
    check:
      base: 50
      stats:
        - { role: npc, key: trust, weight: 0.4 }
        - { role: npc, key: affection, weight: 0.2 }
      success:
        text: >-
          Your voice shakes on the third sentence. {npc.name} listens to the end.
          "Okay," {npc.they} {npc:says|say}, in a voice that isn't {npc.theirs}
          yet. "Okay." The car to the clinic leaves that afternoon.
        effects:
          - { type: cost, item: rehab_stay }
          - { type: lifeHelp, role: npc, action: rehab }
          - { type: relationship, role: npc, affection: 6, trust: 7 }
          - { type: memory, role: npc, tag: staged_their_intervention }
          - { type: stat, key: stress, delta: 5 }
      failure:
        text: >-
          {npc.name} stands up halfway through and leaves. You hear the car
          start. The letter is still in your hand.
        effects:
          - { type: cost, item: treatment_help }
          - { type: relationship, role: npc, affection: -8, trust: -9 }
          - { type: memory, role: npc, tag: staged_their_intervention }
          - { type: stat, key: stress, delta: 7 }
  - id: refuse
    label: Refuse to take part; it feels like a trap
    outcome:
      text: >-
        You tell the family you can't ambush someone you love. Maybe you're
        right. The room goes ahead without you, and the silence you leave in
        it is loud.
      effects:
        - { type: relationship, role: npc, affection: 2, trust: 2 }
        - { type: stat, key: stress, delta: 3 }
