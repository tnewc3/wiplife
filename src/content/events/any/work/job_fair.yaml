id: job_fair
title: The job fair
text: >-
  A convention center full of folding tables, free pens and people trying
  to look relaxed about needing work. You're one of them now.
tone: neutral
category: work
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { career: { employed: false, retired: false, lostWithin: 3 } }
weight: { base: 6 }
cooldownYears: 3
choices:
  - id: work_room
    label: Work the room
    check:
      base: 45
      stats: [{ key: sociability, weight: 0.3 }, { key: confidence, weight: 0.3 }]
      success:
        text: You leave with a stack of business cards and two people who promised to put in a word. One actually does.
        effects:
          - { type: stat, key: reputation, delta: 4 }
          - { type: stat, key: confidence, delta: 3 }
      failure:
        text: Every booth wants you to "apply online." You go home with a tote bag and sore feet.
        effects:
          - { type: stat, key: happiness, delta: -2 }
  - id: pens
    label: Take the free pens and go
    outcome:
      text: You'll never need to buy a pen again.
      effects:
        - { type: stat, key: happiness, delta: 1 }
