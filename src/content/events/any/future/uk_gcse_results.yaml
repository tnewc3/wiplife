id: uk_gcse_results
title: GCSE results morning
text: >-
  The envelope is thin and the school hall is full. Everybody tears theirs open
  at the same moment and the noise goes up, all at once, in two colours: a
  cheer and a silence.
tone: neutral
category: future
rarity: common
countries: [uk]
lifeStages: [teen]
followUpOnly: true
requires:
  any:
    - { flag: exam_gcse, eq: top }
    - { flag: exam_gcse, eq: pass }
weight: { base: 12 }
once: true
cast:
  friend: { kind: friend, presence: city, createIfMissing: true, newChance: 0.4 }
choices:
  - id: top_share
    label: Open it right there with {friend.name}
    visibleIf: { flag: exam_gcse, eq: top }
    outcome:
      text: >-
        Seven grades above where you expected. {friend.name} screams, you laugh
        and a teacher takes a photograph of the two of you for the wall.
      effects:
        - { type: relationship, role: friend, affection: 4 }
        - { type: stat, key: happiness, delta: 4 }
  - id: top_alone
    label: Take it home and open it alone
    visibleIf: { flag: exam_gcse, eq: top }
    outcome:
      text: >-
        You wait until the bus has left, sit on the wall outside and open it
        carefully. It is better than fine. You read it three times, in case it
        changes.
      effects:
        - { type: stat, key: confidence, delta: 2 }
        - { type: stat, key: happiness, delta: 2 }
  - id: pass_share
    label: Open it right there with {friend.name}
    visibleIf: { flag: exam_gcse, eq: pass }
    outcome:
      text: >-
        A few better than you hoped, a couple worse. {friend.name} compares
        yours with theirs, and you both decide the numbers are, on the whole, fine.
      effects:
        - { type: relationship, role: friend, affection: 3 }
        - { type: stat, key: happiness, delta: 2 }
  - id: pass_alone
    label: Take it home and open it alone
    visibleIf: { flag: exam_gcse, eq: pass }
    outcome:
      text: >-
        You sit on the wall outside and open it carefully. It is enough. It is,
        honestly, enough.
      effects:
        - { type: stat, key: stress, delta: -2 }
