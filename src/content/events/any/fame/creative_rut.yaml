id: creative_rut
title: Nothing comes
text: >-
  You sit down every morning and nothing arrives. The blank page is a
  patient thing. The deadline, which is not, sits on your shoulder. Every
  idea you have is something you've already done, a little worse.
tone: serious
category: fame
rarity: common
recurring: true
lifeStages: [teen, youngAdult, adult, senior]
requires:
  all:
    - { fame: { active: true } }
    - { fame: { rung: { gte: 2 } } }
    - { fame: { commitment: [steady, all] } }
weight: { base: 1.2, modifiers: [{ if: { fame: { burnout: { gte: 50 } } }, x: 1.6 }] }
cooldownYears: 3
choices:
  - id: go_outside
    label: Walk away from it for a while
    outcome:
      text: A week of long walks, a bad film and a conversation with a stranger on a train. Then, at the sink, doing dishes, the idea arrives.
      effects:
        - { type: fame, action: burnout, delta: -6 }
        - { type: fame, action: craft, delta: 2 }
  - id: grind
    label: Force it
    check:
      base: 45
      stats: [{ key: discipline, weight: 0.3 }, { fame: craft, weight: 0.2 }]
      success:
        text: Four hundred bad pages, then forty fair ones, then one that works. You use the one.
        effects:
          - { type: fame, action: craft, delta: 3 }
          - { type: stat, key: stress, delta: 3 }
      failure:
        text: What you make is competent and dead. You know it, and hand it in anyway.
        effects:
          - { type: fame, action: craft, delta: -1 }
          - { type: fame, action: burnout, delta: 6 }
