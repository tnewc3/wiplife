id: band_offer_minor
title: The band from school
text: >-
  {offerName}, some kids from around school, need one more for their band, and
  they asked you. Your {parent.relation} wants to meet them first, and to know
  where they practise.
tone: light
category: fame
rarity: common
recurring: true
lifeStages: [child, teen]
requires:
  all:
    - { age: { lte: 17 } }
    - { fame: { active: true } }
    - { fame: { offer: true } }
weight: { base: 10 }
followUpOnly: true
cast:
  parent: { kind: parent, presence: household }
choices:
  - id: join
    label: Ask your {parent.relation} to say yes
    outcome:
      text: >-
        Your {parent.relation} meets them, checks the garage and says yes. You
        are in {bandName}, and you have to be home by nine.
      effects:
        - { type: band, action: join }
        - { type: relationship, role: parent, trust: 2 }
  - id: no
    label: Say no thanks
    outcome:
      text: You tell them you are busy. Your {parent.relation} looks a little relieved.
      effects:
        - { type: stat, key: happiness, delta: -1 }
