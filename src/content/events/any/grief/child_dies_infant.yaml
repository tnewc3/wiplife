# Registry: childDeath.infant. Rare, and never casual: it starts a grief chain
# (after_child_death_*), leaves its mark on the history and the obituary, and
# is told without anything graphic.
id: child_dies_infant
title: The hospital corridor
text: >-
  The doctors have stopped talking in sentences. Then one of them sits down beside you, which is how you know. {child.name} is gone, before there was time to know {child.them}. The room is very bright, and you cannot hear anything at all.
tone: dark
category: grief
rarity: common
lifeStages: [youngAdult, adult, senior]
requires: { age: { gte: 18 } }
weight: { base: 10 }
followUpOnly: true
cast:
  # Passed in by the engine: your child, who has died.
  child: { kind: child, presence: anywhere, deceased: true }
autoOutcome:
  text: >-
    You hold {child.name} for as long as they will let you. Afterwards you sit in the car in the parking lot, unable to turn the key. Nothing in your life has a shape anymore.
  effects:
    - { type: flag, key: lost_a_child, value: true }
    - { type: stat, key: happiness, delta: -30 }
    - { type: stat, key: stress, delta: 25 }
    - { type: stat, key: health, delta: -5 }
    - { type: history, text: 'You lost your child, {child.name}.', importance: 3 }
    - { type: schedule, eventId: after_child_death_numb, inYears: [1, 1], cast: [child] }
    - { type: schedule, eventId: after_child_death_together, inYears: [1, 2] }
    - { type: schedule, eventId: after_child_death_sibling, inYears: [1, 2], cast: [child] }
    - { type: schedule, eventId: after_child_death_milestone, inYears: [4, 7], cast: [child] }
