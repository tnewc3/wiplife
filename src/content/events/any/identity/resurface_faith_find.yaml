id: resurface_faith_find
title: The pull is back
text: >-
  You thought you had put it away: the pull toward {latentFaith}. It is back,
  as ordinary as a change in the weather, and no louder than before. It
  seems to have been waiting for you to be ready to hear it.
tone: neutral
category: identity
rarity: uncommon
lifeStages: [teen, youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 14 } }
    - { discovery: { latent: [faith] } }
    - { faith: { leaning: true } }
    - { faith: { pull: [find, convert] } }
weight: { base: 10 }
followUpOnly: true
choices:
  - id: follow
    label: Listen to it this time
    outcome:
      text: >-
        This time you do not look away. It takes a while to find the words,
        and longer to find the people, but you find both.
      effects:
        - { type: faith, action: fromLatent }
  - id: again
    label: Put it away again
    outcome:
      text: >-
        You do, with more effort than the last time. It will keep coming
        back until you answer it, or it stops. You are not sure which you hope for.
      effects:
        - { type: stat, key: stress, delta: 2 }
