# Self-discovery (registries/discovery.yaml surfacing.faith): a pull toward a faith you do not have.
id: discovery_faith_find
title: A pull you can't explain
text: >-
  It started with a passing thought, then a book, then a song. Something about
  {latentFaith}, and a quiet pull toward it that you can't account for. It isn't
  a phase. It keeps coming back.
tone: neutral
category: identity
rarity: uncommon
lifeStages: [teen, youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 14 } }
    - { discovery: { latent: [faith] } }
    - { faith: { leaning: true } }
    - { faith: { pull: [find] } }
weight: { base: 10 }
followUpOnly: true
choices:
  - id: follow
    label: Follow the pull, openly
    outcome:
      text: >-
        You start by reading, then asking, then sitting in the back of a
        service with your coat on. It takes a year before it has a name, and
        longer before you say it aloud to the people close to you.
      effects:
        - { type: faith, action: fromLatent }
        - { type: stat, key: happiness, delta: 2 }
  - id: wait
    label: Hold it quietly for now
    outcome:
      text: >-
        You keep it to yourself, a private room in the house. It's there
        when you want it, and it keeps asking to be opened.
      effects:
        - { type: stat, key: stress, delta: 1 }
  - id: push_down
    label: Put it away. It doesn't fit the life you have
    outcome:
      text: >-
        You close the book, change the subject and do not go to the building.
        The feeling does not go anywhere. It waits.
      effects:
        - { type: stat, key: stress, delta: 2 }
