id: group_rival_clash
title: The two of you and the agenda
text: >-
  {rival.name} and you have been on opposite sides of every decision at
  {group} this season. Tonight it gets personal, in a room where everyone
  pretends not to listen.
tone: neutral
category: belonging
rarity: common
lifeStages: [youngAdult, adult, senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { group: { member: true } }
    - { group: { years: { gte: 1 } } }
    - { role: rival, alive: true, kind: [friend] }
weight: { base: 6 }
bindGroup: true
cast:
  rival: { kind: friend, group: yours, presence: city }
choices:
  - id: talk
    label: Ask to talk privately afterward
    check:
      base: 55
      stats:
        - { role: rival, key: affection, weight: 0.25 }
        - { key: kindness, weight: 0.2 }
      success:
        text: >-
          In the parking lot, {rival.name} says what was underneath it, and so
          do you. Neither of you gives much ground. Both of you leave lighter.
        effects:
          - { type: relationship, role: rival, affection: 8, trust: 6 }
          - { type: group, action: standing, delta: 3 }
      failure:
        text: >-
          The talk goes in circles and ends with each of you being
          reasonable at the other. You have a rival now, in the proper sense.
        effects:
          - { type: relationship, role: rival, affection: -6, trust: -4 }
          - { type: stat, key: stress, delta: 3 }
  - id: win
    label: Win the vote
    outcome:
      text: >-
        You win it. {rival.name} claps, because there's an audience, and avoids
        you at the next three meetings.
      effects:
        - { type: relationship, role: rival, affection: -8, trust: -4 }
        - { type: group, action: standing, delta: 3 }
  - id: concede
    label: Give way on this one
    outcome:
      text: >-
        You concede, and say you will still argue the next one. {rival.name}
        looks surprised, then pleased, then suspicious, which is a fair
        progression.
      effects:
        - { type: relationship, role: rival, affection: 4, trust: 4 }
        - { type: group, action: standing, delta: 1 }
