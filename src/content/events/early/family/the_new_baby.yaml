id: the_new_baby
title: The new baby
text: >-
  There's a baby in the house now, {sibling.name}, and everyone keeps saying
  {sibling.they} {sibling:is|are} yours too. Nobody asked you.
tone: light
category: family
rarity: common
lifeStages: [early]
requires: { age: { gte: 2 } }
weight: { base: 8 }
once: true
cast:
  sibling: { kind: sibling, age: { min: 0, max: 1 } }
choices:
  - id: guard
    label: Appoint yourself the baby's guard
    outcome:
      text: >-
        You stand watch by the crib with a toy sword. When {sibling.name}
        grabs your finger, you decide the job is for life.
      effects:
        - { type: relationship, role: sibling, affection: 10, trust: 5 }
        - { type: stat, key: kindness, delta: 3 }
  - id: return
    label: Ask when the baby is going back
    outcome:
      text: >-
        Not for a while, apparently. You sulk magnificently for a month and
        then, without telling anyone, start to like {sibling.them}.
      effects:
        - { type: relationship, role: sibling, affection: 3 }
        - { type: stat, key: stress, delta: 2 }
