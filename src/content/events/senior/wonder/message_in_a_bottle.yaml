# Legendary: secret and rare. It is recorded only in life history.
id: message_in_a_bottle
title: A message in a bottle
text: >-
  Walking the beach after a storm, you find a green glass bottle half buried
  in the sand. Inside is a note in a child's handwriting, signed {writer.name}
  and dated sixty years ago: "To whoever finds this. I hope you're happy."
tone: light
category: wonder
rarity: legendary
lifeStages: [senior]
weight: { base: 40 }
once: true
cast:
  writer: { kind: acquaintance, age: { min: 66, max: 80 }, createIfMissing: true, newChance: 1 }
choices:
  - id: find
    label: Track down whoever wrote it
    outcome:
      text: >-
        It takes three months, two librarians and one very patient post office.
        {writer.name} is in {writer.their} seventies now, and cries when you
        read the note aloud over the phone. You talk every Sunday after that.
      effects:
        - { type: relationship, role: writer, kind: friend, affection: 20, trust: 10 }
        - { type: stat, key: happiness, delta: 8 }
        - { type: history, text: 'You found a message in a bottle on the beach, and tracked down {writer.name}, who threw it into the sea sixty years before. You became friends.', importance: 3 }
  - id: frame
    label: Frame the note on your wall
    outcome:
      text: You read a stranger's sixty-year-old wish every morning. "I hope you're happy." You mostly are.
      effects:
        - { type: stat, key: happiness, delta: 6 }
        - { type: history, text: 'You found a sixty-year-old message in a bottle on the beach, and framed it.', importance: 3 }
