id: caring_for_spouse
title: In sickness
text: >-
  {spouse.name}'s health has been failing. Some days {spouse.they}
  {spouse:needs|need} help with everything, and {spouse.they}
  {spouse:hates|hate} it.
tone: serious
category: romance
rarity: common
lifeStages: [senior]
requires: { age: { gte: 18 } }
weight: { base: 6 }
once: true
cast:
  spouse: { kind: spouse, age: { min: 65, max: 120 } }
choices:
  - id: care
    label: Take care of {spouse.them} yourself
    outcome:
      text: >-
        You learn how to do things you never wanted to learn. On good days,
        {spouse.name} tells you stories you'd never heard.
      effects:
        - { type: relationship, role: spouse, affection: 10, trust: 6 }
        - { type: memory, role: spouse, tag: was_there_for_them }
        - { type: stat, key: stress, delta: 8 }
        - { type: stat, key: health, delta: -2 }
  - id: nurse
    label: Hire a nurse to help
    visibleIf: { money: { gte: 4000 } }
    outcome:
      text: The nurse is kind and brisk. You get your evenings back, and some of your sleep.
      effects:
        - { type: money, delta: -4000 }
        - { type: relationship, role: spouse, affection: 3 }
        - { type: stat, key: stress, delta: 2 }
  - id: struggle
    label: Keep going as if nothing has changed
    outcome:
      text: You both pretend. It works until it doesn't.
      effects:
        - { type: relationship, role: spouse, affection: -4 }
        - { type: stat, key: stress, delta: 5 }
