id: ca_long_term_care_list
title: The list for long-term care
text: >-
  {parent.name} can no longer manage alone, and the long-term care home you
  chose has a wait list measured in months. A social worker explains the options
  in the tone of someone who has had this conversation many times this week.
tone: serious
category: family
rarity: uncommon
countries: [ca]
lifeStages: [adult, senior]
requires:
  all:
    - { age: { gte: 40 } }
    - { role: parent, alive: true, age: { gte: 75 } }
weight: { base: 6 }
cooldownYears: 8
cast:
  parent: { kind: parent, presence: anywhere }
choices:
  - id: wait
    label: Wait for the public bed and visit often
    outcome:
      text: >-
        Seven months of drives across town and a hospital hallway that smells of
        antiseptic and coffee. When the bed comes, it is a good one, and {parent.name}
        is quietly grateful.
      effects:
        - { type: relationship, role: parent, affection: 5 }
        - { type: stat, key: stress, delta: 4 }
  - id: private
    label: Pay for a private residence ({$14000} for the year)
    outcome:
      text: >-
        The residence has a garden and a dining room with tablecloths. The year
        costs {$14000}, and {parent.name} says it feels like a hotel that knows
        their name.
      effects:
        - { type: money, delta: -14000 }
        - { type: relationship, role: parent, affection: 6 }
        - { type: stat, key: stress, delta: -1 }
  - id: home
    label: Bring {parent.them} home and arrange home care
    outcome:
      text: >-
        A hospital bed in the living room, a care worker three mornings a week
        and your family's evenings rearranged. It is exhausting and it is yours.
      effects:
        - { type: money, delta: -3200 }
        - { type: relationship, role: parent, affection: 8 }
        - { type: stat, key: stress, delta: 6 }
