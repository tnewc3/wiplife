id: attic
title: The attic
text: >-
  You finally go through the attic. Decades of boxes: tax returns, old
  letters, a ceramic ashtray nobody remembers making, and a coat you swore
  you'd fit into again.
tone: neutral
category: home
rarity: common
lifeStages: [senior]
requires:
  all:
    - { age: { gte: 18 } }
    - { home: { kind: [owned] } }
weight: { base: 4 }
once: true
cast:
  partner: { kind: spouse, optional: true }
choices:
  - id: all
    label: Get rid of almost everything
    outcome:
      text: Seventeen bags to the curb. The house feels lighter, and so, oddly, do you.
      effects:
        - { type: stat, key: stress, delta: -4 }
        - { type: stat, key: happiness, delta: 1 }
  - id: sort
    label: Read every single thing first
    outcome:
      text: It takes all summer. You cry twice and laugh much more than that. You keep one box.
      effects:
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: stress, delta: 1 }
  - id: together
    label: Go through it together with {partner.name}
    visibleIf:
      all:
        - { role: partner }
        - { home: { partner: true } }
    outcome:
      text: >-
        Every box has an argument in it: whose idea that lamp was, who said
        they'd never wear that again. You keep more than you meant to, together.
      effects:
        - { type: relationship, role: partner, affection: 6 }
        - { type: stat, key: happiness, delta: 3 }
        - { type: stat, key: stress, delta: -2 }
  - id: close
    label: Close the hatch. Next year
    outcome:
      text: The boxes wait, patient as ever.
      effects:
        - { type: stat, key: stress, delta: 1 }
