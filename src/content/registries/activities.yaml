# The Activities hub (A1, rebuilt by U2): the categories of the Activities tab, and the activities in them. A category opens
# a submenu of its activities, split into an Activities and a Shopping section (`section`, Activities by default). An
# activity of kind `options` lists the leisure definitions of src/content/pastimes that name it as their `hub`; a `link`
# opens a page that already does the job (groups, faith, therapy, ...). icon is an id of registries/icons.yaml.
#
# A category shows only when it applies: it is old enough (`minAge`), rich enough (`needs`: a net worth threshold of
# balance/activities.yaml), and has an activity for you. An activity that is closed to you is greyed out with the reason,
# or hidden (`hideWhenNothing`). `sharedRepeats: false` is for an activity that gathers unrelated options (crime, loans):
# each option keeps its own repeats, and `limit` is only a cap on the lot.
categories:
  - { id: featured, label: Featured, icon: rocket, subtitle: "Do your own thing.", minAge: 8 }
  - { id: health, label: Health, icon: stethoscope, subtitle: "Doctors, specialists, therapy and donating." }
  - { id: recovery, label: Recovery, icon: reminder_ribbon, subtitle: "Support groups, rehab and counseling.", minAge: 12 }
  - { id: mind_body, label: Mind & body, icon: person_lotus, subtitle: "Gym, walks, meditation, yoga and reading." }
  - { id: outdoors, label: Outdoors, icon: mountain, subtitle: "Trails, water, camping and gear.", minAge: 4 }
  - { id: social_love, label: Social & love, icon: two_hearts, subtitle: "Dates, nights out, parties and the feed.", minAge: 5 }
  - { id: groups, label: Groups, icon: busts_in_silhouette, subtitle: "Clubs, causes and your neighborhood.", minAge: 5 }
  - { id: faith, label: Faith, icon: place_of_worship, subtitle: "Your community, and other faiths to explore.", minAge: 5 }
  - { id: leisure, label: Leisure, icon: beach_with_umbrella, subtitle: "Trips, spa days, hobbies, movies and pets." }
  - { id: money_luck, label: Money & luck, icon: money_bag, subtitle: "Lottery, casino, loans and the shops.", minAge: 5 }
  - { id: black_market, label: Black market, icon: money_with_wings, subtitle: "Cash, no questions, and the trouble that follows.", minAge: 16 }
  - { id: crime, label: Crime, icon: police_car_light, subtitle: "Every one has a price, and a record.", minAge: 13 }
  - { id: legal, label: Law & life, icon: compass, subtitle: "Lawsuits, names, moving abroad and the teen years." }
  - { id: luxury, label: Luxury, icon: gem_stone, subtitle: "VIP nights, private societies and the finest things money buys.", minAge: 18, needs: luxury, accent: gold }

