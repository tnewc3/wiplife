# The events the sports step queues (E6c). Every event listed must be
# followUpOnly: it only happens this way. Each is picked by weight among those
# whose requirements fit now.
#
# draft         you declared and a team picked you
# undrafted     the draft passed you by
# signed        a deal was struck (a new team, or a renewal)
# contractYear  the last year of your deal
# freeAgency    you tested the market, or your deal ran out
# traded        a trade moved you
# released      a team let you go
# injury        you were hurt this season
# agedOut       you did not make the next team up
# playoffs      a run begins (the first series; later series are put in after it)
# stalled       no team will have you
# ended         an injury ended your career
# declining      the years are catching up
# retirement    a natural time to stop
# hall          the Hall of Fame ballot
# suspended     a ban
# bigGame       a moment that could define the season
# slump, breakout, locker, rookie, rivalry   the colour of a season
# endorsement   a brand wants your name
# recruited     college programs have offers on the table (Batch 5)
# probation     a grade under the floor: a warning on your scholarship
# scholarshipLost  a second year under the floor: eligibility gone
# combine       pre-draft workouts and interviews for a prospect
# camp          a camp, an open tryout or a call for a player with no team
# role          a fight for a place, a bigger role to ask for, a coach's move
# offseason     a plan for the summer
# number        a jersey number to pick on a new team
# captain       the team wants a captain
#
# tryouts       the scrimmage a tryout plays, by the level of the team (the choice is how you play it)
triggers:
  draft: { events: [draft_night_first_round, draft_night_later_round] }
  undrafted: { events: [undrafted_phone_calls] }
  signed: { events: [new_deal_signed] }
  contractYear: { events: [contract_year_pressure] }
  freeAgency: { events: [free_agency_market] }
  traded: { events: [traded_overnight] }
  released: { events: [released_phone_call] }
  injury: { events: [injury_play_through_pain] }
  agedOut: { events: [aged_out_of_the_team] }
  playoffs: { events: [playoffs_opening_series, playoffs_opening_road, playoffs_semifinal_swing, playoffs_final_game_seven, playoffs_final_last_play] }
  stalled: { events: [no_team_calls] }
  ended: { events: [injury_career_over] }
  declining: { events: [declining_step_slower] }
  retirement: { events: [retirement_press_conference] }
  hall: { events: [hall_of_fame_ballot] }
  suspended: { events: [suspension_served] }
  bigGame: { events: [big_game_basketball, big_game_football, big_game_soccer, big_game_baseball, big_game_hockey] }
  slump: { events: [slump_season_doubts] }
  breakout: { events: [breakout_season_attention] }
  locker: { events: [locker_room_speak_up, locker_room_rift, veteran_mentor] }
  rookie: { events: [rookie_first_game] }
  rivalry: { events: [rivalry_trash_talk] }
  endorsement: { events: [endorsement_offer] }
  recruited: { events: [recruiting_offers_on_the_table, recruiting_campus_visit] }
  probation: { events: [scholarship_grade_warning] }
  scholarshipLost: { events: [scholarship_eligibility_lost] }
  combine: { events: [combine_workout_day, combine_interview_room, combine_stock_rumour] }
  camp: { events: [camp_open_tryout_day, camp_walk_on_invite, camp_practice_squad_call] }
  role: { events: [role_battle_for_the_start, role_ask_for_minutes, role_coach_moves_you] }
  offseason: { events: [offseason_plan_choice, offseason_private_coach_offer, offseason_pickup_run] }
  number: { events: [jersey_number_choice, jersey_number_taken] }
  captain: { events: [captain_vote, captain_locker_room_problem] }

tryouts:
  youth: [tryout_youth_trials, tryout_travel_team_trials]
  school: [tryout_school_gym, tryout_school_cold_gym]
  college: [tryout_college_walk_on, tryout_college_open_run]
  pro: [tryout_pro_camp, tryout_pro_open_workout]
