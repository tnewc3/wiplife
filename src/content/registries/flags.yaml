# Every flag an event can set, with a one-line description.
flags:
  parents_fought: Your parents argued a lot when you were small
  parents_split: Your parents separated
  has_dog: You have a dog
  had_dog: You had a dog who has died
  broke_arm: You broke your arm as a child
  shoplifted: You have stolen from a store
  caught_shoplifting: You were caught shoplifting
  can_drive: You can drive
  ran_marathon: You have run a marathon
  volunteers: You volunteer at the animal shelter
  wrote_memoir: You wrote your life story
  jumped_from_plane: You have been skydiving
  met_the_stranger: You met the stranger on the bench and listened
  # Money and home (Stage 6).
  filed_bankruptcy: You have filed for bankruptcy
  was_evicted: You have been evicted
  # School (Stage 7). Several count for or against applications
  # (balance/education.yaml admission flags).
  high_test_scores: You did very well on a college entrance exam
  strong_essay: You wrote a college essay that stood out
  teacher_recommendation: A teacher wrote you a glowing recommendation
  recruited_athlete: College coaches recruited you to play
  valedictorian: You were valedictorian of your class
  caught_cheating: You were caught cheating at school
  suspended: You were suspended from school
  research_assistant: You worked as a professor's research assistant
  gifted_program: You were in the gifted program at school
  advanced_classes: You took advanced classes in high school
  studied_abroad: You spent a semester studying abroad
