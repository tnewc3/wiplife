# Every flag an event can set, with a one-line description.
flags:
  parents_fought: Your parents argued a lot when you were small
  parents_split: Your parents separated
  has_dog: You have a dog
  had_dog: You had a dog who has died
  broke_arm: You broke your arm as a child
  shoplifted: You have stolen from a store
  caught_shoplifting: You were caught shoplifting
  ran_marathon: You have run a marathon
  volunteers: You volunteer at the animal shelter
  wrote_memoir: You wrote your life story
  jumped_from_plane: You have been skydiving
  met_the_stranger: You met the stranger on the bench and listened
  # Money and home (Stage 6).
  filed_bankruptcy: You have filed for bankruptcy
  was_evicted: You have been evicted
  # School (Stage 7). Several count for or against applications
  # (balance/education.yaml admission flags).
  high_test_scores: You did very well on a college entrance exam
  strong_essay: You wrote a college essay that stood out
  teacher_recommendation: A teacher wrote you a glowing recommendation
  recruited_athlete: College coaches recruited you to play
  valedictorian: You were valedictorian of your class
  caught_cheating: You were caught cheating at school
  suspended: You were suspended from school
  research_assistant: You worked as a professor's research assistant
  gifted_program: You were in the gifted program at school
  advanced_classes: You took advanced classes in high school
  studied_abroad: You spent a semester studying abroad
  # Work (Stage 8).
  office_romance: You dated someone you worked with
  stole_from_work: You stole from an employer
  whistleblower: You blew the whistle on wrongdoing at work
  burned_out: You worked yourself into burnout
  union_member: You helped unionize a workplace
  # Health, the law and self-discovery (Stage 9).
  tried_alcohol: You had your first drink as a teenager
  painkillers: You were prescribed strong painkillers
  in_recovery: You went to treatment for an addiction
  joyrode: You took a joyride in a car that wasn't yours
  tagged_bridge: You spray-painted a bridge
  dui_arrest: You were arrested for driving drunk
  ran_package: You drove a package for money and didn't ask what was in it
  cooked_books: You moved numbers at work that shouldn't have moved
  studied_inside: You took classes in prison
  came_out: You told people close to you who you are
  # Interactions (E1).
  unfaithful: You were unfaithful to a partner
  was_infected: You caught an infection from an intimate night
  # E2a: children and parenting.
  ended_a_pregnancy: You ended a pregnancy
  had_miscarriage: You went through a miscarriage
  placed_baby_for_adoption: You placed a baby for adoption
  lost_a_child: You lost a child
  adopted_a_child: You adopted a child
  used_ivf: You went through IVF
  used_surrogate: You had a child through surrogacy
  fought_for_custody: You fought for custody of your children
  gave_up_custody: You gave up custody of your children
  shared_custody: You share custody of your children
  stepfamily: You married into a family with children
  # E2b: heirs and inheritance.
  estate_will: Your parent left a will
  estate_no_will: Your parent left no will
  left_out_of_will: Your parent's will left you out
  inherited_a_home: You inherited a home
  in_foster_care: You are in foster care
  grew_up_in_foster_care: You grew up in foster care
  contested_will: You contested a will
  kept_the_family_home: You kept the family home
  sold_the_family_home: You sold the family home
  reconciled_over_estate: You settled things with a sibling after your parent died
  parent_will_dispute: You and a sibling fell out over your parent's will
  # E3: the people you know ask something of you.
  is_a_godparent: You are a godparent
  took_in_a_relative: You took a relative into your home to be looked after
  paid_for_care: You pay for a relative's care
  cosigned_a_loan: You cosigned a loan for someone
  # E4: the web between the people you know.
  hosted_a_peace_dinner: You hosted a dinner to get two people talking
  was_outed: Someone else told people who you are before you did
  # M1: mental health.
  kept_diagnosis_private: You have chosen to keep a mental health diagnosis to yourself
  told_boss_about_diagnosis: You told your boss about a mental health diagnosis
  # E5: pets, vehicles and homes.
  had_car_accident: You have been in a car accident
  drove_drunk_crash: You crashed after drinking and driving
  lost_a_pet: A pet of yours died
  pet_never_found: A pet of yours ran off and was never found
  car_was_stolen: Your car was stolen
  got_help_with_first_car: A parent helped you pay for your first car
  # T1: the teen years.
  plans_college: You told your parents you plan to go to college
  plans_trade: You told your parents you plan to learn a trade
  plans_work: You told your parents you plan to go straight to work
  passion_scholarship: A scholarship came out of a passion you spent years on
  # E6a: crime careers.
  joined_a_crew: You were in a crew
  turned_down_a_crew: You said no to a crew that wanted you
  promised_to_leave_the_crew: You promised someone close to you that you would leave the crew
  testified_against_crew: You gave the police what you knew about your crew
