# Content icons (U1). Each is a Microsoft Fluent Emoji, Color style (MIT), copied into public/icons/<id>.svg by
# `npm run icons -- <path to a fluentui-emoji checkout>` (tools/icons/fetch-fluent.ts). Only the icons used are
# listed; every one is credited in CREDITS.md, and the content build checks that the file and the credit exist.
# fluent: the emoji's folder name in github.com/microsoft/fluentui-emoji/assets. variant: for emoji with skin tones.
