# Event card categories (U1): the banner across the top-right of an event card, and the card's border color, which
# comes from the banner's token (--wl-cat-<id> in src/ui/theme/tokens.css). icon: the card's default icon (an id from
# registries/icons.yaml). An event's own `banner` and `icon` fields override these.
banners:
  family: { label: Family, icon: hugging_face }
  love: { label: Love, icon: two_hearts }
  friends: { label: Friends, icon: handshake }
  people: { label: People, icon: speech_balloon }
  work: { label: Work, icon: briefcase }
  school: { label: School, icon: graduation_cap }
  money: { label: Money, icon: money_bag }
  health: { label: Health, icon: stethoscope }
  mind: { label: Mind, icon: brain }
  crime: { label: Crime, icon: police_car_light }
  fame: { label: Fame, icon: glowing_star }
  sports: { label: Sports, icon: trophy }
  home: { label: Home, icon: house_with_garden }
  travel: { label: Travel, icon: airplane }
  pets: { label: Pets, icon: paw_prints }
  wonder: { label: Wonder, icon: sparkles }
  grief: { label: Grief, icon: candle }
  life: { label: Life, icon: calendar }

# Every event category (registries/categories.yaml) shows under one banner. The content build rejects a category
