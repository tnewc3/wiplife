# W3: businesses. The events the business step queues (every one is a follow-up about your business), and the traits an
# established business for sale can have.

triggers:
  opening:
    events: [biz_opening_day, biz_first_week_nerves]
  nearFailure:
    events: [biz_near_failure_bank, biz_near_failure_cut_costs, biz_near_failure_family_offer]
  failure:
    events: [biz_failure_closing_day, biz_failure_debts]
  investorLoss:
    events: [biz_investor_lost_money_friend, biz_investor_lost_money_family]
  cofounder:
    events: [biz_cofounder_dispute, biz_cofounder_credit, biz_cofounder_wants_out]
  expansion:
    events: [biz_expansion_chance, biz_expansion_new_city]
  manager:
    events: [biz_manager_numbers_off, biz_manager_quits]
  license:
    events: [biz_license_lapse]

