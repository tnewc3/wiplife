# Event categories. An optional cooldownYears keeps other events of the
# same category away for that many years after one fires. Categories marked
# romance are adults only: the engine blocks them for anyone under the adult
# age, and the content build requires every such event to say so.
#
# C1, category contracts: requires lists what every event of the category
# must require (the content build rejects one that doesn't, and one that
# fires without it is an invariant failure). household marks home, health
# and wellbeing: a partner who lives with you is preferred for their roles.
# W4a, country tags. An event tagged `countries: [ca]` happens only there (the content build turns the tag into the
# requirement). An event with no tag happens in every country, so it must read right in all of them: amounts as
# {$300} (US prices, scaled and shown in the local currency), schools as {highSchool}, {principal}, {college},
# {entranceExam}, the currency as {currency}, the country as {country}. Wording that belongs to one country alone may
# appear only in events tagged for that country alone; the patterns below are the build's list (case-sensitive).
countryTags:
  neutral: "Untagged events read right in every country: write amounts as {$300} and school words as {highSchool}."
  # Words each country says its own way: an untagged event writes the placeholder.
  placeholders:
    - { pattern: '\bhigh school\b', use: '{highSchool}' }
    - { pattern: '\bmiddle school\b', use: '{middleSchool}' }
    - { pattern: '\belementary school\b', use: '{elementarySchool}' }
    - { pattern: '\b[Pp]rincipal\b', use: '{principal}' }
    - { pattern: '\b[Mm]om\b', use: 'a name for the parent, or {parent.name}' }
  terms:
    - countries: [us]
      patterns:
        - '\bSAT\b'
        - '\bACT scores?\b'
        - '\bAP (classes|class|exam|exams|courses|course)\b'
        - '\bFAFSA\b'
        - '\bMedicare\b'
        - '\bMedicaid\b'
        - '\bSocial Security\b'
        - '401\(?k\)?'
        - '\bIRS\b'
        - '\bDMV\b'
        - '\bhomecoming\b'
        - '\bFourth of July\b'
        - '\bSuper Bowl\b'
        - '\bLittle League\b'
        - '\bBoy Scouts\b'
        - '\bGirl Scouts\b'
        - '\b4-H\b'
        - '\bPTA\b'
        - '\b[Ff]reshman\b'
        - '\b[Ss]ophomore\b'
        - '\b[Jj]unior year\b'
        - '\b[Ss]enior year\b'
        - '\b[Ss]heriff\b'
        - '\bcounty\b'
        - '\bin-state\b'
        - '\bout-of-state\b'
        - '\bZIP\b'
        - '\bstate (school|university|college)\b'
        - '\bSecond Amendment\b'
        - '\bsenator\b'
        - '\bgovernor\b'
    - countries: [ca]
      patterns:
        - '\bOHIP\b'
        - '\bCEGEP\b'
        - '\bTim Hortons\b'
        - '\bprovincial health\b'
        - '\bProvince of\b'
        - '\bMountie\b'
        - '\bRCMP\b'
        - '\bCanada Day\b'
        - '\bCanadian Thanksgiving\b'
        - '\bToque\b'
    - countries: [uk]
      patterns:
        - '\bNHS\b'
        - '\bGCSEs?\b'
        - '\bA-levels?\b'
        - '\bUCAS\b'
        - '\bsixth form\b'
        - '\bGP\b'
        - '\bcouncil (tax|flat|house|estate)\b'
        - '\bBank Holiday\b'
        - '\bBonfire Night\b'
        - '\bWestminster\b'
        - '\bpub quiz\b'
        - '\bMP\b'
    - countries: [mx]
      patterns:
        - '\bIMSS\b'
        - '\bISSSTE\b'
        - '\bpreparatoria\b'
        - '\bprepa\b'
        - '\bDía de Muertos\b'
        - '\bquinceañera\b'
        - '\bQuinceañera\b'
        - '\bPosadas?\b'
        - '\bzócalo\b'
        - '\bAfore\b'
        - '\bSEP\b'
    # Valedictorians and Thanksgiving are North American traditions (on different dates).
    - countries: [us, ca]
      patterns:
        - '\b[Vv]aledictorian\b'
        - '\bThanksgiving\b'

categories:
  family: { label: Family }
  play: { label: Play }
  school:
    label: School life
    requires: { education: { program: [elementary, middle, high, college, trade, grad] } }
  friends: { label: Friends }
  romance: { label: Love and dating, romance: true }
  people: { label: People }
  mischief: { label: Trouble }
  health: { label: Health, household: true }
  money: { label: Money }
  home: { label: Home, household: true }
  community: { label: Community }
  work:
    label: Work
    requires: { career: { employed: true, retired: false } }
  # C1: work events that aren't about a current job.
  career: { label: Finding work }
  jobless:
    label: Out of work
    requires:
      all:
        - { career: { employed: false, retired: false } }
        - { fame: { active: false } }
  retirement:
    label: Retirement
    requires: { career: { retired: true } }
  # C1: you and the partner you have now (dating, engaged or married).
  partner:
    label: You and your partner
    romance: true
    household: true
    requires: { romance: [dating, engaged, married] }
  wonder: { label: Strange and wonderful, cooldownYears: 10 }
  # Stage 9.
  justice: { label: The law }
  prison:
    label: Prison
    prison: true
    requires: { legal: { incarcerated: true } }
  identity: { label: Who you are }
  vice: { label: Vices }
  # E2a: children and parenting.
  pregnancy: { label: Expecting }
  building: { label: Building a family }
  parenting:
    label: Raising children
    requires: { family: { minors: { gte: 1 } } }
  grownkids:
    label: Grown children
    requires: { family: { children: { gte: 1 } } }
  stepfamily:
    label: Stepfamily
    requires: { family: { steps: { gte: 1 } } }
  grief: { label: Grief }
  custody: { label: Custody }
  # E2b: heirs. Every one of these needs you to be an heir (you carried on from a parent).
  estate:
    label: The estate
    requires: { family: { heir: true } }
  guardianship:
    label: Who took you in
    requires: { family: { heir: true } }
  legacy:
    label: Your family's name
    requires: { family: { heir: true } }
  # E3: requests and news from the people you know. Only the lives step
  # queues them (registries/people.yaml); they have no contract of their own,
  # each event requires what it is about. Care is about your home, so a
  # partner who lives with you comes first (the household rule).
  lives: { label: People's lives }
  care: { label: Care for a relative, household: true }
  # E4: what happens between the people around you, and what is said about you.
  # Only the web step queues them (registries/web.yaml); each event requires
  # the tie or the story it is about.
  web: { label: The people around you }
  # M1: depression, anxiety, PTSD, ADHD and neurodivergence: first signs, diagnosis, care, the people who notice, and crisis. A partner who lives with you is preferred for their roles (the household rule).
  mental: { label: Mental health, household: true }

  # E5: pets, vehicles and homes beyond the one you live in. Each event requires
  # what it is about (belongings: ...); the content build checks it.
  pets: { label: Pets, household: true }
  vehicles: { label: Cars and driving }
  property: { label: Property }

  # T1: the teen years. Crowds at school and the rules at home have their own contracts.
  crowds:
    label: Your crowd
    requires: { education: { program: [middle, high] } }
  houserules:
    label: Rules at home
    household: true
    requires: { teen: { rules: { gte: 1 } } }
  driving: { label: Driving }
  teenwork: { label: Teen jobs }
  teamsclubs: { label: Teams and clubs }
  future: { label: Thinking ahead }

  # E6a: crime careers. Offers are for adults who are not in a crew; the rest of a crew's life is for those in one,
  # the law's side of it (investigations, arrests, a flagged deposit) is for any adult, and the past catches up with
  # those who left. Crime at home accounts for a partner who lives with you (the household rule).
  crimeoffers:
    label: An offer
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: false } }
  crime:
    label: The crew
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
  crimeaway:
    label: Far from the crew
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
        - { crime: { away: true } }
  crimehome:
    label: Crime at home
    household: true
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
  crimelaw:
    label: The police
    requires: { age: { gte: 18 } }
  crimepast:
    label: The past catches up
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { former: true } }

  # E6b: fame in arts and media. A way in is for someone with no career (and none behind them); the rest are for
  # someone with one. Fame at home accounts for a partner who lives with you (the household rule).
  fameentry:
    label: A way in
    requires:
      all:
        - { fame: { active: false } }
        - { fame: { retired: false } }
  fame:
    label: The business
    requires: { fame: { active: true } }
  famebiz:
    label: Deals and awards
    requires: { fame: { active: true } }
  famefans:
    label: Fans and critics
    requires: { fame: { active: true } }
  famelife:
    label: The price
    household: true
    requires: { fame: { active: true } }
  famepast:
    label: Looking back
    requires: { fame: { retired: true } }

  # E6c: sports. A way in is for someone with no career and no seasons behind them; the rest are for someone who plays
  # (or, after the game, someone who did). Life in the game at home accounts for a partner who lives with you.
  sportsentry:
    label: A way in
    requires:
      all:
        - { fame: { active: false } }
        - { sports: { seasons: { lt: 1 } } }
  sports:
    label: The game
    requires: { sports: { active: true } }
  sportsdeal:
    label: Contracts and trades
    requires:
      all:
        - { age: { gte: 18 } }
        - { sports: { active: true } }
        - { sports: { level: [pro] } }
  sportsbody:
    label: The body
    household: true
    requires: { sports: { active: true } }
  sportslife:
    label: Life in the game
    household: true
    requires: { sports: { active: true } }
  sportsplayoffs:
    label: The playoffs
    requires:
      all:
        - { sports: { active: true } }
        - { sports: { run: true } }
  sportspast:
    label: After the game
    requires: { sports: { retired: true } }

  # L1: later life. Grandparenting needs a grandchild on your People list; the rest of later life is for people of an age
  # (and care and the end of life for people who need care or have been told what is coming). Raising a grandchild is
  # about a particular grandchild, so each event requires the person it is about.
  grandparenting:
    label: Grandchildren
    requires: { later: { grandchildren: { gte: 1 } } }
  grandraise: { label: Raising a grandchild }
  latelife:
    label: Later life
    requires: { age: { gte: 55 } }
  latecare:
    label: Care near the end
    household: true
    requires: { later: { care: true } }
  amends:
    label: Making amends
    requires: { age: { gte: 40 } }
  endoflife:
    label: The end of life
    household: true
    requires: { later: { terminal: true } }

  # W2: belonging. Events about the groups you belong to need a membership; an invitation is about a group you do not belong to
  # (and, bound to it, requires that you are not a member); faith is for anyone, and each event requires what it is about
  # (a faith, its strength, a pull toward another). Group events at home account for a partner who lives with you (the household rule).
  belonging:
    label: Your groups
    requires: { group: { member: true } }
  joining:
    label: An invitation
    requires: { group: { member: false } }
  faith: { label: Faith }
  faithhome:
    label: Faith at home
    household: true

  # W3: businesses. Events about a business you own need one; a chance to start one is for someone who owns none; what follows a
  # business that failed is about the one you lost. A business event bound to a business asks about that business.
  business:
    label: Your business
    cooldownYears: 1
    requires: { business: { owned: true } }
  bizstart:
    label: A chance
    requires: { business: { owned: false } }
  bizpast:
    label: After a business
    requires: { business: { failedWithin: 8 } }
