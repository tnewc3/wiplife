# Event categories. An optional cooldownYears keeps other events of the
# same category away for that many years after one fires. Categories marked
# romance are adults only: the engine blocks them for anyone under the adult
# age, and the content build requires every such event to say so.
#
# C1, category contracts: requires lists what every event of the category
# must require (the content build rejects one that doesn't, and one that
# fires without it is an invariant failure). household marks home, health
# and wellbeing: a partner who lives with you is preferred for their roles.
categories:
  family: { label: Family }
  play: { label: Play }
  school:
    label: School life
    requires: { education: { program: [elementary, middle, high, college, trade, grad] } }
  friends: { label: Friends }
  romance: { label: Love and dating, romance: true }
  people: { label: People }
  mischief: { label: Trouble }
  health: { label: Health, household: true }
  money: { label: Money }
  home: { label: Home, household: true }
  community: { label: Community }
  work:
    label: Work
    requires: { career: { employed: true, retired: false } }
  # C1: work events that aren't about a current job.
  career: { label: Finding work }
  jobless:
    label: Out of work
    requires: { career: { employed: false, retired: false } }
  retirement:
    label: Retirement
    requires: { career: { retired: true } }
  # C1: you and the partner you have now (dating, engaged or married).
  partner:
    label: You and your partner
    romance: true
    household: true
    requires: { romance: [dating, engaged, married] }
  wonder: { label: Strange and wonderful, cooldownYears: 10 }
  # Stage 9.
  justice: { label: The law }
  prison:
    label: Prison
    prison: true
    requires: { legal: { incarcerated: true } }
  identity: { label: Who you are }
  vice: { label: Vices }
  # E2a: children and parenting.
  pregnancy: { label: Expecting }
  building: { label: Building a family }
  parenting:
    label: Raising children
    requires: { family: { minors: { gte: 1 } } }
  grownkids:
    label: Grown children
    requires: { family: { children: { gte: 1 } } }
  stepfamily:
    label: Stepfamily
    requires: { family: { steps: { gte: 1 } } }
  grief: { label: Grief }
  custody: { label: Custody }
  # E2b: heirs. Every one of these needs you to be an heir (you carried on from a parent).
  estate:
    label: The estate
    requires: { family: { heir: true } }
  guardianship:
    label: Who took you in
    requires: { family: { heir: true } }
  legacy:
    label: Your family's name
    requires: { family: { heir: true } }
  # E3: requests and news from the people you know. Only the lives step
  # queues them (registries/people.yaml); they have no contract of their own,
  # each event requires what it is about. Care is about your home, so a
  # partner who lives with you comes first (the household rule).
  lives: { label: People's lives }
  care: { label: Care for a relative, household: true }
  # E4: what happens between the people around you, and what is said about you.
  # Only the web step queues them (registries/web.yaml); each event requires
  # the tie or the story it is about.
  web: { label: The people around you }
  # M1: depression, anxiety, PTSD, ADHD and neurodivergence: first signs, diagnosis, care, the people who notice, and crisis. A partner who lives with you is preferred for their roles (the household rule).
  mental: { label: Mental health, household: true }

  # E5: pets, vehicles and homes beyond the one you live in. Each event requires
  # what it is about (belongings: ...); the content build checks it.
  pets: { label: Pets, household: true }
  vehicles: { label: Cars and driving }
  property: { label: Property }

  # T1: the teen years. Crowds at school and the rules at home have their own contracts.
  crowds:
    label: Your crowd
    requires: { education: { program: [middle, high] } }
  houserules:
    label: Rules at home
    household: true
    requires: { teen: { rules: { gte: 1 } } }
  driving: { label: Driving }
  teenwork: { label: Teen jobs }
  teamsclubs: { label: Teams and clubs }
  future: { label: Thinking ahead }

  # E6a: crime careers. Offers are for adults who are not in a crew; the rest of a crew's life is for those in one,
  # the law's side of it (investigations, arrests, a flagged deposit) is for any adult, and the past catches up with
  # those who left. Crime at home accounts for a partner who lives with you (the household rule).
  crimeoffers:
    label: An offer
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: false } }
  crime:
    label: The crew
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
  crimeaway:
    label: Far from the crew
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
        - { crime: { away: true } }
  crimehome:
    label: Crime at home
    household: true
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { member: true } }
  crimelaw:
    label: The police
    requires: { age: { gte: 18 } }
  crimepast:
    label: The past catches up
    requires:
      all:
        - { age: { gte: 18 } }
        - { crime: { former: true } }

  # E6b: fame in arts and media. A way in is for someone with no career (and none behind them); the rest are for
  # someone with one. Fame at home accounts for a partner who lives with you (the household rule).
  fameentry:
    label: A way in
    requires:
      all:
        - { fame: { active: false } }
        - { fame: { retired: false } }
  fame:
    label: The business
    requires: { fame: { active: true } }
  famebiz:
    label: Deals and awards
    requires: { fame: { active: true } }
  famefans:
    label: Fans and critics
    requires: { fame: { active: true } }
  famelife:
    label: The price
    household: true
    requires: { fame: { active: true } }
  famepast:
    label: Looking back
    requires: { fame: { retired: true } }
