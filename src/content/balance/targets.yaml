# Target numbers the simulation is judged against (docs/technical.md,
# section Q). Stage acceptance criteria point here; Stage 12 (balancing)
# adds the rest of section Q's targets and tunes them.
#
# Shares are of simulated lives (npm run simulate), counting only lives
# that reach the age the target is about.

# Stage 8 (careers) acceptance.
money:
  # Bankruptcy in no more than about 15% of lives that reach adulthood.
  maxBankruptLives: 0.15
  # Roughly half or more of adults have owned a home by 50.
  minHomeOwners: 0.5
  homeOwnershipAge: 50
  # The median net worth at 65 (savings plus home value, minus debts) falls in
  # this range. Added with Stage 8, when salaries arrived; Stage 12 tunes the
  # economy toward it (until then it shows as not met).
  medianNetWorth: { min: 200000, max: 600000 }
  netWorthAge: 65

careers:
  # A bachelor's degree pays clearly more over a lifetime on average: at
  # least 1.3 times the average lifetime earnings of lives that stopped at
  # high school.
  minBachelorEarningsRatio: 1.3
  # ...but isn't a guarantee: at least 10% of bachelor's holders earn less
  # over their lifetime than the median high-school-only life.
  minBachelorBelowHighSchoolMedian: 0.1
  # Lifetime earnings are compared over lives that reach this age.
  earningsAge: 65
  # No dead-end careers: at least 30% of the lives that enter each job track
  # reach its second level.
  minReachLevel2: 0.3
  # Per year worked in a job (all tracks together).
  promotionRate: { min: 0.05, max: 0.25 }
  firingRate: { min: 0.005, max: 0.05 }
  layoffRate: { min: 0.01, max: 0.05 }

# Stage 3 and 9: the median age at death of all simulated lives.
lifespan:
  median: { min: 72, max: 82 }

# Stage 9. Shares of all simulated lives (judged on the careful player, who
# sees a doctor most years something is wrong; event choices are random, so
# crime and vice run higher than a real player's would). Ranges sit around
# the first 2,000-life run; Stage 12 (balancing) tightens them.
health:
  # Lives that ever have each condition (every active condition needs one).
  conditions:
    alcohol_addiction: { min: 0.07, max: 0.18 }
    anxiety_disorder: { min: 0.12, max: 0.3 }
    back_injury: { min: 0.4, max: 0.8 }
    broken_bone: { min: 0.3, max: 0.65 }
    cancer: { min: 0.2, max: 0.45 }
    chronic_infection: { min: 0, max: 0.1 }
    dementia: { min: 0.06, max: 0.2 }
    depression: { min: 0.08, max: 0.25 }
    drug_addiction: { min: 0.04, max: 0.14 }
    gambling_addiction: { min: 0.01, max: 0.07 }
    heart_disease: { min: 0.25, max: 0.55 }
    high_blood_pressure: { min: 0.3, max: 0.6 }
    pneumonia: { min: 0.12, max: 0.35 }
    treatable_infection: { min: 0, max: 0.25 }
    type_2_diabetes: { min: 0.1, max: 0.25 }

legal:
  # Lives with each offense on their record (every active offense needs one).
  offenses:
    assault: { min: 0, max: 0.2 }
    car_theft: { min: 0.02, max: 0.1 }
    disorderly_conduct: { min: 0.12, max: 0.35 }
    drug_dealing: { min: 0.03, max: 0.12 }
    drug_possession: { min: 0.06, max: 0.2 }
    dui: { min: 0.06, max: 0.18 }
    fraud: { min: 0.02, max: 0.12 }
    probation_violation: { min: 0.01, max: 0.06 }
    shoplifting: { min: 0.1, max: 0.3 }
    theft: { min: 0.08, max: 0.25 }
    vandalism: { min: 0.03, max: 0.12 }
  # Lives that ever go to prison.
  jailed: { min: 0.05, max: 0.15 }

discovery:
  # Lives in which each kind of discovery surfaced at least once (a latent
  # trait only some lives are born with, or a hidden talent most have).
  surfaced:
    attraction: { min: 0.04, max: 0.12 }
    gender: { min: 0.015, max: 0.06 }
    expression: { min: 0.025, max: 0.08 }
    personality: { min: 0.08, max: 0.2 }
    talent: { min: 0.5, max: 0.8 }

# Stage 10: the content coverage report (npm run coverage) and the 10,000-life
# simulation. docs/technical.md, Stage 10 acceptance criteria.
# C1 (consistency pass). Judged on the careful player (npm run simulate and
# npm run coverage).
consistency:
  # Average Happiness over a whole life, averaged across lives: well below
  # the maximum, so Happiness means something.
  lifetimeHappiness: { min: 45, max: 72 }
  # Per life, the share of the events fired that repeat an event the life
  # already had and that isn't marked recurring (averaged across lives).
  # Events that answer your own actions (asking someone out, asking for a
  # raise) or a system trigger (money trouble, the law, self-discovery, a
  # doctor visit) count as recurring.
  maxRepeatShare: 0.15

# E1: how interactions go for the careful player.
interactions:
  great: { min: 0.02, max: 0.35 }
  backfire: { min: 0.003, max: 0.15 }
  # Good and great together: well short of every time.
  maxGoodShare: 0.85

# E2a: children and parenting, judged on the careful player. Shares are of
# lives reaching 50 (parents, adoption, ivf, surrogacy), of pregnancies
# (miscarriage) and of children (childDeath).
family:
  parents: { min: 0.5, max: 0.9 }
  adoption: { min: 0.005, max: 0.1 }
  ivf: { min: 0.005, max: 0.12 }
  surrogacy: { min: 0, max: 0.04 }
  miscarriage: { min: 0.04, max: 0.16 }
  childDeath: { min: 0.01, max: 0.08 }
  # Raised warm vs cold (kindness at 18), strict vs relaxed (discipline at
  # 18), involved vs absent (grades at 16-17): the difference between the
  # means must be at least this, in points (grades: in GPA points).
  styleEffect: { grades: 0.2, personality: 4 }
  # The correlation of a child's starting smarts with their parents' mean.
  inheritance: 0.3
  # Children whose starting smarts fall outside their parents' range by more than the spread allows.
  maxOutsideParents: 0.3

coverage:
  minEvents: 300
  legendary: { min: 5, max: 10 }
  # "In most simulated years, at least 15 events are eligible": events whose
  # requirements, cooldowns and one-time rules let them happen that year
  # (prison years, with their own small set of events, aren't counted).
  minEligible: 15
  minCoveredYears: 0.5
  maxEventShare: 0.03
  # Section Q: legendary events are rare but reachable.
  legendaryLives: { min: 0.001, max: 0.02 }
  # Design section G: about 300 events at launch.
  launch: { childhood: 50, teen: 70, youngAdult: 70, adult: 70, senior: 40 }
