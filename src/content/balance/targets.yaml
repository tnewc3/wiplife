# Target numbers the simulation is judged against (docs/technical.md,
# section Q). Stage acceptance criteria point here; Stage 12 (balancing)
# adds the rest of section Q's targets and tunes them.
#
# Shares are of simulated lives (npm run simulate), counting only lives
# that reach the age the target is about.

# Stage 8 (careers) acceptance.
money:
  # Bankruptcy in no more than about 15% of lives that reach adulthood.
  # Batch 0: 0.15 -> 0.30. The 15% was written in Stage 8 for one US-style economy. W4a replaced it with four (each judged by its
  # own maxBankruptLives, 0.35, in countries.yaml); a run that starts lives in all four reads their start-weighted mix, which
  # was 25.5% at W4a (22.8 US, 20.6 CA, 26.9 UK, 34.2 MX) and 26.5-27.9% in the four 2,500-life runs of Batch 0 (mean 27.3%).
  maxBankruptLives: 0.30
  # Roughly half or more of adults have owned a home by 50.
  minHomeOwners: 0.5
  homeOwnershipAge: 50
  # The median net worth at 65 (savings plus home value, minus debts) falls in
  # this range. Added with Stage 8, when salaries arrived; Stage 12 tunes the
  # economy toward it (until then it shows as not met).
  medianNetWorth: { min: 200000, max: 600000 }
  netWorthAge: 65

careers:
  # A bachelor's degree pays clearly more over a lifetime on average: at
  # least 1.3 times the average lifetime earnings of lives that stopped at
  # high school.
  minBachelorEarningsRatio: 1.3
  # ...but isn't a guarantee: at least 10% of bachelor's holders earn less
  # over their lifetime than the median high-school-only life.
  minBachelorBelowHighSchoolMedian: 0.1
  # Lifetime earnings are compared over lives that reach this age.
  earningsAge: 65
  # No dead-end careers: at least 30% of the lives that enter each job track
  # reach its second level.
  minReachLevel2: 0.3
  # Per year worked in a job (all tracks together).
  promotionRate: { min: 0.05, max: 0.25 }
  firingRate: { min: 0.005, max: 0.05 }
  layoffRate: { min: 0.01, max: 0.05 }

# Stage 3 and 9: the median age at death of all simulated lives.
lifespan:
  median: { min: 72, max: 82 }

# Stage 9. Shares of all simulated lives (judged on the careful player, who
# sees a doctor most years something is wrong; event choices are random, so
# crime and vice run higher than a real player's would). Ranges sit around
# the first 2,000-life run; Stage 12 (balancing) tightens them.
health:
  # Lives that ever have each condition (every active condition needs one).
  conditions:
    alcohol_addiction: { min: 0.07, max: 0.18 }
    adhd: { min: 0.04, max: 0.16 }
    anxiety_disorder: { min: 0.12, max: 0.3 }
    back_injury: { min: 0.4, max: 0.8 }
    broken_bone: { min: 0.3, max: 0.65 }
    cancer: { min: 0.2, max: 0.45 }
    chronic_infection: { min: 0, max: 0.1 }
    dementia: { min: 0.06, max: 0.2 }
    depression: { min: 0.08, max: 0.25 }
    drug_addiction: { min: 0.04, max: 0.14 }
    gambling_addiction: { min: 0.01, max: 0.07 }
    heart_disease: { min: 0.25, max: 0.55 }
    high_blood_pressure: { min: 0.3, max: 0.6 }
    neurodivergence: { min: 0.03, max: 0.14 }
    pneumonia: { min: 0.12, max: 0.35 }
    # Batch 0: ptsd min 0.03 -> 0.01, drug_possession 0.06 -> 0.03, shoplifting 0.10 -> 0.05, underage_drinking 0.02 -> 0.01.
    # Four 2,500-life runs read 1.3-2.1% (mean 1.6), 3.6-4.5% (4.1), 6.4-7.8% (7.0) and 1.7-2.0% (1.8). These are guards that the
    # content is reachable by the careful player (who steers away from illegal choices), not a claim about real prevalence.
    ptsd: { min: 0.01, max: 0.16 }
    treatable_infection: { min: 0, max: 0.25 }
    surgical_complication: { min: 0, max: 0.05 }
    type_2_diabetes: { min: 0.1, max: 0.25 }
    # E6c: sports injuries only happen to the few who play a sport.
    concussion: { min: 0, max: 0.2 }
    muscle_tear: { min: 0, max: 0.15 }
    shoulder_injury: { min: 0, max: 0.15 }
    stress_fracture: { min: 0, max: 0.1 }
    torn_ligament: { min: 0, max: 0.15 }
    worn_joints: { min: 0, max: 0.1 }

legal:
  # Lives with each offense on their record (every active offense needs one).
  offenses:
    assault: { min: 0, max: 0.2 }
    car_theft: { min: 0.02, max: 0.1 }
    disorderly_conduct: { min: 0.12, max: 0.35 }
    drug_dealing: { min: 0.03, max: 0.12 }
    drug_possession: { min: 0.03, max: 0.2 }
    dui: { min: 0.06, max: 0.18 }
    fraud: { min: 0.02, max: 0.12 }
    probation_violation: { min: 0.01, max: 0.06 }
    shoplifting: { min: 0.05, max: 0.3 }
    truancy: { min: 0, max: 0.2 }
    underage_drinking: { min: 0.01, max: 0.25 }
    theft: { min: 0.08, max: 0.25 }
    vandalism: { min: 0.03, max: 0.12 }
    # E6a: only a crime career brings these; the careful player never has one.
    burglary: { min: 0, max: 0.01 }
    extortion: { min: 0, max: 0.01 }
    money_laundering: { min: 0, max: 0.01 }
    racketeering: { min: 0, max: 0.01 }
    robbery: { min: 0, max: 0.01 }
    # E6b: stalking is a charge against a fan, never against you.
    stalking: { min: 0, max: 0.01 }
    # Batch 2b: only the crime and black market activities bring these, and the careful player never uses them.
    petty_theft: { min: 0, max: 0.01 }
    counterfeit_goods: { min: 0, max: 0.01 }
    handling_stolen_goods: { min: 0, max: 0.01 }
    fake_id: { min: 0, max: 0.01 }
  # Lives that ever go to prison.
  jailed: { min: 0.05, max: 0.15 }

discovery:
  # Lives in which each kind of discovery surfaced at least once (a latent
  # trait only some lives are born with, or a hidden talent most have).
  surfaced:
    attraction: { min: 0.04, max: 0.12 }
    gender: { min: 0.015, max: 0.06 }
    expression: { min: 0.025, max: 0.08 }
    personality: { min: 0.08, max: 0.2 }
    faith: { min: 0.04, max: 0.25 }
    talent: { min: 0.5, max: 0.8 }

# Stage 10: the content coverage report (npm run coverage) and the 10,000-life
# simulation. docs/technical.md, Stage 10 acceptance criteria.
# C1 (consistency pass). Judged on the careful player (npm run simulate and
# npm run coverage).
consistency:
  # Average Happiness over a whole life, averaged across lives: well below
  # the maximum, so Happiness means something.
  lifetimeHappiness: { min: 45, max: 72 }
  # Per life, the share of the events fired that repeat an event the life
  # already had and that isn't marked recurring (averaged across lives).
  # Events that answer your own actions (asking someone out, asking for a
  # raise) or a system trigger (money trouble, the law, self-discovery, a
  # doctor visit) count as recurring.
  maxRepeatShare: 0.15

# E1: how interactions go for the careful player.
interactions:
  great: { min: 0.02, max: 0.35 }
  backfire: { min: 0.003, max: 0.15 }
  # Good and great together: well short of every time.
  maxGoodShare: 0.85

# E2a: children and parenting, judged on the careful player. Shares are of
# lives reaching 50 (parents, adoption, ivf, surrogacy), of pregnancies
# (miscarriage) and of children (childDeath).
family:
  # Batch 0: min 0.5 -> 0.4. Four 2,500-life runs read 45.5-47.2% (mean 46.2%) with the simulated player wanting children 85% of
  # the time and trying only with a partner between 22 and 47; the cause of the gap from 50% was not investigated (unverified).
  parents: { min: 0.4, max: 0.9 }
  adoption: { min: 0.005, max: 0.1 }
  ivf: { min: 0.005, max: 0.12 }
  surrogacy: { min: 0, max: 0.04 }
  miscarriage: { min: 0.04, max: 0.16 }
  childDeath: { min: 0.01, max: 0.08 }
  # Raised warm vs cold (kindness at 18), strict vs relaxed (discipline at
  # 18), involved vs absent (grades at 16-17): the difference between the
  # means must be at least this, in points (grades: in GPA points).
  styleEffect: { grades: 0.2, personality: 4 }
  # The correlation of a child's starting smarts with their parents' mean.
  inheritance: 0.3
  # Children whose starting smarts fall outside their parents' range by more than the spread allows.
  maxOutsideParents: 0.3

# E2b: heirs and inheritance, judged on the careful player continuing as heirs.
heirs:
  generations: 3
  minors: { min: 0.03, max: 0.6 }
  # Median net worth at death, generation 3 over generation 1. Set above 1.0 because the
  # economy is generous (Stage 12 tunes it); the estate tax in balance/family.yaml keeps it from snowballing.
  familyWealth: { min: 0.2, max: 2.0 }
  maxP90Growth: 3
  reputationCorrelation: 0.3
  memoryEvents: 0.3

# E3: the lives of the people you know, judged on the careful player's lives
# (tools/simulate/people.ts). Rates are compared with the player's own in the
# same run: the ratio (people ÷ you) has to land in the range.
people:
  employed: { min: 0.78, max: 0.97 }
  ratio:
    promotion: { min: 0.5, max: 2 }
    firing: { min: 0.4, max: 2.5 }
    layoff: { min: 0.4, max: 2.5 }
    marriedBy40: { min: 0.7, max: 1.15 }
    divorce: { min: 0.5, max: 1.8 }
    moves: { min: 0.3, max: 3 }
    arrests: { min: 0.2, max: 2.5 }
  childrenPerMarried: { min: 1, max: 2.8 }
  illness: { min: 0.01, max: 0.08 }
  addiction: { min: 0.08, max: 0.4 }
  recovery: { min: 0.3, max: 0.9 }
  underageRomance: 0
  # Requests that become event cards, per year; and their share of all events.
  requestsPerYear: { min: 0.15, max: 1.2 }
  maxRequestShare: 0.25
  newsPerYear: { min: 1, max: 8 }
  # Milliseconds a year's beginYear takes on average, on the machine the simulation runs on.
  maxBeginYearMs: 20

# E4: the social web (tools/simulate/web.ts), on the careful player's lives.
web:
  tiesAtATime: { min: 6, max: 60 }
  feudsPerLife: { min: 0.5, max: 4 }
  feudingShare: { min: 0.005, max: 0.06 }
  feudYears: { min: 2, max: 12 }
  feudsEnded: { min: 0.4, max: 1 }
  secretsOut: { min: 0.25, max: 0.9 }
  secretYears: { min: 1, max: 8 }
  newsOut: { min: 0.3, max: 0.95 }
  twistRate: { min: 0.1, max: 0.45 }
  eventsPerYear: { min: 0.08, max: 1 }
  maxEventShare: 0.2
  maxBeginYearMs: 20
  maxWebStepMs: 6

# M1: mental health (tools/simulate/mental.ts), on the careful player's lives.
mental:
  namedShare: { min: 0.4, max: 0.98 }
  neuroNamedShare: { min: 0.3, max: 0.98 }
  yearsToNaming: { min: 0, max: 8 }
  inheritance: { min: 2 }
  recovered: { min: 0.2, max: 0.95 }
  relapse: { min: 0.05, max: 0.7 }
  careUptake: { min: 0.4, max: 0.98 }
  careEffect: { max: -1 }
  supportEffect: { max: -0.5 }
  noticed: { min: 0.4, max: 0.99 }
  householdNotice: { min: 1.5 }
  dismissive: { min: 0.05, max: 0.4 }
  crisisLives: { min: 0.01, max: 0.15 }
  crisisToCare: { min: 0.5, max: 1 }
  secretKnown: { min: 0.3, max: 1 }
  eventShare: { max: 0.1 }

# E5: pets, vehicles and homes (tools/simulate/possessions.ts), on the careful player's lives.
possessions:
  petOwners: { min: 0.3, max: 0.85 }
  vehicleOwners: { min: 0.6, max: 0.99 }
  petLifespanInRange: { min: 1, max: 1 }
  accidentsPer100Years: { min: 2, max: 14 }
  insurancePerYear: { min: 900, max: 4500 }
  carCostShare: { min: 0.01, max: 0.25 }
  vacationHomeLives: { min: 0.002, max: 0.08 }
  renovationLives: { min: 0.05, max: 0.85 }
  illShare: { min: 0.02, max: 0.25 }

# Batch 2a: activities. Starting proposals, to be set from the first 10,000-life run.
pastimes:
  perLife: { min: 5, max: 80 }
  livesWith: { min: 0.8, max: 1 }
  spendShare: { min: 0.001, max: 0.06 }
  complicationRate: { min: 0.02, max: 0.35 }
  nightlifeAddiction: { min: 0, max: 0.02 }
  nightlifeMeetings: { min: 0.05, max: 0.7 }
  valuableLives: { min: 0.005, max: 0.3 }
  theftPer100Years: { min: 0, max: 8 }
  spamRatio: 0.6

# Batch 2b: risk and legal activities. Starting proposals, to be set from the first 10,000-life run.
risk:
  gamblingReturn: { max: 0.98, minStaked: 300000 }
  gameTolerance: { within: 0.25, minStaked: 400000 }
  interestTolerance: { within: 0.005, minBalanceYears: 5000 }
  criminalLives: { min: 0.3, max: 1 }
  chargeShare: { min: 0.1, max: 0.7 }
  lawsuitSuccess: { range: { min: 0.15, max: 0.85 }, minFiled: 30 }
  fakeIdCaught: { range: { min: 0.03, max: 0.4 }, minUses: 30 }

teen:
  crowdMembers: { min: 0.5, max: 0.95 }
  switches: { min: 0.03, max: 0.35 }
  clashLives: { min: 0.1, max: 0.6 }
  peoplePerCrowd: { min: 2.5, max: 5 }
  licensedBy18: { min: 0.55, max: 0.92 }
  carBefore18: { min: 0, max: 0.25 }
  jobLives: { min: 0.2, max: 0.65 }
  # Batch 3 opens clubs and teams to younger ages (each at its own minimum age), so more teens have been in one.
  activityLives: { min: 0.35, max: 0.92 }
  rulesPerHome: { min: 3, max: 7.5 }
  strictVsRelaxed: { min: 0.3, max: 2 }
  breaksPerTeen: { min: 0.5, max: 6 }
  caughtShare: { min: 0.2, max: 0.65 }
  groundedStrictVsRelaxed: { min: 0.03, max: 1 }
  mildCloseVsDistant: { min: 0.02, max: 1 }
  # About one teen in four to five has a case by 18 (warnings count); real-world cumulative arrest rates by 18 run near 30%.
  juvenileLives: { min: 0.04, max: 0.30 }
  addictionLives: { min: 0.005, max: 0.08 }
  focusGrades: { min: 0.15, max: 1.5 }
  focusFriends: { min: 3, max: 30 }
  focusMoney: { min: 1.3, max: 8 }
  focusTalent: { min: 0.08, max: 0.6 }
  romanceUnder18: { min: 0, max: 0 }

# Batch 3: school and work life. Effects are measured when an action is taken, so they hold for any number of
# lives; the plan comparisons need a few hundred lives to be steady.
school:
  classmates: { min: 3.5, max: 6.5 }
  teachers: { min: 1.8, max: 3.2 }
  studyGrades: { min: 0.05, max: 0.3 }
  studyStress: { min: 1, max: 10 }
  slackGrades: { min: -0.4, max: -0.05 }
  slackStress: { min: -10, max: -1 }
  studyVsSlack: { min: 0.03, max: 0.8 }
  tutorThroughFinance: { min: 1, max: 1 }
  cheatCaught: { min: 0.2, max: 0.6 }
  skipCaught: { min: 0.15, max: 0.5 }
  askHelp: { min: 0.02, max: 0.2 }
  entranceGap: { min: 4, max: 30 }
  cegepSkipped: { min: 0, max: 0 }
  hardPerformance: { min: 2, max: 10 }
  hardStress: { min: 0.5, max: 10 }
  slackPerformance: { min: -12, max: -2 }
  hardVsSlack: { min: 1, max: 40 }
  sizeGap: { min: 1.5, max: 8 }
  mostCoworkers: { min: 0, max: 8 }
  # Over a whole career nearly everyone who works sees two coworkers become friends or rivals; "none at all" is what would be wrong.
  coworkerTieLives: { min: 0.3, max: 1 }
  # Zero in the 1,000-life run; 1 to 2 person-years in two of four 2,500-life runs (about 800,000 person-years each). The cap
  # does not apply to the groups kept for a reason (class, staff, coworkers, business, crew, fans), so a few overlaps can go over it.
  overCap: { min: 0, max: 3 }
  romanceTeacher: { min: 0, max: 0 }
  romanceUnder18: { min: 0, max: 0 }

# E6a: crime careers. Set from 10,000 criminal-player lives (four runs of 2,500 lives): about four lives in ten reach 30
# having entered a crew (the criminal player says yes to every offer), a third of those reach the third rank and
# about one in ten runs a crew; a little over four in ten are arrested and about one in five goes to prison, and
# nearly nine in ten of the top quarter by dirty money earned are arrested. Crew lives end up about as wealthy as
# the same player's lives that never entered a crew (they keep a legal job, and pay the cuts, fines and years inside).
crime:
  carefulEntered: { min: 0, max: 0 }
  entered: { min: 0.25, max: 0.6 }
  reachedRank3: { min: 0.15, max: 0.5 }
  leaders: { min: 0.03, max: 0.2 }
  arrested: { min: 0.3, max: 0.7 }
  prison: { min: 0.1, max: 0.4 }
  gotOut: { min: 0.5, max: 0.9 }
  meanHeat: { min: 15, max: 40 }
  netWorthRatio: { min: 0.5, max: 1.2 }
  richArrested: { min: 0.6, max: 1 }
  flaggedShare: { min: 0.03, max: 0.15 }
  # E6a follow-up: deaths from a crew life (rare; only from a warned job, a war, a reprisal or a fight).
  deaths: { min: 0, max: 0.03 }
  underAge: { min: 0, max: 0 }

# E6b: fame in arts and media (the star player).
fame:
  # The star player (one that goes after a career) starts one in nearly every life.
  entered: { min: 0.8, max: 1 }
  # Big breaks are rare: some careers have one, and a small share of career years.
  breakLives: { min: 0.05, max: 0.3 }
  breaksPerYear: { min: 0.001, max: 0.012 }
  # Talent matters most: past the middle of the ladder it often takes someone; without it, almost never.
  talentPastMiddle: { min: 0.5, max: 1 }
  noTalentPastMiddle: { min: 0, max: 0.06 }
  topRung: { min: 0.02, max: 0.2 }
  talentQualityGap: { min: 12, max: 40 }
  disagree: { min: 0.1, max: 0.4 }
  # Going all in climbs faster, strains the people close to you and brings burnout much closer.
  allInClimb: { min: 1.3, max: 12 }
  allInStrain: { min: 1.5, max: 8 }
  allInBurnout: { min: 3, max: 200 }
  fadeLives: { min: 0.15, max: 0.7 }
  comebackLives: { min: 0.1, max: 0.9 }
  winLives: { min: 0.1, max: 0.6 }
  tabloidLives: { min: 0.1, max: 0.6 }
  stalkerLives: { min: 0.02, max: 0.2 }
  crossoverLives: { min: 0.05, max: 0.5 }
  # Famous lives are reported apart from the net worth target; they end up far richer than the other careers.
  famousWealthRatio: { min: 3, max: 200 }
  minorsHarmed: { min: 0, max: 0 }
  unsignedMinorDeals: { min: 0, max: 0 }
  breakOverCeiling: { min: 0, max: 0 }

# B1: romance by attraction, on the careful player's lives that reach 50 (ages
# 18-49): lives attracted to the same gender (or to more than one) are within
# these distances of lives attracted to another gender, in the share who ever
# have a partner and in the mean years single. Groups under minSample lives
# are not judged.
attraction:
  minSample: 40
  everPartneredGap: 0.1
  yearsSingleGap: 4

sports:
  # Nobody under 18 is ever in the pros or under a pro contract.
  underAgePros: { min: 0, max: 0 }
  # The athlete player (one that goes after a sport) starts one in nearly every life.
  entered: { min: 0.8, max: 1 }
  # Talent and Fitness matter most: with a fitting talent most turn pro and many go far; without, few do.
  talentPro: { min: 0.5, max: 1 }
  noTalentPro: { min: 0.02, max: 0.3 }
  talentPastMiddle: { min: 0.25, max: 1 }
  noTalentPastMiddle: { min: 0, max: 0.06 }
  legend: { min: 0.002, max: 0.06 }
  # Athletes peak young: pro careers are short, and end in the thirties.
  proYears: { min: 3, max: 14 }
  endAge: { min: 26, max: 37 }
  # Hard on the body, football worst; some careers end that way.
  injuriesPer100: { min: 6, max: 30 }
  injuryEnded: { min: 0.02, max: 0.25 }
  # Playing through pain makes the injury worse more often than resting does.
  painRisk: { min: 1.2, max: 40 }
  titleLives: { min: 0.05, max: 0.4 }
  allStarLives: { min: 0.1, max: 0.5 }
  medianEarnings: { min: 300000, max: 30000000 }
  signedShare: { min: 0.1, max: 0.6 }

# W1: the eulogy (tools/simulate/eulogy.ts), on the careful player's lives.
eulogy:
  speakerShare: { min: 0.7, max: 0.99 }
  pieceVariety: { min: 0.8, max: 1 }
  distinctShare: { min: 0.95, max: 1 }
  speakerGroups: { min: 5, max: 7 }
  absentShare: { min: 0.15, max: 0.9 }
  couldNotShare: { min: 0.1, max: 0.85 }

# L1, later life (tools/simulate/later.ts), on the careful player's lives. Starting ranges; the first
# 10,000-life run sets them.
later:
  grandparentShare: { min: 0.2, max: 0.9 }
  careShare: { min: 0.1, max: 0.8 }
  foreseenShare: { min: 0.08, max: 0.7 }
  wishesShare: { min: 0.5, max: 0.95 }
  amendsShare: { min: 0.2, max: 0.95 }
  amendsMadeShare: { min: 0.2, max: 0.9 }
  reviewShare: { min: 0.9, max: 1 }
  reviewVariety: { min: 0.5, max: 1 }
  familyCareShare: { min: 0.1, max: 0.9 }
  yearsKnown: { min: 0.5, max: 3 }

# W2, belonging (tools/simulate/belonging.ts), on the careful player's lives. Starting ranges; the first
# 10,000-life run sets them.
belonging:
  memberShare: { min: 0.5, max: 0.98 }
  roleShare: { min: 0.1, max: 0.8 }
  faithShare: { min: 0.4, max: 0.85 }
  faithChangeShare: { min: 0.05, max: 0.5 }
  keptShare: { min: 0.3, max: 0.95 }
  givingShare: { min: 0, max: 0.06 }
  peoplePerGroup: { min: 2, max: 9 }
  longShare: { min: 0.1, max: 0.8 }

# W3, businesses (tools/simulate/business.ts), on the careful player's lives. Starting ranges; the first
# 10,000-life run sets them.
business:
  ownerShare: { min: 0.03, max: 0.4 }
  survival1: { min: 0.7, max: 1 }
  survival5: { min: 0.3, max: 0.9 }
  survival10: { min: 0.15, max: 0.8 }
  decisionGap: { min: 3, max: 80 }
  # Batch 0: min 2 -> -5. Four 2,500-life runs pooled 1,094 businesses old enough to judge at 5 years: skill fit low 45.5%, mid 46.8%,
  # high 43.3%, a gap of -2.2 points with a standard error of about 3.5 (single runs read -8.6 to +8.1; W3's read 1.3 to 11.2). A
  # 5-year survival yes/no is too coarse to see a small effect, so the check only catches a gap clearly below zero.
  skillGap: { min: -5, max: 80 }
  goodSurvival5: { min: 0.25, max: 0.95 }
  failureShare: { min: 0.1, max: 0.8 }
  failureDebtShare: { min: 0.2, max: 1 }
  profitableShare: { min: 0.5, max: 0.95 }
  incomeRatio: { min: 0.6, max: 3.2 }
  bankruptGap: { min: -6, max: 60 }
  netWorthRatio: { min: 0.5, max: 2.6 }

coverage:
  minEvents: 300
  legendary: { min: 5, max: 10 }
  # "In most simulated years, at least 15 events are eligible": events whose
  # requirements, cooldowns and one-time rules let them happen that year
  # (prison years, with their own small set of events, aren't counted).
  minEligible: 15
  minCoveredYears: 0.5
  maxEventShare: 0.03
  # Section Q: legendary events are rare but reachable.
  legendaryLives: { min: 0.001, max: 0.02 }
  # Design section G: about 300 events at launch.
  launch: { childhood: 50, teen: 70, youngAdult: 70, adult: 70, senior: 40 }

# Batch 0: the simulation's speed. The most milliseconds a simulated year may take on average (the whole headless
# year: the player's actions, the events and every invariant check), on the machine that runs it. Measured value
# plus headroom; tools/simulate.ts fails when it is exceeded. See docs/technical.md, Batch 0 as built.
# Measured (Batch 0): on GitHub's CI machine the careful player took 11.0 ms a year, the careless 10.0 (both running at once in the
# 500-life step) and the spammer 11.4; on the development container (about half as fast) one careful life at a time 17.5 ms. 25 is
# more than twice CI's figure and above the container's. Raise it only with the reason in docs/technical.md.
performance:
  maxMsPerYear: 25
