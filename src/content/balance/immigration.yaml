      longResidence: { available: true, fee: 1500, wait: 2, odds: 0.3, years: 10 }
  uk:
    birthright: parent_status
    descent: true
    dual: true
    work_sponsor: { available: true, fee: 3600, wait: 1, odds: 0.4, stayYears: 5 }
    study_work: { available: true, fee: 1700, wait: 1, odds: 0.58, tuitionFactor: 1.7, graduateYears: 2 }
    family: { available: true, fee: 3000, wait: 1, odds: 0.7 }
    investment: { available: true, fee: 11000, wait: 1, odds: 0.82, amount: 600000 }
    permanent: { available: true, fee: 2400, wait: 1, odds: 0.7, afterYears: 4 }
    naturalization: { available: true, fee: 1500, wait: 1, odds: 0.78, years: 5, marriedYears: 3, language: 40, cleanYears: 5 }
    undocumented:
