    permanent: { available: true, fee: 1300, wait: 1, odds: 0.78, afterYears: 2 }
    naturalization: { available: true, fee: 600, wait: 1, odds: 0.84, years: 3, marriedYears: 2, language: 40, cleanYears: 4 }
    undocumented:
