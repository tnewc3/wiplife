# Sports (E6c): the numbers shared by all five sports. Starting proposals;
# Stage 12 (balancing) tunes them. Sports are fame paths (src/content/fame),
# so rungs, the pace of the climb, fame, fans, agents, awards and commitment
# are E6b's numbers (balance/fame.yaml); this file is what is particular to a
# season, a team, a contract and an injury.

performance:
  # Rating points per point of Fitness above 50, and for a perfect fit with your position (and the same lost for the worst fit).
  fitness: 0.14
  fit: 12
  # Per point your team's quality stands above 50.
  team: 0.07
  # Rating lost per point of severity of an injury you play with.
  injury: 0.28
  # Per point of form events gave you.
  form: 1.2
  focus:
    skills: { craft: 1.6, fitness: 0, rating: 0 }
    conditioning: { craft: 1, fitness: 0.8, rating: 1.5 }
    film: { craft: 1.3, fitness: 0, rating: 1 }
  film: 0.08
  switchCraft: 4

league:
  strengthSd: 6
  playerShare: 0.35
  winScale: 14
  rivals: 9
  amateurPlayoffs: 0.45
  games: { youth: 14, school: 18, college: 28 }
  reception: { critics: 0.25, fans: 0.5 }
  quality: { youth: 45, high: 50, community: 44, state: 58, elite: 70 }
  draws: 0.22
  allStar: 78

playoffs:
  # The chance a series left to the engine is won, by your strength less theirs.
  settle:
    - { at: -30, x: 0.08 }
    - { at: 0, x: 0.5 }
    - { at: 30, x: 0.88 }
  fame: { series: 1.5, title: 8 }
  mood: 15

# B1: injuries come only from games played (the chance below is for a whole season
# and scales with the share of it you play), from playoff and big-moment events,
# and from playing through pain. Training and practice never change the risk.
injury:
  base: 0.16
  level: { youth: 0.3, school: 0.5, college: 0.8, pro: 1 }
  age:
    - { at: 8, x: 0.6 }
    - { at: 18, x: 0.9 }
    - { at: 25, x: 1 }
    - { at: 30, x: 1.3 }
    - { at: 35, x: 1.8 }
    - { at: 40, x: 2.4 }
  fitness:
    - { at: 0, x: 1.7 }
    - { at: 50, x: 1 }
    - { at: 100, x: 0.6 }
  commitment: { back: 0.8, steady: 1, all: 1.3 }
  pain: 1.8
  aggravate: { chance: 0.4, min: 15, max: 35, endsAt: 95 }
  catastrophic: { from: 60, chance: 0.25 }
  missed: 0.011
  treatment: small
  worn: { perSeason: 0.03, max: 0.6 }
  wornSeverity: 40

draft:
  score: { quality: 1, fame: 0.35, noise: 5 }
  declare: 50
  top: 78
  perPick: 1.2
  undrafted:
    - { at: 30, x: 0 }
    - { at: 40, x: 0.1 }
    - { at: 50, x: 0.4 }
    - { at: 60, x: 0.8 }
  # Batch 5: the league's need for your position that year moves your score by up to this much either way, and combine events
  # by up to this much either way.
  need: 4
  combine: 8
  # Where a prospect is projected to go, by the share of the draft's picks gone before them (the words are in text/sports.yaml).
  projection:
    - { upTo: 0.1, id: lottery }
    - { upTo: 0.3, id: early }
    - { upTo: 0.6, id: middle }
    - { upTo: 1, id: late }
    - { upTo: 1.5, id: unlikely }

contract:
  kind: { minimum: 0.35, rookie: 1, standard: 1, star: 1.15 }
  years:
    minimum: { min: 1, max: 2 }
    rookie: { min: 3, max: 4 }
    standard: { min: 2, max: 4 }
    star: { min: 3, max: 5 }
  market:
    - { at: 30, x: 0.5 }
    - { at: 50, x: 0.8 }
    - { at: 65, x: 1.1 }
    - { at: 80, x: 1.5 }
    - { at: 95, x: 1.8 }
  bonus: 0.12
  option: { chance: 0.3, team: 0.6 }
  push:
    win: 1.2
    lose: 0.85
    cheap: 0.85
    chance:
      - { at: 30, x: 0.15 }
      - { at: 60, x: 0.4 }
      - { at: 90, x: 0.7 }
  buyout: 0.5
  keep: { rating: 50, chance: 0.4 }
  # Batch 5: no automatic stall. An unsigned player keeps going to camps and open tryouts until this age.
  chaseAge: 33
  # A rookie deal's pay as a multiple of the rung's usual year, and the signing bonus as a share of a year's pay, by the share
  # of the draft's picks gone before you (percent): the first pick is paid most, and the curve eases down to the last.
  rookiePick:
    - { at: 0, x: 2.4 }
    - { at: 5, x: 2 }
    - { at: 15, x: 1.5 }
    - { at: 30, x: 1.15 }
    - { at: 50, x: 0.85 }
    - { at: 75, x: 0.65 }
    - { at: 100, x: 0.5 }
  signing:
    - { at: 0, x: 1 }
    - { at: 10, x: 0.6 }
    - { at: 30, x: 0.3 }
    - { at: 60, x: 0.15 }
    - { at: 100, x: 0.08 }
  # Skill incentives: up to this share of the salary a year, paid by how well you play: nothing at the rating `from`, all of it at `full`.
  incentive: { share: 0.25, from: 45, full: 85 }
  freeAgent:
    - { at: 30, x: 0.1 }
    - { at: 45, x: 0.5 }
    - { at: 60, x: 0.85 }
    - { at: 75, x: 0.95 }

trade:
  chance: 0.06
  asked: 5
  grant: 0.55
  refusedMood: 5

release:
  perPoint: 0.05
  max: 0.5
  slack: 4

retire:
  broadcastPath: social
  hallYears: 5
  hallRung: 7
  # The yearly chance, by age, that the thought of stopping comes up (doubled when your rating is under the rung's).
  quit:
    - { at: 30, x: 0.02 }
    - { at: 32, x: 0.06 }
    - { at: 34, x: 0.15 }
    - { at: 36, x: 0.3 }
    - { at: 38, x: 0.5 }
    - { at: 40, x: 0.75 }

events:
  maxQueued: 3
  # Batch 5: the yearly chance of each season choice.
  combine: 0.7
  captain: 0.18
  role: { starter: 0.12, other: 0.5 }
  offseason: 0.2
  # Batch 6: the trip to a team far from home, and a derby.
  commute: 0.35
  derby: 0.4

# Batch 5: tryouts for specific teams. A team's bar is compared with your rating going in (what scouts would say of you today),
# your way of playing the scrimmage and the luck of the day. Cut from a team, the next tier down at the same level looks at
# you, a little more kindly. Youth teams are for children (the youth level ends at 14); club and travel teams also run
# alongside a school team for teenagers.
tryout:
  tiers:
    rec: { level: youth, base: youth, shift: -6, bar: 0, fee: 90, minAge: 8, maxAge: 17, fallback: null }
    club: { level: youth, base: youth, shift: 0, bar: 20, fee: 280, minAge: 8, maxAge: 17, fallback: rec }
    travel: { level: youth, base: youth, shift: 9, bar: 32, fee: 900, minAge: 9, maxAge: 17, fallback: club }
    academy: { level: youth, base: youth, shift: 14, bar: 38, fee: 0, minAge: 9, maxAge: 17, fallback: club }
    jv: { level: school, base: high, shift: -4, bar: 26, fee: 0, minAge: 13, maxAge: 17, fallback: null }
    varsity: { level: school, base: high, shift: 2, bar: 38, fee: 0, minAge: 13, maxAge: 17, fallback: jv }
    community: { level: college, base: community, shift: 0, bar: 38, fee: 0, minAge: 17, maxAge: 26, fallback: null }
    state: { level: college, base: state, shift: 0, bar: 48, fee: 0, minAge: 17, maxAge: 26, fallback: community }
    elite: { level: college, base: elite, shift: 0, bar: 60, fee: 0, minAge: 17, maxAge: 26, fallback: state }
  luck: 7
  approach:
    steady: { bonus: 0, spread: 1 }
    hustle: { bonus: 2, spread: 1 }
    showoff: { bonus: 0, spread: 2.2 }
    listen: { bonus: 1, spread: 0.6 }
  hustleDiscipline: 0.06
  listenSmarts: 0.06
  cutWait: 1
  fallbackEase: 6
  autoSlack: 2
  camp: { bar: 56, perQuality: 0.4, ageFrom: 24, perYear: 1.2, fee: 0 }
  fameFloor: 0
  perYear: 3

# Batch 5: training sessions (balance/fame.yaml practice has the budget by commitment, the gain curve and the caps). With a team
# the coaches and facilities make a session worth full value (more with a stronger team); a gym or a private coach works without a
# team at a lower gain, for a fee (a gym membership once a year, a coach each session). Training never injures.
training:
  team: { gain: 1, quality: 0.004 }
  gym: { gain: 0.55, fee: 480 }
  coach: { gain: 0.8, fee: 140 }
  rating: 0.04
  craft: 0.03
  club: { craft: 0.3, sessions: 2 }

# Batch 5: athletic scholarships. A recruiter sees recent rating, fame, grades and the program's need for your position.
scholarship:
  ages: { from: 16, to: 18 }
  score: { rating: 1, fame: 0.4, gpa: 8, need: 1 }
  tiers:
    community: { from: 35, full: 60 }
    state: { from: 52, full: 78 }
    elite: { from: 68, full: 92 }
  minShare: 0.2
  chance: 0.6
  floor: 2
  warnYears: 1
  need: 6

# Batch 5: where you stand on a team and captaincy.
role:
  played: { starter: 1, rotation: 0.9, reserve: 0.7 }
  starter: -4
  rotation: -16
  captain: { rating: 1, mood: 2, after: 2 }

# Batch 6: the wider world. Strength levels (1 to 5) a player can give a team they add in Settings, in team quality; a yearly
# commute to a team that plays away from the city you live in (a city the game does not model yet, or another country); and moving
# abroad for a club (the club arranges the permit; it runs this many years past the end of the deal).
world:
  strength: [34, 44, 54, 64, 74]
  commute:
    city: { stress: 1, happiness: 0 }
    country: { stress: 2, happiness: -1 }
  # `weight`: how likely a club abroad is next to a club at home when a team in the market is picked for you.
  abroad: { minAge: 18, permitYears: 2, stress: 4, homesick: 0.15, weight: 0.25 }
  added: { max: 12 }

# Batch 6: soccer's world. Two leagues in every country (a top league and a second one) with clubs moving between them; youth
# academies tied to a club (a trial abroad is for a UK player: the club is in a country the game does not model yet); loans the
# parent club decides; and a yearly transfer market with fees, release clauses and an agent who negotiates.
soccer:
  tiers:
    pay: 0.35
    moves: 2
    promotedMood: 8
    relegatedMood: -8
  academy:
    abroad: { bar: 50, fee: 1800 }
    promote: { bonus: 5, keep: 8 }
    craft: 0.6
  loan:
    maxAge: 24
    reserve: 0.4
    rotation: 0.12
    asked: 0.6
    drop: 8
    refusedMood: 4
    force: 0.5
  transfer:
    # Offers in a window: the expected number by rating, and the most in one window.
    offers:
      - { at: 30, x: 0.1 }
      - { at: 50, x: 0.4 }
      - { at: 65, x: 0.9 }
      - { at: 80, x: 1.6 }
      - { at: 92, x: 2.4 }
    max: 3
    asked: 1.8
    # The fee: this many years of the rung's pay, times value by rating and by age, plus this share for each year left on the deal.
    fee: 2.2
    value:
      - { at: 30, x: 0.3 }
      - { at: 50, x: 0.7 }
      - { at: 70, x: 1.4 }
      - { at: 90, x: 2.4 }
    age:
      - { at: 18, x: 0.9 }
      - { at: 23, x: 1.3 }
      - { at: 27, x: 1.1 }
      - { at: 31, x: 0.6 }
      - { at: 35, x: 0.2 }
    yearsLeft: 0.15
    consent: { base: 0.45, slope: 0.6, reserve: 0.25 }
    signing: 0.08
    wage: { min: 0.9, max: 1.35 }
    push:
      win: 1.12
      chance:
        - { at: 0, x: 0.25 }
        - { at: 1, x: 0.45 }
        - { at: 2, x: 0.6 }
        - { at: 3, x: 0.75 }
      walk: 0.2
    clause: { chance: 0.3, multiple: 2.5 }
    years: { min: 2, max: 5 }

# Batch 6: the national side and the international tournament (its name and how often it is played are in the sport's definition).
international:
  minAge: 18
  callUp:
    - { at: 50, x: 0 }
    - { at: 62, x: 0.06 }
    - { at: 72, x: 0.2 }
    - { at: 82, x: 0.45 }
    - { at: 92, x: 0.7 }
  fameMin: 15
  side: { base: 38, perRating: 0.4 }
  fame: { cap: 0.8, round: 1.2, title: 8 }
  mood: 6
