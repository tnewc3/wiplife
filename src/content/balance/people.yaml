# People's own lives (E3, docs/expansion.md): the people you know get jobs, fall
# in love, move, have children, grow up and run into trouble, each year, by a
# summary of the same rules your own life follows. Jobs, pay and layoffs come
# from careers.yaml and the job tracks, illnesses and addictions from the
# conditions, crimes from the offenses and fertility from family.yaml.
# Starting proposals; Stage 12 (balancing) tunes them against simulation runs.

tiers:
  # Family and partners get the full yearly update.
  closeKinds: [parent, stepparent, grandparent, sibling, child, stepchild, partner, fiance, spouse]
  # Friends who feel at least this much for you are close too.
  closeAffection: 60
  # The rest of your friends, relatives, exes and the people you work with get
  # a lighter update. Acquaintances, classmates and anyone you've cut off even less.
  nearKinds: [relative, friend, ex, coworker, boss]

# What changes in a life each year, by tier.
domains:
  close: [career, love, moving, children, growing, trouble]
  near: [love, moving, children, growing, trouble]
  far: [love, children, trouble]

news:
  # A year's feed keeps its biggest news first, up to this many lines.
  maxPerYear: 8
  keepYears: 4
  perPerson: 2
  # Near and far people only make the news with these.
  major: [engaged, married, divorced, widowed, had_child, diagnosed, addiction_started, jailed, moved]

career:
  # A year's performance is rolled around this and read through the careers
  # balance: firing (by performance), layoffs (by market) and promotions.
  performance: { mean: 56, sd: 18 }
  market: 60
  # Yearly chance a working-age person without a job finds one.
  hire:
    - { at: 18, x: 0.3 }
    - { at: 25, x: 0.38 }
    - { at: 55, x: 0.3 }
    - { at: 64, x: 0.08 }
  # The level someone starts at, by age (a roll around this, rounded).
  hireLevel:
    - { at: 18, x: 1 }
    - { at: 30, x: 1.8 }
    - { at: 45, x: 2.5 }
    - { at: 60, x: 2.8 }
  hireLevelSd: 0.8
  # A working person changes track now and then.
  switch:
    - { at: 18, x: 0.07 }
    - { at: 35, x: 0.04 }
    - { at: 55, x: 0.015 }
  # Retirement, by age. Earlier than the retirement age is rare.
  retire:
    - { at: 59, x: 0 }
    - { at: 62, x: 0.06 }
    - { at: 67, x: 0.28 }
    - { at: 72, x: 0.6 }
    - { at: 78, x: 1 }
  # A job that needs a degree or license goes to someone at least this smart.
  credentialSmarts: 58
  # How well a track suits someone's wealth: by how many wealth levels apart
  # the track's starting pay and their wealth are.
  trackFit: [1, 0.5, 0.15, 0.04, 0.01]
  # Losing a job drags wealth toward this level.
  unemployedWealth: poor

love:
  # Yearly chance a single adult starts dating, by age.
  meet:
    - { at: 18, x: 0.21 }
    - { at: 28, x: 0.24 }
    - { at: 40, x: 0.13 }
    - { at: 55, x: 0.06 }
    - { at: 70, x: 0.025 }
    - { at: 85, x: 0 }
  # After a breakup, divorce or loss, dating is slower for a while.
  afterEnd: 0.45
  afterEndYears: 3
  engage: 0.26
  engageAfterYears: 1
  marry: 0.6
  # Couples who aren't married, by years together.
  breakup:
    - { at: 0, x: 0.3 }
    - { at: 3, x: 0.25 }
    - { at: 8, x: 0.12 }
  # An engagement breaks up half as often.
  engagedBreakup: 0.5
  # Married couples, by years married.
  divorce:
    - { at: 0, x: 0.008 }
    - { at: 6, x: 0.006 }
    - { at: 15, x: 0.0035 }
    - { at: 30, x: 0.0012 }
  partnerAgeOffset: { min: -5, max: 7 }

moving:
  # A move to another city, by age.
  rate:
    - { at: 18, x: 0.07 }
    - { at: 30, x: 0.04 }
    - { at: 50, x: 0.02 }
    - { at: 70, x: 0.01 }
  # Of those who move, the chance they come to your city when they're elsewhere.
  towardYou: 0.3

# How likely someone is to talk: for the social web (E4).
gossip: { sociability: 0.6, unkindness: 0.3, base: 5 }

children:
  # A year's chance of trying for a baby, by how far along the couple are;
  # the pair's fertility (family.yaml) takes it from there.
  tryShare: { dating: 0.04, engaged: 0.12, married: 0.45 }
  perChild: 0.6
  max: 5

growing:
  # Of the minors who come of age, the chance they leave for another city.
  moveAway: 0.3

trouble:
  illnessScale: 1
  maxTroubles: 2
  # Onset curves read Stress, Health and Fitness; the people you know count as these.
  stats: { stress: 50, health: 60, fitness: 50 }
  vice: { base: 40, riskTaking: 0.7, discipline: 0.5 }
  access: { poor: 0.5, working: 0.75, middle: 1, affluent: 1.15, rich: 1.3 }
  rehab: 0.12
  relapse: { years: 6, chance: 0.1 }
  serious: 35
  intervention: 45
  deathScale: 0.5
  crime:
    rate:
      - { at: 14, x: 0.002 }
      - { at: 18, x: 0.022 }
      - { at: 25, x: 0.02 }
      - { at: 40, x: 0.01 }
      - { at: 60, x: 0.003 }
      - { at: 80, x: 0 }
    riskTaking:
      - { at: 0, x: 0.3 }
      - { at: 50, x: 1 }
      - { at: 100, x: 2.2 }
    wealth: { poor: 1.8, working: 1.2, middle: 0.8, affluent: 0.5, rich: 0.4 }
    juvenile: 0.4
    bailJail: 0.5

requests:
  # Requests are events; they count toward the year's event budget, so the cap
  # of six events a year still holds.
  maxPerYear: 2
  minAffection: 35
  personCooldownYears: 3
  minAge: 14
  triggers:
    engaged: { chance: 0.4, tiers: [close] }
    newPartner: { chance: 0.3, tiers: [close] }
    wedding: { chance: 0.85, tiers: [close, near] }
    divorce: { chance: 0.6, tiers: [close] }
    newBaby: { chance: 0.7, tiers: [close, near] }
    arrest: { chance: 0.9, tiers: [close, near] }
    jailed: { chance: 0.35, tiers: [close] }
    released: { chance: 0.6, tiers: [close] }
    jobLoss: { chance: 0.45, tiers: [close] }
    promotion: { chance: 0.22, tiers: [close] }
    # Per year, for each close adult who is short of money.
    moneyTrouble: { chance: 0.035, tiers: [close, near] }
    illness: { chance: 0.7, tiers: [close] }
    relapse: { chance: 0.8, tiers: [close] }
    intervention: { chance: 0.7, tiers: [close] }
    recovered: { chance: 0.5, tiers: [close] }
    death: { chance: 1, tiers: [close, near] }
    moveAway: { chance: 0.5, tiers: [close] }
    moveToYou: { chance: 0.5, tiers: [close] }
    careNeeded: { chance: 1, tiers: [close] }
    cameOfAge: { chance: 0.4, tiers: [close] }

care:
  age: 70
  needChance:
    - { at: 69, x: 0 }
    - { at: 75, x: 0.035 }
    - { at: 85, x: 0.11 }
    - { at: 95, x: 0.3 }
  illnessBoost: 2.5
  # A year of it, at the national average: a relative at your home, and paid care.
  cost: { home: 6000, paid: 30000 }
