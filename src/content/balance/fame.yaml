# Fame in arts and media (E6b): the four paths' shared numbers. Starting
# proposals; Stage 12 (balancing) tunes them. Rung ladders, kinds of work and
# money per rung are in src/content/fame; dollars here are at a city pay level of 1.

entry:
  # What you begin with on the first rung.
  fame: 2
  image: 50
  mood: 60
  fans: 12
  maxAge: 75
  # Craft for someone who starts with no route's head start.
  craft: 8

quality:
  base: 20
  # The most the blend of traits and stats (weighted by the path) can add.
  aptitude: 12
  # A hidden talent that fits the path, and the little extra once you have found it.
  talent: 22
  talentFound: 4
  craft: 0.17
  team: { agent: 1.5, company: 1.5 }
  luck: 0.05
  noise: 7
  # Craft gained in a year of work, by craft so far: it comes slower as it grows.
  craftGain:
    - { at: 0, x: 5 }
    - { at: 40, x: 3 }
    - { at: 70, x: 1.5 }
    - { at: 100, x: 0.5 }
  craftDiscipline: 0.02
  # Practice alone only takes you so far without a talent that fits.
  craftCap: { talent: 100, none: 65 }
  # A year with no project still teaches a little (a share of a project year).
  craftIdle: 0.3

reception:
  style:
    commercial: { critic: -5, fan: 6 }
    artistic: { critic: 6, fan: -5 }
  risk:
    safe: { critic: -2, fan: 3, spread: 0.7 }
    bold: { critic: 3, fan: -1, spread: 1.8 }
  # Per point of fan mood and public image above 50.
  mood: 0.1
  image: 0.05
  noise: 8
  # acclaimed: both scores at least `high`; cult: critics at least `high`, fans below `low`;
  # crowd: fans at least `high`, critics below `low`; else by the blend: hit, solid or flop.
  bands: { acclaimed: 70, hit: 60, solid: 40, high: 66, low: 48 }

gain:
  # Fame points a release wins (or loses) by how it was received, critics and fans blended (0-100).
  reception:
    - { at: 0, x: -6 }
    - { at: 30, x: -1.5 }
    - { at: 40, x: 0.8 }
    - { at: 50, x: 3 }
    - { at: 60, x: 5.5 }
    - { at: 70, x: 8.5 }
    - { at: 80, x: 12 }
    - { at: 90, x: 15 }
    - { at: 100, x: 18 }
  # Rung 1 first: the higher you are, the slower the climb.
  rung: [1.4, 1.25, 1.1, 0.9, 0.7, 0.55, 0.45, 0.4]
  commitment: { back: 0.5, steady: 1, all: 1.6 }
  press: 1.25
  tour: 1.2
  # Per tier of agent.
  agent: 0.08
  comeback: 1.6
  fansAt:
    - { at: 0, x: 10 }
    - { at: 10, x: 60 }
    - { at: 20, x: 250 }
    - { at: 30, x: 1000 }
    - { at: 40, x: 4000 }
    - { at: 50, x: 15000 }
    - { at: 60, x: 50000 }
    - { at: 70, x: 200000 }
    - { at: 80, x: 700000 }
    - { at: 90, x: 2500000 }
    - { at: 100, x: 8000000 }
  fansFollow: 0.35
  moodFans: 0.6
  # Fan mood moves by this share of (how fans took it - 55).
  moodShare: 0.45
  # Public image moves by this share of (what critics made of it - 50).
  imageShare: 0.12

income:
  # A release pays this multiple of the rung's usual year, by how fans took it.
  release:
    - { at: 0, x: 0.1 }
    - { at: 30, x: 0.3 }
    - { at: 50, x: 0.7 }
    - { at: 65, x: 1.1 }
    - { at: 80, x: 1.6 }
    - { at: 100, x: 2.2 }
  retainer: 0.25
  # Public image above 50 adds this much (a share, per point) to the retainer: brands pay for a good name.
  image: 0.012
  # Money events pay (or cost) a share of the rung's usual year, with a floor in dollars.
  sizes: { petty: 0.02, small: 0.06, solid: 0.15, big: 0.4, major: 1.0 }
  floor: { petty: 60, small: 250, solid: 900, big: 3500, major: 12000 }

commitment:
  # A year at each setting: affection lost by your partner and children (close) and by everyone else (other),
  # health lost, stress gained, happiness gained (minus is lost).
  strain:
    back: { close: 0, other: 0, health: 0, stress: -1, happiness: 0 }
    steady: { close: 1, other: 0.5, health: 0, stress: 1, happiness: 0 }
    all: { close: 4, other: 2, health: 1.5, stress: 3.5, happiness: -1 }
  burnout:
    perYear: { back: -12, steady: 1.5, all: 9 }
    # The chance each year, by burnout level, that you burn out.
    risk:
      - { at: 0, x: 0 }
      - { at: 59, x: 0 }
      - { at: 70, x: 0.06 }
      - { at: 85, x: 0.18 }
      - { at: 100, x: 0.4 }
    # Burnout comes down to this after one, and a quiet year takes this much off.
    after: 30
    recover: 10
  # Points off a day job's yearly review.
  job: { back: 0, steady: -2, all: -8 }
  # A multiple on what a release pays.
  output: { back: 0.7, steady: 1, all: 1.15 }
  minorsMax: steady

bigBreak:
  # Yearly, by the quality of your recent work.
  chance:
    - { at: 0, x: 0 }
    - { at: 40, x: 0.0005 }
    - { at: 60, x: 0.004 }
    - { at: 75, x: 0.011 }
    - { at: 90, x: 0.022 }
    - { at: 100, x: 0.03 }
  exposure: { press: 1.5, tour: 1.5, agent: 0.15 }
  jump: { min: 2, max: 3 }
  # How high a break can take you (a share of the ladder): with a talent that fits the path, and without.
  ceiling: { talent: 1, none: 0.6 }
  cooldown: 6
  luck: 0.004

fade:
  # Fame lost in a year with no new work: a share of fame plus a flat amount.
  share: 0.12
  flat: 1.2
  # More lost when the work is thinner than the rung asks for.
  thin: 4
  slack: 4
  fans: 0.15
  mood: 6
  dormant: 6

comeback:
  # Yearly, once fame has faded, by years since the last project.
  chance:
    - { at: 0, x: 0 }
    - { at: 2, x: 0.04 }
    - { at: 5, x: 0.12 }
    - { at: 10, x: 0.2 }
    - { at: 25, x: 0.1 }
  # The share of the way back to your peak fame that going back to work wins at once.
  share: 0.5

agents:
  # Yearly, by rung: an agent comes to you.
  offer:
    - { at: 1, x: 0.02 }
    - { at: 2, x: 0.12 }
    - { at: 4, x: 0.2 }
    - { at: 6, x: 0.15 }
  doors: 0.25
  dropImage: 3

contracts:
  offer:
    - { at: 1, x: 0 }
    - { at: 2, x: 0.1 }
    - { at: 3, x: 0.2 }
    - { at: 5, x: 0.22 }
    - { at: 7, x: 0.15 }
  advance: { standard: 0.3, tough: 0.5, generous: 0.15 }
  share: { standard: 0.25, tough: 0.4, generous: 0.12 }
  years: { standard: { min: 2, max: 4 }, tough: { min: 3, max: 5 }, generous: { min: 1, max: 3 } }
  exclusive: { standard: 0.3, tough: 0.9, generous: 0.05 }
  minCommitment: steady
  breakFee: 0.6
  breakImage: 8
  breakMood: 10
  minorYears: 3

awards:
  # By the better of the scores that award weighs, and its prestige.
  nominate:
    - { at: 0, x: 0 }
    - { at: 55, x: 0 }
    - { at: 65, x: 0.15 }
    - { at: 80, x: 0.45 }
    - { at: 95, x: 0.8 }
  win:
    - { at: 0, x: 0.05 }
    - { at: 60, x: 0.15 }
    - { at: 80, x: 0.4 }
    - { at: 95, x: 0.7 }
  image: { nominated: 2, won: 6, lost: -1 }
  fame: { nominated: 1, won: 4 }

scene:
  # A share of a year's earnings.
  cost: { low: 0.04, social: 0.1, entourage: 0.2, lavish: 0.35 }
  happiness: { low: 0, social: 0.5, entourage: 1, lavish: 1.5 }
  image: { low: 0, social: 0.5, entourage: 1.5, lavish: 2.5 }
  # The chance a year of it gives the tabloids something, times fame over 100.
  scandal: { low: 0.004, social: 0.015, entourage: 0.04, lavish: 0.09 }
  minRung: { low: 1, social: 2, entourage: 4, lavish: 5 }
  perks: { value: 60000, image: 1.5, happiness: 1 }

people:
  super:
    - { at: 8, x: 0.02 }
    - { at: 40, x: 0.08 }
    - { at: 70, x: 0.14 }
  hater:
    - { at: 18, x: 0.01 }
    - { at: 50, x: 0.07 }
    - { at: 80, x: 0.12 }
  critic:
    - { at: 22, x: 0.02 }
    - { at: 50, x: 0.06 }
    - { at: 80, x: 0.1 }
  max: 3
  affection: { super: 78, hater: 8, critic: 35 }
  # The yearly chance a superfan's devotion turns to stalking (adults only), by fame.
  stalk:
    - { at: 20, x: 0.001 }
    - { at: 50, x: 0.005 }
    - { at: 90, x: 0.01 }
  leaveYears: 12

stalker:
  escalate: 0.4
  giveUp: 0.12
  stress: 3
  charge: 0.65
  order: 0.75
  violate: 0.3

tabloids:
  minFame: 40
  minAge: 18
  chance:
    - { at: 40, x: 0.02 }
    - { at: 60, x: 0.04 }
    - { at: 90, x: 0.08 }
  # More likely for a poor public image: per point under 50.
  image: 0.004
  hit: { image: 6, mood: 8, fame: 2 }
  keep: 6

crossover:
  rung: 4
  fame: 55
  carry: { rung: 0.5, fame: 0.4, craft: 0.3 }

retirement:
  fade: 0.08
  years: 25
  fans: 0.06

minors:
  trust: 0.5
  parentAge: 18

events:
  maxQueued: 2

# Batch 4: the grind. Practice, shows, tours, bands and your sound (music;
# practice and tours work for any path that has them in src/content/fame).

practice:
  # Sessions a year by commitment (under 18: at most steady's).
  sessions: { back: 4, steady: 8, all: 12 }
  # Points a session adds, by the skill so far: slower as it grows.
  gain:
    - { at: 0, x: 4.5 }
    - { at: 40, x: 3 }
    - { at: 70, x: 1.5 }
    - { at: 90, x: 0.5 }
    - { at: 100, x: 0 }
  # Each session of the same skill in a year is worth this share of the one before.
  repeat: 0.8
  # Practice alone only takes you so far without a talent that fits.
  cap: { talent: 100, none: 50 }
  talent: 1.3
  discipline: 0.01
  # A share of each session's gain also goes to craft.
  craft: 0.25
  # Quality points per point of the skills a kind of work draws on (their mean).
  quality: 0.05
  start: 10
  # Changing your instrument keeps this share of what you could play.
  switchKeep: 0.4

shows:
  perYear: 6
  base: 30
  aptitude: 15
  talent: 15
  skills: 0.25
  craft: 0.15
  noise: 10
  bands: { great: 62, good: 42 }
  # What a show brings (fame, fans and pay), by how it went.
  outcome: { great: 1.5, good: 1, rough: 0.3 }
  venues:
    open_mic: { pay: 0.05, fame: 0.5, fans: 0.03, fansFloor: 3, craft: 0.4, stress: 1 }
    local_gig: { pay: 0.04, fame: 0.6, fans: 0.03, fansFloor: 10, craft: 0.35, stress: 1 }
    club: { pay: 0.035, fame: 0.5, fans: 0.025, fansFloor: 40, craft: 0.3, stress: 2 }
    concert: { pay: 0.03, fame: 0.45, fans: 0.02, fansFloor: 200, craft: 0.25, stress: 2 }
    festival: { pay: 0.025, fame: 0.4, fans: 0.02, fansFloor: 2000, craft: 0.2, stress: 2 }
  affection: { great: 3, good: 1, rough: -2 }
  chemistry: { great: 3, good: 1, rough: -3 }
  event: 0.08

tours:
  perYear: 1
  # `from` is the share of the ladder's rungs you have climbed.
  sizes:
    local: { from: 0, cost: 0.15, revenue: 0.35, fame: 2, fans: 0.05, close: 1, other: 0.5, stress: 2, burnout: 4 }
    regional: { from: 0.4, cost: 0.2, revenue: 0.5, fame: 3, fans: 0.07, close: 2, other: 1, stress: 3, burnout: 6 }
    national: { from: 0.55, cost: 0.25, revenue: 0.65, fame: 3.5, fans: 0.08, close: 3, other: 1.5, stress: 4, burnout: 8 }
    world: { from: 0.85, cost: 0.3, revenue: 0.8, fame: 4, fans: 0.1, close: 4, other: 2, stress: 5, burnout: 10 }
  mood: { low: 0.6, high: 1.4 }

band:
  size: { min: 2, max: 4 }
  # Bandmates' skill when they join, by your rung.
  skill:
    - { at: 1, x: 35 }
    - { at: 3, x: 50 }
    - { at: 5, x: 65 }
    - { at: 7, x: 80 }
  affection: 62
  chemistry: 60
  # Your share of what the band earns.
  cut: 0.5
  # Quality: per point of the members' mean skill, and per point of chemistry above 50.
  quality: { skill: 0.02, chemistry: 0.05 }
  showFans: 1.3
  drift: 0.2
  # Yearly, by chemistry.
  clash:
    - { at: 0, x: 0.35 }
    - { at: 40, x: 0.2 }
    - { at: 60, x: 0.08 }
    - { at: 80, x: 0.03 }
  quit:
    - { at: 0, x: 0.3 }
    - { at: 40, x: 0.12 }
    - { at: 60, x: 0.04 }
    - { at: 80, x: 0.015 }
  split:
    - { at: 0, x: 0.25 }
    - { at: 30, x: 0.1 }
    - { at: 45, x: 0.02 }
    - { at: 60, x: 0 }
  # Yearly, for the most skilled member, by their skill.
  poach:
    - { at: 50, x: 0 }
    - { at: 70, x: 0.03 }
    - { at: 90, x: 0.08 }
  # Yearly, for a musician with no band, by rung.
  offer:
    - { at: 1, x: 0.3 }
    - { at: 3, x: 0.2 }
    - { at: 5, x: 0.1 }
    - { at: 7, x: 0.05 }
  kick: { affection: 35, chemistry: -4 }
  leave: { affection: 10, fans: 0.8 }
  solo: { affection: 18, fans: 0.9 }
  adultMin: 18
  minorSpread: 3

sound:
  # Pairs not listed are `other`.
  affinity:
    - { a: rock, b: alt_rock, x: 0.85 }
    - { a: rock, b: metal, x: 0.6 }
    - { a: rock, b: punk, x: 0.65 }
    - { a: rock, b: blues, x: 0.6 }
    - { a: rock, b: indie, x: 0.65 }
    - { a: rock, b: country, x: 0.4 }
    - { a: rock, b: pop, x: 0.4 }
    - { a: alt_rock, b: indie, x: 0.8 }
    - { a: alt_rock, b: punk, x: 0.7 }
    - { a: alt_rock, b: metal, x: 0.55 }
    - { a: metal, b: punk, x: 0.5 }
    - { a: punk, b: indie, x: 0.55 }
    - { a: pop, b: rnb, x: 0.65 }
    - { a: pop, b: edm, x: 0.6 }
    - { a: pop, b: hip_hop, x: 0.5 }
    - { a: pop, b: latin, x: 0.6 }
    - { a: pop, b: indie, x: 0.45 }
    - { a: pop, b: country, x: 0.4 }
    - { a: hip_hop, b: rnb, x: 0.75 }
    - { a: hip_hop, b: edm, x: 0.4 }
    - { a: hip_hop, b: latin, x: 0.4 }
    - { a: hip_hop, b: reggae, x: 0.4 }
    - { a: rnb, b: soul, x: 0.85 }
    - { a: soul, b: jazz, x: 0.55 }
    - { a: soul, b: blues, x: 0.6 }
    - { a: soul, b: reggae, x: 0.4 }
    - { a: jazz, b: blues, x: 0.7 }
    - { a: blues, b: country, x: 0.5 }
    - { a: blues, b: folk, x: 0.45 }
    - { a: country, b: folk, x: 0.7 }
    - { a: folk, b: indie, x: 0.65 }
    - { a: latin, b: regional_mexican, x: 0.7 }
    - { a: latin, b: reggae, x: 0.45 }
    - { a: regional_mexican, b: country, x: 0.4 }
    - { a: edm, b: indie, x: 0.3 }
  other: 0.12
  # A release this far from your sound (or more) counts as off-genre.
  offGenre: 0.1
  fanScore: 12
  mood: 10
  leave: 0.25
  gain: 0.3
  switchLeave: 0.2
  switchMood: 8
