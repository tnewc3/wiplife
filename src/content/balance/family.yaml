# Children and parenting (E2a): who can carry a pregnancy, fertility,
# pregnancy, miscarriage, IVF, surrogacy, adoption, genetics, parenting
# style, how children grow, what they cost and child support. Starting
# proposals; Stage 12 (balancing) tunes them against simulation runs.
# Everything is at the national average and scales with your city's cost of
# living where it is money.

carrying:
  # Random nonbinary characters, relatives and the people you meet can carry a
  # pregnancy with this chance. Women can, men can't; a custom nonbinary
  # character chooses at creation.
  nonbinaryChance: 0.5

# Trying for a baby for a year. The chance is tryChance × the carrier's age
# factor × the other parent's age factor × the carrier's health factor,
# plus planBonus when you plan around it.
fertility:
  tryChance: 0.6
  carrierAge:
    - { at: 18, x: 1 }
    - { at: 28, x: 1 }
    - { at: 33, x: 0.85 }
    - { at: 36, x: 0.65 }
    - { at: 40, x: 0.35 }
    - { at: 44, x: 0.1 }
    - { at: 48, x: 0.02 }
    - { at: 52, x: 0 }
  otherAge:
    - { at: 18, x: 1 }
    - { at: 50, x: 0.95 }
    - { at: 65, x: 0.7 }
    - { at: 80, x: 0.4 }
  # By the carrier's Health stat.
  health:
    - { at: 0, x: 0.45 }
    - { at: 50, x: 0.9 }
    - { at: 100, x: 1 }
  # Other people count as having this Health.
  npcHealth: 70
  # Trying for a baby is offered only when a year of it has at least this chance.
  minTryChance: 0.06
  planBonus: 0.1

# An intimate night between a pair where one can carry a pregnancy: the
# chance of conceiving by the protection you chose, times the same age and
# health factors.
unplanned:
  carefree: 0.14
  careful: 0.012

pregnancy:
  miscarriage:
    base: 0.075
    # Multiplies the base, by the carrier's age and Health.
    carrierAge:
      - { at: 20, x: 0.9 }
      - { at: 30, x: 1 }
      - { at: 35, x: 1.6 }
      - { at: 40, x: 2.8 }
      - { at: 45, x: 4 }
    health:
      - { at: 0, x: 2 }
      - { at: 50, x: 1.1 }
      - { at: 100, x: 0.85 }

ivf:
  minAge: 21
  maxAge: 45
  # Chance a cycle works, by the carrier's age.
  success:
    - { at: 20, x: 0.5 }
    - { at: 30, x: 0.45 }
    - { at: 35, x: 0.35 }
    - { at: 38, x: 0.25 }
    - { at: 40, x: 0.15 }
    - { at: 42, x: 0.08 }
    - { at: 45, x: 0.02 }
  waitYears: 1

surrogacy:
  minAge: 25
  maxAge: 65
  success: 0.75
  waitYears: 1

adoption:
  minAge: 21
  maxAge: 70
  waitYears: { min: 1, max: 3 }
  declineChance: 0.12
  # Weights by the child's age at placement (index = years old).
  childAgeWeights: [4, 4, 3, 3, 2, 2, 1.5, 1.5, 1, 1, 1, 0.5, 0.5]
  # A conviction that brought probation or prison within this many years rules you out.
  recordYears: 10
  # What savings must still hold after the fees.
  reserve: 3000

genetics:
  # A child's starting stats and personality: the mean of the biological
  # parents' values, plus this spread.
  noiseSd: 9
  riskSd: 10
  talentInherit: 0.35
  newborn:
    health: { mean: 88, sd: 7 }
    happiness: { mean: 75, sd: 8 }
    stress: { mean: 8, sd: 5 }
  # With only one biological parent known (a stepchild's, or a donor), the
  # other half comes from the general population.
  populationShare: 0.5

parenting:
  start: { warmth: 50, strictness: 50, involvement: 50 }
  # Each year the style moves this share of the way back to its baseline:
  # it describes how you've been lately.
  drift: 0.15
  involvementBaseline: { household: 52, shared: 45, other: 30 }
  inactivity: 4
  stepShare: 0.5
  # How a child feels about you when they arrive.
  bond:
    birth: { affection: { mean: 62, sd: 8 }, trust: { mean: 58, sd: 8 } }
    adopted: { affection: { mean: 45, sd: 12 }, trust: { mean: 35, sd: 12 } }
  words: { high: 62, low: 38 }
  memories: { high: 75, low: 25, years: 3 }

children:
  # How much your style weighs on a child's growth, by their age.
  ageWeight:
    - { at: 0, x: 0.4 }
    - { at: 3, x: 1 }
    - { at: 12, x: 1 }
    - { at: 17, x: 0.6 }
    - { at: 22, x: 0.15 }
    - { at: 26, x: 0 }
  # Points a year at the extreme of a style line (ages 3–12), by trait.
  personality:
    kindness: { warmth: 1.6 }
    confidence: { warmth: 1, involvement: 0.6, strictness: -0.4 }
    discipline: { strictness: 1.5, involvement: 0.5 }
    riskTaking: { strictness: -1, warmth: -0.5, involvement: -0.5 }
    ambition: { involvement: 0.8, strictness: 0.5 }
    sociability: { warmth: 0.7 }
  smarts: { involvement: 0.8, warmth: 0.3 }
  grades:
    base: 2.7
    smarts: 0.018
    discipline: 0.012
    happiness: 0.004
    style: { warmth: 0.15, strictness: 0.25, involvement: 0.55 }
    noiseSd: 0.3
  happiness:
    base: 64
    style: { warmth: 22, strictness: -6, involvement: 6 }
    rate: 0.45
    noiseSd: 5
  stress:
    base: 14
    style: { warmth: -10, strictness: 8, involvement: -3 }
    rate: 0.45
    noiseSd: 4
  health: { base: 86, fitnessBase: 55, noiseSd: 3, rate: 0.12 }
  affection:
    base: 52
    style: { warmth: 32, strictness: -6, involvement: 10 }
    rate: 0.18
  trust:
    style: { warmth: 2, strictness: -0.8, involvement: 1.5 }
  moodWarmth: 0.2
  leaving: { age: 18, chance: 0.4, latest: 24, elsewhere: 0.3 }
  career: { age: 21, employed: 0.8 }
  # Yearly chance a child dies, by age. From 30, the usual odds for people
  # you know apply (mortality.yaml).
  death:
    byAge:
      - { at: 0, x: 0.004 }
      - { at: 1, x: 0.0006 }
      - { at: 5, x: 0.0002 }
      - { at: 12, x: 0.0003 }
      - { at: 17, x: 0.0007 }
      - { at: 29, x: 0.0009 }
    usualFrom: 30

costs:
  # Yearly, at the national average, by the child's age.
  perChild:
    - { at: 0, x: 7000 }
    - { at: 3, x: 8500 }
    - { at: 6, x: 6500 }
    - { at: 12, x: 7500 }
    - { at: 17, x: 9500 }
  lifestyle: { frugal: 0.7, comfortable: 1, lavish: 1.7 }
  # Your share when the child's other parent lives with you.
  partnerShare: 0.55
  sharedShare: 0.5

custody:
  case: { involvement: 0.45, warmth: 0.25, housing: 0.15, work: 0.15 }

support:
  # What you pay (share of your gross income, by how many children) when
  # they live with their other parent, and never less than payMin.
  pay: [0.14, 0.2, 0.25]
  payMin: 1200
  # Multiplies what you receive for two, and for three or more, children.
  receiveMore: [1.6, 2.1]
  # What you receive when they live with you, by the other parent's wealth.
  receive: { poor: 800, working: 2000, middle: 4000, affluent: 7000, rich: 11000 }
  untilAge: 18

stepchildren:
  # The chance someone you meet as a potential partner already has children, by their age.
  chance:
    - { at: 24, x: 0.03 }
    - { at: 30, x: 0.12 }
    - { at: 38, x: 0.3 }
    - { at: 48, x: 0.4 }
    - { at: 60, x: 0.25 }
    - { at: 75, x: 0.05 }
  # Weights for one, two or three children.
  count: [6, 3, 1]
  maxAge: 24
  affection: { mean: 45, sd: 12 }
  trust: { mean: 40, sd: 12 }

# E2b: settling an estate at death. Costs come off first (the funeral at the
# national average, scaled to the city you lived in, then legal and
# settlement costs as a share of savings plus the home), then debts other than
# the mortgage; a home passes with its mortgage, or is sold when it can't
# pass whole; what is left is shared out by the will, or by these defaults.
# Debts are never inherited beyond the home they are attached to.
estate:
  funeral: 9000
  settlementShare: 0.03
  # Estate tax, as a share of the whole estate by its size (dollars): nothing
  # on a small estate, rising to 70% on a very large one.
  tax:
    - { at: 0, x: 0 }
    - { at: 600000, x: 0 }
    - { at: 1200000, x: 0.2 }
    - { at: 2500000, x: 0.4 }
    - { at: 6000000, x: 0.55 }
    - { at: 12000000, x: 0.7 }
  # A will has between one and this many shares.
  maxShares: 8
  default:
    # A spouse and children: the spouse's percent; children split the rest equally.
    spouseWithChildren: 50
    # A spouse and no children: the spouse's percent; living parents and
    # siblings split the rest (the spouse takes it all when there are none).
    spouseOnly: 80
    # Nobody but parents and siblings: the parents' percent; the siblings split the rest.
    parents: 70

# E2b: continuing as an heir.
heir:
  # Money an heir under this age inherits is held in trust until they reach it.
  trustReleaseAge: 18
  # What a grown heir has from a life of their own that isn't played (before
  # any inheritance), by their wealth level.
  adultSavings: { poor: 600, working: 2500, middle: 7000, affluent: 20000, rich: 45000 }
  # Who can take a minor heir in when no parent can (a surviving parent always can).
  guardian:
    minAge: 21
    maxAge: 78
    minAffection: 25
  # How the heir feels about the family around them at the start.
  bonds:
    parent: { affection: { mean: 62, sd: 10 }, trust: { mean: 58, sd: 10 } }
    stepparent: { affection: { mean: 48, sd: 12 }, trust: { mean: 45, sd: 12 } }
    sibling: { affection: { mean: 58, sd: 14 }, trust: { mean: 52, sd: 14 } }
    grandparent: { affection: { mean: 64, sd: 10 }, trust: { mean: 58, sd: 10 } }
    relative: { affection: { mean: 52, sd: 12 }, trust: { mean: 46, sd: 12 } }
    foster: { affection: { mean: 38, sd: 12 }, trust: { mean: 30, sd: 12 } }
  # A grown heir under this age who hadn't moved out lives with a surviving parent.
  livesHomeUntil: 21
  # The most memories of how they were raised that the childhood recap tells.
  recapMemories: 4
  fosterAge: { min: 32, max: 58 }
  # Family reputation, 0–100 (50 is unremarkable). When a life ends it
  # becomes 50 + (the old value - 50) × retention, plus what the life added.
  reputation:
    retention: 0.7
    # Points per point your own reputation stood above or below 50.
    personal: 0.35
    record: { warning: 0, fine: -0.5, probation: -2, jail: -6 }
    # Points for what you left behind: net worth at death (dollars) -> points.
    wealth:
      - { at: 0, x: 0 }
      - { at: 250000, x: 1 }
      - { at: 750000, x: 3 }
      - { at: 2000000, x: 6 }
    # Percent of the estate left to a cause, per percent; a gift of at least deedAt percent makes the family known for it.
    generosity: { perPercent: 0.12, max: 7, deedAt: 20 }
    # Deeds proven by a flag: the points they add or cost, and what the family becomes known for.
    flags:
      filed_bankruptcy: { delta: -3, deed: bankruptcy }
      unfaithful: { delta: -2, deed: scandal }
      stole_from_work: { delta: -4, deed: scandal }
      cooked_books: { delta: -6, deed: scandal }
      dui_arrest: { delta: -3, deed: scandal }
      caught_shoplifting: { delta: -1, deed: scandal }
      was_evicted: { delta: -1.5, deed: bankruptcy }
      whistleblower: { delta: 4, deed: honored }
      volunteers: { delta: 2.5, deed: honored }
      wrote_memoir: { delta: 1.5, deed: honored }
      union_member: { delta: 2, deed: honored }
      valedictorian: { delta: 1.5, deed: honored }
    # Wealth makes the family known for it from this net worth, and a record from this many convictions.
    deedWealth: 600000
    deedConvictions: 1
    maxDeeds: 5
    # The heir's own reputation starts at 50 plus this share of the family's distance from 50.
    carry: 0.6
  # A new person who joins the heir's life starts this many affection points
  # higher for each point of family reputation above 50 (lower below).
  newPersonAffection: 0.25
  # After a death, how often a will (or its absence) leads to a dispute.
  drama:
    siblingDispute: 0.35
    estrangedContest: 0.6
    unexpectedBeneficiary: 0.5
    causeLetter: 0.7
    noWillDispute: 0.3
    inYears: { min: 1, max: 3 }
  # Memories of how the heir was raised bring an event this often, and when.
  memoryEvent: { chance: 0.6, inYears: { min: 2, max: 7 }, max: 2 }
