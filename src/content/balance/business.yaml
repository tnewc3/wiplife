# W3: businesses. Every number the businesses use. Starting proposals; the 10,000-life simulation
# (npm run simulate, targets in balance/targets.yaml business) sets them.
#
# A business's year (src/engine/business/model.ts): demand from the city, the style's fit, reputation, quality, prices,
# marketing and the skill of whoever runs it; customers are the smaller of demand and what the staff can serve;
# revenue is customers times what each spends; costs are rent, wages, supplies, marketing, quality and overhead.

# B2: the walls are far out; attention, money and managers hold a business back before they bite.
limits:
  businesses: 5
  locations: 24
  totalLocations: 36
  franchises: 20
  namedPerLocation: 4
  namedTotal: 40
  minAge: 18
  nameLength: 40

# Each city's size and wealth for demand (1 is the national average), and how crowded its market is.
cities:
  nyc: { size: 1.9, wealth: 1.5, competition: 1.2 }
  los_angeles: { size: 1.6, wealth: 1.3, competition: 1.15 }
  chicago: { size: 1.4, wealth: 1.1, competition: 1.05 }
  houston: { size: 1.3, wealth: 1.0, competition: 1.0 }
  small_town: { size: 0.35, wealth: 0.8, competition: 0.8 }
  toronto: { size: 1.7, wealth: 1.1, competition: 1.1 }
  vancouver: { size: 1.2, wealth: 1.1, competition: 1.05 }
  montreal: { size: 1.3, wealth: 0.95, competition: 1.0 }
  small_town_ca: { size: 0.35, wealth: 0.8, competition: 0.8 }
  london: { size: 2.0, wealth: 1.2, competition: 1.2 }
  manchester: { size: 1.2, wealth: 0.9, competition: 1.0 }
  small_town_uk: { size: 0.35, wealth: 0.75, competition: 0.8 }
  mexico_city: { size: 2.0, wealth: 0.6, competition: 1.2 }
  guadalajara: { size: 1.2, wealth: 0.5, competition: 1.0 }
  monterrey: { size: 1.2, wealth: 0.6, competition: 1.0 }
  small_town_mx: { size: 0.3, wealth: 0.4, competition: 0.8 }

levels:
  price:
    low: { label: Below the going rate, mult: 0.85, reputation: 1.5 }
    fair: { label: The going rate, mult: 1, reputation: 0 }
    high: { label: Above the going rate, mult: 1.25, reputation: -4 }
  marketing:
    none: { label: None, share: 0, boost: 0 }
    light: { label: Some, share: 0.02, boost: 0.08 }
    heavy: { label: A lot, share: 0.05, boost: 0.15 }
  quality:
    none: { label: None, share: 0, aim: 0 }
    some: { label: Some, share: 0.02, aim: 10 }
    lots: { label: A lot, share: 0.05, aim: 18 }
  pay:
    low: { label: Below the market, mult: 0.88, morale: -12 }
    fair: { label: The market rate, mult: 1, morale: 0 }
    high: { label: Above the market, mult: 1.15, morale: 8 }
  staffing:
    lean: { label: Lean, mult: 0.75, morale: -6, quality: -15 }
    normal: { label: Normal, mult: 1, morale: 0, quality: 0 }
    full: { label: Generous, mult: 1.25, morale: 3, quality: 4 }

demand:
  reputation: { base: 0.55, slope: 0.9 }
  quality: { base: 0.5, slope: 0.9 }
  maturity: [0.85, 0.95, 1]
  saturation: 0.8
  season: { sd: 0.07, luck: 0.05 }
  skill: 0.006
  attention: { floor: 0.65 }
  unlicensed: 0

costs:
  overheadShare: 0.075
  overheadFixed: 2000
  waste: 0.004
  crewWage: 1
  licensedWage: 1.4
  managerWage: 1.3
  depreciation: 0.12
  newLocation: 0.9

staff:
  skill: { mean: 52, sd: 15 }
  smartsLift: 0.25
  skillWage: 0.006
  hiring: 0.08
  severance: 0.15
  skillQuality: 0.15
  ages: { min: 19, max: 55 }
  affection: { mean: 52, sd: 12 }
  trust: { mean: 50, sd: 12 }
  morale:
    start: 60
    base: 62
    pull: 0.5
    kindness: 0.12
    loss: -10
    profit: 4
    noise: 8
    bond: 0.1
    loyalty: { work: 5, family: 8 }
  quit:
    - { at: 0, x: 0.6 }
    - { at: 30, x: 0.35 }
    - { at: 50, x: 0.12 }
    - { at: 70, x: 0.05 }
    - { at: 100, x: 0.02 }
  raise: { pay: 0.08, morale: 8 }
  pool:
    minAffection: 30
    kinds: [friend, acquaintance, classmate, sibling, relative, child, partner, spouse]

owner:
  effort: { self: 1, job: 0.5, away: 0.45 }
  experience: { perYear: 1.2, cap: 12 }
  jobDrag: 6
  stress: { run: 1.5, loss: 2, limit: 80 }
  # B2: each further business you run yourself takes a quarter of your effort; each location beyond the first that one person runs, 8%.
  attention: { perExtraBusiness: 0.25, floor: 0.4 }
  span: { perLocation: 0.08, floor: 0.5 }

manager:
  skill: { mean: 50, sd: 15 }
  honesty: { mean: 62, sd: 22 }
  honestyLine: 35
  skimChance: 0.35
  skim: 0.12
  effort: { base: 0.78, slope: 0.5, min: 0.35, max: 1 }
  neglectBelow: 30

# B2: products, orders and stock.
products:
  cover: { lean: 0.85, normal: 1.1, heavy: 1.35 }
  maxLines: { budget: 3, standard: 4, premium: 6 }
  holding: 0.04
  wasteFloor: 0.03
  stockout: { line: 0.1, perShare: 14, cap: 5 }
  walkout: 0.25
  wasteLine: 0.12
  switchFee: 0.02
  switchFloor: 300
  growthCap: 1.15
  parity: 0.03

competition: { weight: 0.35, edge: 0.5 }

# B2: boom, steady, slowdown, recession. A world index: the same for every business and country in a life.
economy:
  phases:
    boom: { label: Boom, demand: 1.06, drift: 0.02, bank: 1.15 }
    steady: { label: Steady, demand: 1, drift: 0, bank: 1 }
    slowdown: { label: Slowdown, demand: 0.96, drift: -0.005, bank: 0.9 }
    recession: { label: Recession, demand: 0.88, drift: -0.02, bank: 0.7 }
  transitions:
    boom: { boom: 5, steady: 4, slowdown: 1, recession: 0 }
    steady: { boom: 2, steady: 6, slowdown: 1.2, recession: 0.4 }
    slowdown: { boom: 0.5, steady: 3.5, slowdown: 3, recession: 1.2 }
    recession: { boom: 0.4, steady: 3.5, slowdown: 3, recession: 2.2 }
  start: { boom: 2, steady: 6, slowdown: 1.5, recession: 0.5 }
  window: 8

suppliers:
  volatility: 0.05
  reversion: 0.35
  min: 0.7
  max: 1.6
  passThrough: 0.5
  riseThreshold: 0.12
  shortage: { chance: 0.03, supply: 0.6, years: 1 }
  deal: { chance: 0.06, discount: 0.12, years: 3 }
  window: 12

trends: { volatility: 0.04, reversion: 0.4, min: 0.75, max: 1.35, window: 12 }

# B2: headcount per location and role.
headcount:
  maxMultiple: 2
  roleCap: 1.25
  workload: { limit: 1.2, morale: 6 }

crew:
  refill: 0.08
  skill: { mean: 50, sd: 12 }
  ceiling: 75
  pull: 0.5

training:
  none: { label: None, share: 0, skill: 0, morale: 0 }
  some: { label: Some, share: 0.02, skill: 1.5, morale: 3 }
  lots: { label: A lot, share: 0.05, skill: 3, morale: 5 }

locationManagers:
  appointFee: 0.08
  transfer: { sameCity: 0.03, otherCity: 0.5, morale: -4 }
  willing: { base: -20, morale: 0.6, affection: 0.6, ties: 4, likely: 60, unlikely: 35 }
  drag: { quality: 6, morale: 6, below: 45 }

franchise:
  minYears: 5
  minLocations: 3
  minQuality: 55
  minReputation: 55
  cleanYears: 3
  feeMultiple: 0.5
  royalties: [0.04, 0.06, 0.08]
  support: 0.015
  skill: { mean: 52, sd: 14 }
  risk: { perSkill: 0.25, recovery: 3, failure: 15, line: 50, reputation: 2, quality: 1.5 }
  exitYears: 2
  valueMultiple: 4
  inquiry: 0.2
  minAge: 21

quality:
  carry: 0.55
  skill: 0.25
  morale: 0.5
  noise: 4
  shortfall: 25

reputation:
  start: 45
  pull: 0.35
  noise: 4

cash:
  reserve: 0.12
  starting: 0.35

failure:
  creditIncomeMultiple: 1.2
  creditFloor: 15000
  guarantee: 0.7
  liquidation: 0.35
  nearYears: 2
  nearCash: 0.08

funding:
  loan:
    rate: 0.085
    termYears: 7
    maxShare: 0.8
    minOwn: 0.15
    incomeMultiple: 2.5
    incomeFloor: 30000
    bankruptcyYears: 7
    planBonus: 1.5
    missedSurcharge: 0.02
  investors:
    maxTotal: 49
    premoney: 1.3
    minAffection: 45
    capacity: { poor: 0, working: 5000, middle: 20000, affluent: 70000, rich: 250000 }
    max: 3
  cofounder:
    shares: [20, 33, 50]
    minAffection: 45
    minAge: 21
    cashPerShare: 0.8
    skill: { mean: 55, sd: 15 }
  minAge: 18

market:
  refreshYears: 3
  listings: { min: 3, max: 5 }
  ages: { min: 2, max: 25 }
  multiple: 2.6
  assetShare: 0.4
  chainChance: 0.3
  chainMultiple: 3.6
  reputation: { mean: 50, sd: 15 }
  quality: { mean: 50, sd: 12 }
  sale: { share: 0.92, broker: 0.05 }
  floorShare: 0.3
  maxMultiple: 3
  history: 3

events:
  expansion: 0.12
  staffRequest: 0.18
  market: 0.22
  places: 0.2
  people: 0.25
  manager: 0.25
  cofounder: 0.12
  license: 0.5
  coolOff: 3
  expansionYears: 3
  expansionProfit: 0.15

reputationEffect: { perYear: 0.4, failure: -4, cap: 1 }
netWorthShare: 0.85
happiness: { profit: 1, loss: -2, limit: 75 }
