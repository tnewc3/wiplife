# Skill is 0–100 internally; the Profile only shows these words.
levels: { basic: 10, conversational: 40, fluent: 80 }
nativeSkill: 100
# Heritage suggests a household language, never guarantees it from a surname.
heritageChance: 0.65
heritage:
  general: []
  hispanic: [es]
  french: [fr]
  chinese: [zh]
  korean: [ko]
  vietnamese: [vi]
  japanese: [ja]
  south_asian: [hi, pa, ur]
  arab: [ar]
  west_african: [yo, ig]
  filipino: [tl]
  polish: [pl]
  irish: [ga]
  black: []
  european: []
  east_asian: [zh, ko, ja]
  afro_mexican: []
  spanish: [es]
  italian: [it]
  german: [de]
# A second locally common language in bilingual households.
bilingualChance: { montreal: 0.35, houston: 0.16, ca: 0.12, us: 0.06, uk: 0.03, mx: 0.04 }
school:
  minAge: 11
  gain: 6
  # The first offered language that is not already native is the school class.
  choices: { us: [es, fr], ca: [fr, en, es], uk: [fr, es], mx: [en, fr] }
classes: { minAge: 18, gain: 12, cost: 600, interestChance: 0.12 }
immersion: { minAge: 3, gain: 8, householdGain: 4 }
fading: { graceYears: 3, loss: 1, nativeFloor: 40 }
meeting: { shared: 1.5, barrier: 0.5, affectionPenalty: 8 }
interaction:
  sharedBonus: 2
  barrierPenalty: -12
  nonverbalFactor: 0.25
  nonverbal: [hug, give_gift, play_together, pick_a_fight]
jobs:
  byCategory: { professional: fluent, trade: conversational, gig: conversational }
  countries: {}
  cities:
    montreal:
      # Software, warehouse and kitchen work can be done in English; public-facing
      # and regulated tracks retain the city's French requirement.
      software_engineer: { any: [fr, en], level: fluent }
      warehouse_worker: { any: [fr, en], level: conversational }
      food_service: { any: [fr, en], level: conversational }
eventGain: 3
# Batch 10: other ways to learn. The adult class above is the middle option; an app is cheap and slow, a tutor costs more and is fast.
# Each paid method can be used once a year. Amounts are written at US prices and scale with where you live.
methods:
  app: { cost: 120, gain: 4 }
  tutor: { cost: 1500, gain: 20 }
# Practicing with a native speaker you know (the interaction). Skill is a share of `gain` by how it went; at most `yearlyMax` a year.
practice: { gain: 5, yearlyMax: 14, great: 1.5, good: 1, neutral: 0.5 }
# Certificate exams. One sitting per language a year; you may sit it when your skill is within `margin` points under the level's bar.
# Odds = base + perPoint x (skill - bar), kept between min and max. A certificate does not fade and counts for jobs and W6 routes.
exams:
  minAge: 16
  fee: { basic: 90, conversational: 220, fluent: 380 }
  margin: 10
  odds: { base: 0.6, perPoint: 0.02, min: 0.1, max: 0.95 }
  words: { fair: 0.35, good: 0.6, strong: 0.8 }
# Raising a child in a language of your own: a child up to `nativeAge` takes it as a first language; each year at home adds skill until `maxAge`.
home: { maxAge: 12, nativeAge: 6, start: 45, yearlyGain: 8 }
# A heritage language coming back (an event or an old word returning): skill restored.
heritageReturn: { gain: 15 }
