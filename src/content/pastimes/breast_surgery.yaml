    extras:
      - chance: surgery_complication
        effects:
          - { type: health, conditionId: surgical_complication, severity: 35 }
        note: "A few days later a fever and a swollen, angry scar send you back to the clinic. It needs proper treatment."
  backfire:
    text:
      - "The recovery goes wrong. There is a serious infection, a second operation, and a long time before you feel like yourself."
      - "A complication keeps you in the hospital and out of work, and the result is the least of your worries."
