id: play_the_guitar
category: hobby
label: "Practice the guitar"
blurb: "Chords, scales and sore fingertips."
minAge: 8
inPerson: true
companion: none
cost: hobby_supplies
profile: steady
yearlyLimit: 8
hub: hobbies
hobby:
  talent: music
  skill: { great: 10, good: 7, neutral: 3, bad: 1, backfire: 0 }
tiers:
  great:
    text:
      - "Your fingers find the chord changes at last, and a whole song comes out clean."
      - "You play until it is dark and nobody has asked you to stop."
    effects: [{ type: stat, key: happiness, delta: 3 }, { type: stat, key: stress, delta: -1 }, { type: stat, key: discipline, delta: 1 }]
    events: [hobby_class_invite, hobby_someone_asks]
    eventChance: follow_up_low
  good:
    text:
      - "Practice feels flat today. You play through it, and some of it sticks."
      - "A few good minutes and a long stretch of scales."
    effects: [{ type: stat, key: happiness, delta: 2 }, { type: stat, key: stress, delta: -1 }]
    events: [hobby_someone_asks]
    eventChance: follow_up_low
  neutral:
    text:
      - "You put in the time and not much else happens. Practice is mostly this."
      - "Neither good nor bad, just another session on the pile."
    effects: [{ type: stat, key: happiness, delta: 1 }]
  bad:
    text:
      - "Your fingertips hurt and nothing sounds right. You put the guitar down early."
      - "You get a chord wrong a dozen times and almost quit."
    effects: [{ type: stat, key: stress, delta: 2 }, { type: stat, key: happiness, delta: -1 }]
    events: [hobby_burnout]
    eventChance: follow_up_low
