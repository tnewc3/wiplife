id: take_a_class_together
category: love
label: "Take a class together"
blurb: "Cooking, dancing or pottery: something new, side by side."
minAge: 18
inPerson: true
companion: required
companionKinds: [partner]
cost: couples_class
profile: love
yearlyLimit: 3
hub: dating
tiers:
  great:
    together:
      - "You and {companion.name} giggle through the class and make a mess. The teacher is delighted. It cost {cost}, and gave you a new inside joke."
      - "You spend the evening learning something new beside {companion.name}. You leave arm in arm, a little proud."
    effects:
      - { type: stat, key: happiness, delta: 4 }
      - { type: stat, key: smarts, delta: 1 }
    companion: { affection: 6, trust: 3 }
  good:
    together:
      - "A fun class with {companion.name}, and a small, shared accomplishment. {cost}."
      - "You and {companion.name} learn the basics and laugh at the rest."
    effects:
      - { type: stat, key: happiness, delta: 3 }
    companion: { affection: 4, trust: 2 }
  neutral:
    together:
      - "The class is fine. You and {companion.name} do the exercise, clean up and head home."
      - "An easy evening. You paid {cost}, and learned a little."
    effects:
      - { type: stat, key: happiness, delta: 1 }
    companion: { affection: 1, trust: 0 }
  bad:
    together:
      - "You and {companion.name} each think the other is doing it wrong. You leave cross, with a burnt dinner and a receipt for {cost}."
      - "The class is a disaster, and it takes both of you to laugh about it in the car."
    effects:
      - { type: stat, key: happiness, delta: -1 }
      - { type: stat, key: stress, delta: 2 }
    companion: { affection: -2, trust: -1 }
