id: hold_up_a_store
category: crime
label: "Hold up a store"
blurb: "A counter, a fear, and nothing to take back."
minAge: 18
inPerson: true
companion: none
cost: nothing
profile: crime_serious
yearlyLimit: 1
hub: crime
tiers:
  great:
    text:
      - "It is over in forty seconds. You walk out with {amount} and a feeling in your chest you cannot name. Then you start to shake."
      - "The cashier does not argue. You leave with {amount}, and the face behind the counter follows you for weeks."
    money: { key: loot_robbery, share: 1.5, mode: dirty }
    effects:
      - { type: stat, key: happiness, delta: 3 }
      - { type: stat, key: stress, delta: -2 }
      - { type: crime, action: heat, delta: 10 }
      - { type: stat, key: kindness, delta: -2 }
      - { type: stat, key: stress, delta: 4 }
  good:
    text:
      - "It goes faster than you imagined and less than you hoped: {amount}. You lose count of the corners you take to get away."
      - "You have {amount} in a bag and no memory of how you got to the car. It is a long drive home."
    money: { key: loot_robbery, share: 1, mode: dirty }
    effects:
      - { type: stat, key: happiness, delta: 1 }
      - { type: crime, action: heat, delta: 10 }
      - { type: stat, key: kindness, delta: -2 }
      - { type: stat, key: stress, delta: 4 }
  neutral:
    text:
      - "The door is open and your feet are stuck. You stand outside until someone looks up, then walk away as if you had been lost."
      - "At the last second you cannot do it. You walk away with nothing, and with the knowledge of how close you came."
    effects:
      - { type: stat, key: stress, delta: 2 }
  bad:
    text:
      - "The police were on the street before you were out of it. You are on your knees on the pavement, and the court gives you {sentence}."
      - "A silent alarm, a locked door, and a long wait. In the end the court gives you {sentence}."
    effects:
      - { type: legal, offenseId: robbery, outcome: sentence }
      - { type: stat, key: reputation, delta: -4 }
      - { type: stat, key: stress, delta: 5 }
      - { type: stat, key: happiness, delta: -3 }
      - { type: crime, action: heat, delta: 14 }
  backfire:
    text:
      - "It goes wrong in every way at once, and someone is hurt. You are taken away in a state of shock, and the court gives you {sentence}."
      - "A struggle, a shout, a crash. When it is over you are hurt, you are caught, and the court gives you {sentence}."
    effects:
      - { type: legal, offenseId: robbery, outcome: sentence }
      - { type: stat, key: reputation, delta: -7 }
      - { type: stat, key: stress, delta: 8 }
      - { type: stat, key: happiness, delta: -5 }
      - { type: stat, key: health, delta: -4 }
      - { type: crime, action: heat, delta: 14 }
