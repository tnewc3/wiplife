id: practice_dance
category: hobby
label: "Practice dancing"
blurb: "Counts, mirrors and aching calves."
minAge: 8
inPerson: true
companion: none
cost: hobby_supplies
profile: steady
yearlyLimit: 8
hub: hobbies
hobby:
  talent: performance
  skill: { great: 10, good: 7, neutral: 3, bad: 1, backfire: 0 }
tiers:
  great:
    text:
      - "You nail the routine from start to finish. For a few bars, everything feels effortless."
      - "Your body finally does what your head has been asking for weeks."
    effects: [{ type: stat, key: happiness, delta: 3 }, { type: stat, key: stress, delta: -1 }, { type: stat, key: discipline, delta: 1 }]
    events: [hobby_class_invite, hobby_someone_asks]
    eventChance: follow_up_low
  good:
    text:
      - "A tiring session that goes mostly to plan."
      - "You get the steps and miss the feeling."
    effects: [{ type: stat, key: happiness, delta: 2 }, { type: stat, key: stress, delta: -1 }]
    events: [hobby_someone_asks]
    eventChance: follow_up_low
  neutral:
    text:
      - "You put in the time and not much else happens. Practice is mostly this."
      - "Neither good nor bad, just another session on the pile."
    effects: [{ type: stat, key: happiness, delta: 1 }]
  bad:
    text:
      - "You trip over your own feet, and then over the same step a second time."
      - "Nothing flows, and you give up with a cramp in one calf."
    effects: [{ type: stat, key: stress, delta: 2 }, { type: stat, key: happiness, delta: -1 }]
    events: [hobby_burnout]
    eventChance: follow_up_low
