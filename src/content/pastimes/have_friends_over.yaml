id: have_friends_over
category: social
label: "Have friends over"
blurb: "Snacks, music and whoever can come."
minAge: 8
inPerson: true
companion: none
cost: party_friends
profile: night
yearlyLimit: 6
hub: parties
tiers:
  great:
    text:
      - "The living room fills up and nobody wants to leave. By midnight the snacks are gone and everyone is laughing at the same joke."
      - "One of those evenings that goes right from the first knock on the door."
    effects: [{ type: stat, key: happiness, delta: 4 }, { type: stat, key: sociability, delta: 1 }, { type: stat, key: stress, delta: -1 }]
    events: [party_old_friend_turns_up]
    eventChance: follow_up_low
  good:
    text:
      - "A warm, easy evening. People drift in and out, and the place is a happy mess when they go."
      - "You talk, you play music, you eat all the snacks. A good night in."
    effects: [{ type: stat, key: happiness, delta: 2 }, { type: stat, key: sociability, delta: 1 }]
  neutral:
    text:
      - "A few people come and nothing much happens. It was still nice to see them."
      - "The music is fine, the snacks are fine, and so is the evening."
    effects: [{ type: stat, key: happiness, delta: 1 }]
  bad:
    text:
      - "Too few people come, and the ones who do keep looking at their phones."
      - "Somebody spills something on the couch and the evening never quite recovers."
    effects: [{ type: stat, key: happiness, delta: -1 }, { type: stat, key: stress, delta: 1 }]
