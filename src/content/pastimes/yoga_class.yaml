id: yoga_class
category: mind_body
label: "Take a yoga class"
blurb: "An hour on a mat, learning to breathe and bend."
minAge: 12
inPerson: true
companion: none
cost: yoga_class
profile: calm
yearlyLimit: 6
tiers:
  great:
    text:
      - "For one long minute at the end, lying flat, your mind goes completely quiet. You walk out lighter than you walked in."
      - "The teacher talks you through a pose you thought you could not hold, and you hold it."
    effects:
      - { type: stat, key: stress, delta: -6 }
      - { type: stat, key: fitness, delta: 1 }
      - { type: stat, key: happiness, delta: 3 }
      - { type: stat, key: discipline, delta: 1 }
  good:
    text:
      - "You stretch, you breathe, and the knots in your shoulders let go a little."
      - "A calm, slow hour. You leave feeling looser than you came."
    effects:
      - { type: stat, key: stress, delta: -3 }
      - { type: stat, key: fitness, delta: 1 }
      - { type: stat, key: happiness, delta: 1 }
  neutral:
    text:
      - "You spend half the class wondering whether you are doing it right. It is fine."
      - "The class goes by. You are a little more flexible and a little self-conscious."
    effects:
      - { type: stat, key: stress, delta: -1 }
  bad:
    text:
      - "You wobble out of every pose and the person next to you is very, very good. You leave embarrassed."
      - "The room is too hot and the music too loud. You never find the calm everyone else seems to."
    effects:
      - { type: stat, key: stress, delta: 1 }
