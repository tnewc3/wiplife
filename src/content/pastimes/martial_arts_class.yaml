id: martial_arts_class
category: mind_body
label: "Train at a martial arts class"
blurb: "Drills, forms and a teacher who expects you to focus."
minAge: 8
inPerson: true
companion: none
cost: martial_arts_class
profile: steady
yearlyLimit: 6
tiers:
  great:
    text:
      - "Something finally clicks: the stance, the timing, the way your whole body moves together. The teacher nods once, and it feels like a medal."
      - "You land the technique cleanly and the whole class sees it. You are standing a little taller on the way out."
    effects:
      - { type: stat, key: fitness, delta: 3 }
      - { type: stat, key: confidence, delta: 2 }
      - { type: stat, key: discipline, delta: 2 }
      - { type: stat, key: happiness, delta: 2 }
  good:
    text:
      - "A hard, orderly hour of drills. You sweat, you bow, you learn one new thing."
      - "You get a kick right at last and keep practicing it until the class ends."
    effects:
      - { type: stat, key: fitness, delta: 2 }
      - { type: stat, key: confidence, delta: 1 }
      - { type: stat, key: discipline, delta: 1 }
  neutral:
    text:
      - "You follow the drills, a step behind the class. It is slow progress, but progress."
      - "A plain hour of repetition. Nobody is impressed and nobody minds."
    effects:
      - { type: stat, key: fitness, delta: 1 }
  bad:
    text:
      - "You get every sequence backward and the class waits while you sort it out. Your pride takes the worst of it."
      - "The teacher corrects you three times in a row. You leave stung, though not hurt."
    effects:
      - { type: stat, key: confidence, delta: -1 }
      - { type: stat, key: stress, delta: 1 }
