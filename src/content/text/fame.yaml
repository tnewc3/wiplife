# Tabloid headlines. The key is the kind of story (registries/web.yaml, in snake case) or
# "scandal" for one the scene gave them. {name} is the player's full name.
tabloid:
  affair:
    - "{name} Caught in Secret Affair"
    - "Who Was {name} Seen With? The Whole Story"
  unknown_crime:
    - "{name}'s Dark Secret: What They Got Away With"
    - "The Night {name} Hopes Nobody Remembers"
  hidden_debt:
    - "{name}'s Money Trouble Laid Bare"
    - "Behind the Glamour, {name} Is Drowning in Debt"
  addiction:
    - "{name}'s Private Struggle Goes Public"
    - "Inside {name}'s Battle With Addiction"
  identity:
    - "{name}'s Private Life Made Public"
    - "{name} Speaks After Details of Personal Life Leak"
  mental_health:
    - "{name} Reveals the Struggle Behind the Smile"
    - "{name}'s Mental Health Crisis Exposed"
  scandal:
    - "{name} Spotted Out Until Dawn Again"
    - "{name}'s Night Out Gets Out of Hand"
    - "Is {name} Spending Beyond the Spotlight?"
    - "{name}'s Entourage Under Fire"
