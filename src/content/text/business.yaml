# W3: businesses. History lines the business step and the actions write ({business}, {type}, {city}), and the words
# the yearly report uses.
history:
  started:
    importance: 3
    variants:
      - "You opened {business}, a {type} in {city}."
      - "{business} opened its doors in {city}: yours, from the sign to the lease."
      - "You started a {type} of your own in {city}, and called it {business}."
  bought:
    importance: 3
    variants:
      - "You bought {business}, a {type} in {city}, from the people who built it."
      - "{business} in {city} became yours."
  sold:
    importance: 3
    variants:
      - "You sold {business}."
      - "{business} went to a new owner."
  closed:
    importance: 2
    variants:
      - "You closed {business}."
      - "{business} shut its doors for the last time."
  failed:
    importance: 3
    variants:
      - "{business} ran out of money and closed."
      - "{business} could not pay its bills any more. It closed."
  inherited:
    importance: 3
    variants:
      - "{business} came to you from the family."
  expanded:
    importance: 2
    variants:
      - "{business} opened a new location in {city}."
      - "A second sign went up: {business} in {city}."
  managerHired:
    importance: 1
    variants:
      - "You handed the day-to-day of {business} to a manager."
  cofounder:
    importance: 2
    variants:
      - "You and a partner started {business} together."
  investorPaid:
    importance: 1
    variants:
      - "You bought out a partner in {business}."
  lostMoney:
    importance: 2
    variants:
      - "People who had put money into {business} did not get it back."
  franchised:
    importance: 3
    variants:
      - "{business} sold a franchise in {city}: the name went somewhere you will not be every day."
      - "A franchise of {business} opened in {city}."
  franchiseEnded:
    importance: 2
    variants:
      - "The {business} franchise in {city} closed."
  transferred:
    importance: 1
    variants:
      - "Someone from {business} moved to {city} to work there."
  locationManager:
    importance: 1
    variants:
      - "You put someone in charge of {business} in {city}."

report:
  customers:
    boom: "More people came through the door than ever before."
    up: "More customers than last year."
    steady: "About the same number of customers as last year."
    down: "Fewer customers than last year."
    slump: "Customers drifted away; the place felt empty."
  money:
    strong: "A strong year: the business paid well."
    profit: "A profitable year."
    thin: "A thin year: barely above break-even."
    loss: "A losing year."
    deep: "A deep loss. This cannot go on."
  staff:
    happy: "The staff are happy and it shows."
    fine: "The staff are doing fine."
    tense: "The staff are tense."
    ready_to_quit: "People are talking about leaving."
  quality:
    high: "What you sell is the best it has been."
    fine: "Quality held steady."
    slipping: "Quality is slipping."
  notes:
    unlicensed: "Nobody here holds the licence this work needs, so no jobs could be taken."
    understaffed: "The place was short of people for much of the year."
    newLocation: "A new location opened and is still finding its customers."
    quit: "Someone on staff left."
    managerSlip: "The manager seems to be letting things slide."
    rival: "A competitor is taking customers."
    buzz: "Word of mouth is working for you."
    skimmed: "The books show money that was taken."
    ranOut: "Some of what people wanted ran out before the year did, and some of them said so."
    leftover: "A lot was left over on the shelves at the end of the year."
    spoiled: "A good deal of stock spoiled before it could be sold."
    supplierUp: "Your suppliers raised their prices."
    supplierDown: "Your suppliers' prices eased."
    shortage: "A supplier could not deliver everything that was ordered."
    deal: "A better deal with a supplier lowered what you paid."
    economyBoom: "A boom: people had money and spent it."
    economySlowdown: "A slowdown: people spent more carefully."
    economyRecession: "A recession: people cut back where they could."
    turnover: "People came and went on the crew, and replacing them cost money."
    overworked: "There were more customers than the crew could comfortably serve."
    brandRisk: "How the franchises are run is starting to hurt the name."
    royalties: "The franchises paid royalties."
  economy:
    boom: "The economy is booming. People are spending on treats."
    steady: "The economy is steady."
    slowdown: "The economy is slowing. People are spending more carefully."
    recession: "The economy is in a recession. People are trading down and putting off what they can."
  suppliers:
    up: "getting dearer"
    down: "getting cheaper"
    steady: "steady"
