# Milestone entries the yearly systems write to a life's history.
# The player is "you". Importance: 1 = minor, 2 = notable, 3 = major.

# Entering a life stage. Values: {age}.
lifeStage:
  child:
    importance: 1
    variants:
      - "You turned {age}. The baby years are behind you."
      - "At {age}, you're a kid now, not a toddler."
  teen:
    importance: 2
    variants:
      - "You turned {age} and officially became a teenager."
      - "At {age}, you're a teenager. Everything feels more dramatic."
  youngAdult:
    importance: 2
    variants:
      - "You turned {age}. You're an adult now, at least on paper."
      - "At {age}, you're legally an adult."
  adult:
    importance: 1
    variants:
      - "You turned {age}. Your twenties are over."
      - "At {age}, people have stopped calling you a kid."
  senior:
    importance: 2
    variants:
      - "You turned {age} and became a senior citizen."
      - "At {age}, you've reached your senior years."

# A relative, partner or friend dies. Role: npc. Values: {relation}, {age}.
familyDeath:
  importance: 3
  variants:
    - "Your {relation}, {npc.name}, died at the age of {age}."
    - "{npc.name}, your {relation}, passed away at {age}."

# You die. Values: {age}, {cause}.
death:
  importance: 3
  variants:
    - "You died of {cause} at the age of {age}."

# Changes of home. Values: {city}; relocated also has {from}.
home:
  movedOut:
    importance: 2
    variants:
      - "You moved out and rented your own place in {city}."
      - "You signed your first lease in {city} and moved out."
  movedHome:
    importance: 2
    variants:
      - "You moved back in with your family in {city}."
      - "You packed up and moved back home to {city}."
  relocated:
    importance: 2
    variants:
      - "You left {from} and moved to {city}."
      - "You packed your life into boxes and moved from {from} to {city}."
  boughtHome:
    importance: 3
    variants:
      - "You bought a home in {city}."
      - "You got the keys to a home of your own in {city}."
  soldHome:
    importance: 2
    variants:
      - "You sold your home in {city}."
  familyHomeGone:
    importance: 2
    variants:
      - "With no family left to live with, you rented a place of your own in {city}."
  evicted:
    importance: 3
    variants:
      - "You were evicted from your apartment in {city}."
      - "You fell too far behind on rent and were evicted in {city}."
  foreclosed:
    importance: 3
    variants:
      - "The bank foreclosed on your home in {city}."

# Money milestones. No values.
money:
  collections:
    importance: 1
    variants:
      - "One of your debts went to collections."
  mortgagePaidOff:
    importance: 3
    variants:
      - "You made the last payment on your mortgage. The house is yours."
  startedGig:
    importance: 1
    variants:
      - "You started picking up gig work."
      - "You signed up for gig work: deliveries, rides, odd jobs."
