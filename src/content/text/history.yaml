# Milestone entries the yearly systems write to a life's history.
# The player is "you". Importance: 1 = minor, 2 = notable, 3 = major.

# Entering a life stage. Values: {age}.
lifeStage:
  child:
    importance: 1
    variants:
      - "You turned {age}. The baby years are behind you."
      - "At {age}, you're a kid now, not a toddler."
  teen:
    importance: 2
    variants:
      - "You turned {age} and officially became a teenager."
      - "At {age}, you're a teenager. Everything feels more dramatic."
  youngAdult:
    importance: 2
    variants:
      - "You turned {age}. You're an adult now, at least on paper."
      - "At {age}, you're legally an adult."
  adult:
    importance: 1
    variants:
      - "You turned {age}. Your twenties are over."
      - "At {age}, people have stopped calling you a kid."
  senior:
    importance: 2
    variants:
      - "You turned {age} and became a senior citizen."
      - "At {age}, you've reached your senior years."

# A relative, partner or friend dies. Role: npc. Values: {relation}, {age}.
familyDeath:
  importance: 3
  variants:
    - "Your {relation}, {npc.name}, died at the age of {age}."
    - "{npc.name}, your {relation}, passed away at {age}."

# You die. Values: {age}, {cause}.
death:
  importance: 3
  variants:
    - "You died of {cause} at the age of {age}."

# Changes of home. Values: {city}; relocated also has {from}.
home:
  movedOut:
    importance: 2
    variants:
      - "You moved out and rented your own place in {city}."
      - "You signed your first lease in {city} and moved out."
  movedHome:
    importance: 2
    variants:
      - "You moved back in with your family in {city}."
      - "You packed up and moved back home to {city}."
  relocated:
    importance: 2
    variants:
      - "You left {from} and moved to {city}."
      - "You packed your life into boxes and moved from {from} to {city}."
  boughtHome:
    importance: 3
    variants:
      - "You bought a home in {city}."
      - "You got the keys to a home of your own in {city}."
  soldHome:
    importance: 2
    variants:
      - "You sold your home in {city}."
  familyHomeGone:
    importance: 2
    variants:
      - "With no family left to live with, you rented a place of your own in {city}."
  evicted:
    importance: 3
    variants:
      - "You were evicted from your apartment in {city}."
      - "You fell too far behind on rent and were evicted in {city}."
  foreclosed:
    importance: 3
    variants:
      - "The bank foreclosed on your home in {city}."
  # Role: npc (the partner who moved out); no values.
  movedApart:
    importance: 2
    variants:
      - "{npc.name} moved out."
      - "{npc.name} packed {npc.their} things and moved out."

# Money milestones. No values.
money:
  collections:
    importance: 1
    variants:
      - "One of your debts went to collections."
  mortgagePaidOff:
    importance: 3
    variants:
      - "You made the last payment on your mortgage. The house is yours."
  startedGig:
    importance: 1
    variants:
      - "You started picking up gig work."
      - "You signed up for gig work: deliveries, rides, odd jobs."

# School (Stage 7). Values: {school} a school's name, {subject} what you
# study, {grade} a letter grade, {degree} a grad degree, {license} a trade
# license.
education:
  startedSchool:
    importance: 1
    variants:
      - "You started kindergarten, with a new backpack and very strong opinions about it."
      - "You started school. The first day involved some crying, not all of it yours."
  startedMiddle:
    importance: 1
    variants:
      - "You started middle school: lockers, bells and a lot of new hallways."
  startedHigh:
    importance: 1
    variants:
      - "You started high school."
      - "You walked into high school as a freshman."
  heldBack:
    importance: 2
    variants:
      - "You failed too many classes and had to repeat a year of high school."
      - "You were held back a year in high school."
  graduatedHigh:
    importance: 3
    variants:
      - "You graduated from high school, with grades averaging {grade}."
      - "You crossed the stage and got your high school diploma. Final grades: {grade}."
  droppedOut:
    importance: 3
    variants:
      - "You dropped out of {school}."
      - "You walked away from {school} without finishing."
  expelled:
    importance: 3
    variants:
      - "You were expelled from {school}."
  passedGed:
    importance: 2
    variants:
      - "You passed the GED and earned your high school equivalency."
  failedGed:
    importance: 1
    variants:
      - "You took the GED and didn't pass."
  admitted:
    importance: 2
    variants:
      - "You were accepted to {school}."
      - "The letter from {school} said yes."
  rejected:
    importance: 1
    variants:
      - "{school} turned down your application."
  withdrawn:
    importance: 2
    variants:
      - "Without a diploma, you lost your place at {school}."
  declined:
    importance: 1
    variants:
      - "You turned down your place at {school}."
  enrolled:
    importance: 2
    variants:
      - "You started at {school}, studying {subject}."
  returned:
    importance: 2
    variants:
      - "You went back to {school} to finish studying {subject}."
  returnedHigh:
    importance: 2
    variants:
      - "You went back to {school} to finish what you started."
  changedMajor:
    importance: 1
    variants:
      - "You switched your major to {subject}."
  graduatedAssociate:
    importance: 3
    variants:
      - "You graduated from {school} with an associate degree in {subject}. Final grades: {grade}."
  graduatedBachelor:
    importance: 3
    variants:
      - "You graduated from {school} with a bachelor's degree in {subject}. Final grades: {grade}."
      - "You earned your bachelor's degree in {subject} from {school}. Final grades: {grade}."
  graduatedGrad:
    importance: 3
    variants:
      - "You finished at {school} with {degree}. Final grades: {grade}."
  licensed:
    importance: 3
    variants:
      - "You finished at {school} and earned your {license}."

# Work (Stage 8). Values: {title} a job title ("junior developer"),
# {employer} where you work, {years} how many years you worked.
career:
  hired:
    importance: 2
    variants:
      - "You started at {employer} as their new {title}."
      - "You got a job at {employer}, starting as {title}."
  promoted:
    importance: 2
    variants:
      - "You were promoted to {title} at {employer}."
      - "{employer} made you {title}."
  fired:
    importance: 3
    variants:
      - "{employer} fired you."
      - "You were fired from your job at {employer}."
  laidOff:
    importance: 3
    variants:
      - "You were laid off from {employer}."
      - "{employer} cut jobs, and yours was one of them."
  quit:
    importance: 2
    variants:
      - "You quit your job at {employer}."
      - "You handed in your notice at {employer}."
  leftForSchool:
    importance: 2
    variants:
      - "You left your job at {employer} to go back to school."
  # A job lined up in your last year of school that fell through when your
  # plans changed (you left school, or your degree changed).
  fellThrough:
    importance: 2
    variants:
      - "Your plans changed, and the job lined up at {employer} fell through."
  moved:
    importance: 2
    variants:
      - "Moving away meant leaving your job at {employer}."
  # Lost to a prison sentence (Stage 9).
  jailed:
    importance: 2
    variants:
      - "Going to prison cost you your job at {employer}."
  retired:
    importance: 3
    variants:
      - "You retired after {years} years of work."
      - "You hung up your work clothes for good after {years} working years."

# Health milestones (Stage 9). Values: {condition}, as it reads in a
# sentence ("type 2 diabetes", "a bad back").
health:
  diagnosed:
    importance: 2
    variants:
      - "You were diagnosed with {condition}."
      - "A doctor put a name to it: {condition}."
  treated:
    importance: 1
    variants:
      - "You started treatment for {condition}."
  recovered:
    importance: 2
    variants:
      - "You got over {condition}."
      - "You finally shook off {condition}."
  # M1: a mental health condition you had recovered from came back.
  relapsed:
    importance: 2
    variants:
      - "{condition} came back."
      - "The old weight of {condition} returned."

# The law (Stage 9). Values: {offense} ("shoplifting"), {amount} (a fine),
# {years} ("two years").
legal:
  warning:
    importance: 2
    variants:
      - "You got off with a warning for {offense}."
  fine:
    importance: 2
    variants:
      - "You were fined {amount} for {offense}."
  probation:
    importance: 3
    variants:
      - "You were sentenced to {years} of probation for {offense}."
  jail:
    importance: 3
    variants:
      - "You were sentenced to {years} in prison for {offense}."
      - "A judge sent you to prison for {years} for {offense}."
  released:
    importance: 3
    variants:
      - "You walked out of prison a free person."
      - "You were released from prison."
  probationEnded:
    importance: 1
    variants:
      - "Your probation ended."

# Your children (E2a). Role: npc, the child. No values.
family:
  childMovedOut:
    importance: 2
    variants:
      - "{npc.name} moved out. The house got quieter, and so did you."
      - "{npc.name} packed up and moved out on {npc.their} own."
      - "{npc.name} left home. You helped carry the boxes and tried not to say much."

# Self-discovery (Stage 9): accepting something about yourself, or changing
# how you describe yourself. Values: {people} ("men and women"), {gender},
# {expression}, {pronouns} ("she/her"), {trait} (a phrase), {talent} ("music").
discovery:
  attraction:
    importance: 3
    variants:
      - "You came to understand that you're attracted to {people}."
  gender:
    importance: 3
    variants:
      - "You came to know yourself as {gender}."
  expression:
    importance: 2
    variants:
      - "You started presenting in a more {expression} way."
  pronouns:
    importance: 2
    variants:
      - "You started going by {pronouns}."
  personality:
    importance: 2
    variants:
      - "You found {trait}."
  talent:
    importance: 2
    variants:
      - "You discovered a real gift for {talent}."
