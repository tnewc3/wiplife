# Elapsed time in follow-up text (C1): {since} is how long ago the event
# that set up this follow-up happened ("two years"), so follow-ups never
# state a fixed gap like "years later". Values: {n}, from numbers below.
since:
  one: "a year"
  many: "{n} years"
  # When the follow-up wasn't scheduled by an earlier event.
  unknown: "a while"

# Small numbers in words; larger ones are written as digits. Index 0 is zero.
numbers: [zero, one, two, three, four, five, six, seven, eight, nine, ten]
