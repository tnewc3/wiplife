# Lines the sports systems write (E6c). The player is "you". Everything named
# here is made up. History values: {sport}, {team}, {league}, {pick}, {draftRound}, {position}.

# Batch 5: the kinds of team you try out for.
tiers:
  rec: { label: Rec league, suffix: Rec, blurb: "Everyone plays, nobody keeps score for long, and the snacks are better than the coaching." }
  club: { label: Club team, blurb: "Practices twice a week, a real schedule and parents who bring folding chairs." }
  travel: { label: Travel team, suffix: Travel, blurb: "Tournaments in other towns, a team bus and a coach who knows who is watching." }
  academy: { label: Club academy, suffix: Academy, blurb: "The club's own youth system: trained like a professional, judged like one too." }
  jv: { label: Junior varsity, suffix: JV, blurb: "The team below the team: real games, a real bench and a way up if you earn it." }
  varsity: { label: Varsity, blurb: "The school's team, with its name on the front of the jersey and its pride on the line." }
  community: { label: Community college team, blurb: "A smaller program with open doors, long bus rides and coaches who remember every player." }
  state: { label: State program, blurb: "A big school with a real schedule, a real crowd and a roster that is hard to crack." }
  elite: { label: Elite program, blurb: "A national name, scouts in the stands and a line of players behind you waiting for your spot." }

# A pro camp, in words.
camp: { label: Pro camp, blurb: "A camp: coaches, a roster with spots and a few days to be noticed." }

# What the list says after a tryout. Values: {team}, {tier}, {sport}.
tryout:
  made:
    - "You made {team}. Your name was on the list, third from the top, and you read it four times."
    - "The coaches kept you: {team}. Someone you did not know slapped your shoulder in the hall."
    - "{team} took you. The sheet on the door had your name, spelled right."
  fallback:
    - "{team} did not keep you, but {fallback} did. It is not the team you wanted, and it is a team."
    - "You were cut from {team}. {fallback} called the same afternoon and said they had a place."
    - "The list at {team} did not have your name. {fallback} did."
  cut:
    - "{team} did not have a place for you, and neither did any team one step down. The gym emptied around you."
    - "You were cut from {team}. Nobody else called. You can try again next year, and you will know what to work on."
    - "No team kept you this time. The coach said the door was not shut, and you could not tell if that was kindness."
  signed:
    - "{team} signed you out of camp. The paperwork was one page and the pen did not work the first time."
    - "You came to camp as a name on a list and left with a deal from {team}."
  camp:
    - "The camp ended without an offer from {team}. The coach shook your hand anyway."
    - "{team} thanked you for coming. You drove home counting what you would do differently."

# Where a prospect is projected to go (the bands are in balance/sports.yaml draft.projection).
projection:
  lottery: { label: the top of the board, line: "Scouts have you near the top of the board: a first pick is possible." }
  early: { label: an early pick, line: "You are projected as an early pick, in the first round." }
  middle: { label: the middle of the draft, line: "You are projected in the middle of the draft, a pick that could go either way." }
  late: { label: a late pick, line: "You are projected as a late pick, if your name is called at all." }
  unlikely: { label: undrafted, line: "You are unlikely to be drafted. Camps and open tryouts are where you will earn a look." }

history:
  drafted:
    importance: 3
    variants:
      - "You were taken {pick} in the draft by {team}. Your name was read out on a stage, and you did not hear the next three."
      - "{team} picked you in the {draftRound} round. The call came before the announcement, and the announcement still made you cry."
  undrafted:
    importance: 2
    variants:
      - "The draft ended without your name. You sat with your phone for an hour, waiting for it to ring."
      - "Nobody called your name. A few teams called afterwards, quieter, and that was where it started."
  signed:
    importance: 2
    variants:
      - "You signed with {team}."
      - "{team} gave you a deal and a locker, and you took both."
  traded:
    importance: 2
    variants:
      - "You were traded to {team}, and found out from a message on your phone."
      - "{team} traded for you. You packed the apartment in two days."
  released:
    importance: 3
    variants:
      - "{team} let you go. The call was short, and the box for your locker was already packed."
      - "You were cut by {team}, and drove home with the radio off."
  title:
    importance: 3
    variants:
      - "You won {trophy} with {team}. You will remember where you were standing for the rest of your life."
      - "{team} won {trophy}, and you were part of it. Somebody put a trophy in your hands and then took a photograph you still have."
  allStar:
    importance: 2
    variants:
      - "You were named an all-star for the first time."
      - "They put your name on the all-star list. Your phone did not stop for a day."
  retired:
    importance: 3
    variants:
      - "You retired from {sport}. The game went on without you the next day, the way it does."
      - "You hung it up. {sport} had been the shape of every year, and now it was not."
  aged:
    importance: 2
    variants:
      - "You did not make the next team, and that was the end of {sport} as a thing you did every week."
      - "The next level did not have a place for you. You turned in your kit and went home."
  madeTeam:
    importance: 2
    variants:
      - "You made {team}."
      - "{team} kept you after the tryout."
  cutTeam:
    importance: 2
    variants:
      - "You were cut at a tryout and no team kept you."
      - "You went to a tryout and left without a place."
  scholarship:
    importance: 3
    variants:
      - "You signed for {campus}. The {scholarship} covers {share} of the fee."
      - "{campus} wanted you, and the {scholarship} pays {share} of the fee."
  scholarshipEnded:
    importance: 2
    variants:
      - "Your {scholarship} at {campus} ended."
      - "The {scholarship} at {campus} was gone, and the bill was yours."
  captain:
    importance: 2
    variants:
      - "Your teammates made you captain of {team}."
      - "You wore the captain's band for {team}."
  signedCamp:
    importance: 3
    variants:
      - "You earned a deal at camp: {team} signed you."
      - "After a camp and a long wait, {team} gave you a deal."

# Names for a season, in the season report. Values: {year}, {team}.
seasons:
  - "The {year} season"
  - "{year} with {team}"
  - "The {year} campaign"
  - "A year with {team}"

# Short quotes about a season by how it was received (the same bands as E6b): from the press, and from fans. Values: {team}, {sport}.
press:
  flop:
    - "\"A season to forget for {team}, and for the player at the centre of it.\""
    - "\"The numbers never came, and neither did the answers.\""
  solid:
    - "\"A steady year: nothing to be ashamed of, little to build a poster around.\""
    - "\"Reliable, and hard to replace, even if no one is writing songs about it.\""
  hit:
    - "\"A season that made the rest of the league take note.\""
    - "\"{team} knew what it was doing when it built the side around this player.\""
  acclaimed:
    - "\"One of the great seasons the game has seen in a while, and the voters will have a hard time ignoring it.\""
    - "\"Complete, calm and almost unfair: the best year of anyone in {sport}.\""
  cult:
    - "\"The numbers are only part of it. The people who watch closely say this was something special.\""
    - "\"Analysts rate the season far higher than the standings do.\""
  crowd:
    - "\"The crowd got what it came for, and the critics will keep arguing about the rest.\""
    - "\"Loud, popular and a little showy: a season the fans loved more than the writers did.\""
fans:
  flop:
    - "\"We expected more. A lot more.\""
    - "\"I still believe in you. Please give me a reason to.\""
  solid:
    - "\"Good enough for me. Same time next year?\""
    - "\"You always show up, and I'll always show up for that.\""
  hit:
    - "\"I took my kids to every home game and they want your number on their jerseys.\""
    - "\"Best year yet. I don't think you know what it means to us.\""
  acclaimed:
    - "\"I cried at the final whistle. I'm not embarrassed.\""
    - "\"Everyone in this town is talking about {team}, and about you.\""
  cult:
    - "\"People who watch the replays know. We know.\""
    - "\"The stats don't say it, but the real fans do: you were something else.\""
  crowd:
    - "\"Best seats in the house, and worth every cent.\""
    - "\"I've never been so loud in my life.\""
