id: test_hello
title: Hello there
text: '{parent.name} waves at you from across the room.'
tone: light
category: family
rarity: common
lifeStages: [early]
requires: { age: { eq: 1 } }
weight: { base: 10 }
once: true
cast:
  parent: { kind: parent, presence: household }
choices:
  - id: wave
    label: Wave back
    outcome:
      text: '{parent.name} laughs and waves again, then drops a dollar in your piggy bank.'
      effects:
        - { type: stat, key: happiness, delta: 2 }
        - { type: money, delta: 1 }
  - id: hide
    label: Hide behind the couch
    outcome:
      text: You peek out. {parent.name} is still waving.
