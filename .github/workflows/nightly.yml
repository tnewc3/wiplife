name: Nightly

# The large runs from docs/technical.md, section Q.
#
# - Lifespan and invariant test: 10,000 lives as 16 shards of 625, each the size of a
#   pull request's shard, so no timeout is raised (every pull request runs 4 of them).
# - Simulation: 10,000 lives as 4 parallel jobs of 2,500 (seeds nightly-1 to nightly-4;
#   each is the default run, the careful and careless players and the careful players'
#   lives continued as heirs for three generations). One job of 10,000 would need more
#   than the 6 hours a job may run.
# - A spamming-player run and the content coverage report.
#
# Every job runs its steps even when an earlier one failed and uploads its reports, so one
# failure never hides the others' results.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  lifespan:
    name: Lifespan and invariants (10,000 lives, 16 shards)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content build
        run: npm run content
      - name: Lifespan and invariant test
        run: npx vitest run src/engine/lifespan
        env:
          LIFESPAN_LIVES: '10000'

  simulation:
    name: Simulation (2,500 lives, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content build
        run: npm run content
      - name: Simulation (2,500 lives)
        run: npm run simulate -- --lives 2500 --seed nightly-${{ matrix.shard }} --json simulation-report-${{ matrix.shard }}.json
      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report-${{ matrix.shard }}
          path: simulation-report-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  extras:
    name: Spamming player and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content build
        run: npm run content
      - name: Simulation, spamming player (1,000 lives)
        if: always()
        run: npm run simulate -- --lives 1000 --player spammer --json spammer-report.json
      - name: Content coverage report (2,000 lives)
        if: always()
        run: npm run coverage -- --lives 2000 --json coverage-report.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-reports
          path: |
            spammer-report.json
            coverage-report.json
          if-no-files-found: ignore
          retention-days: 30
