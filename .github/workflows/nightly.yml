name: Nightly

# The large runs from docs/technical.md, section Q: the 10,000-life lifespan
# and invariant test (every pull request runs 2,500 of those lives) and a
# 10,000-life simulation, with its report saved.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  large-runs:
    name: 10,000 lives
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Content build
        run: npm run content

      - name: Lifespan and invariant test (10,000 lives)
        run: npx vitest run src/engine/lifespan
        env:
          LIFESPAN_LIVES: '10000'

      - name: Simulation (10,000 lives)
        run: npm run simulate -- --lives 10000 --json simulation-report.json

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: simulation-report.json
          if-no-files-found: ignore
          retention-days: 30
